# Rhythms, triggers, away mode. Copied to user/settings/rhythms.yaml by nova-setup at step 5; adjusted at step 10.
# Format: system/schemas/settings.md. Triggers: system/triggers.md.
work_hours: { days: [mon, tue, wed, thu, fri], start: "08:00", end: "18:00" }
moments:
  morning_thoughts: on
  evening_thoughts: on
  daily_brief: on
  weekly_review: on
  status_updates: { enabled: true, audiences: [], day: fri }
  goal_progress: on
  user_health_check: on
  system_health_check: on
  automation_review: on
  reset_goals: on
  role_refresh: on
  performance_review: on
triggers:
  new_project: on
  new_key_person: on
  deadline_approaching: { enabled: true, days: 3 }
  key_meeting_upcoming: on
  commitment_overdue: on
  playbook_start: on
insights:
  brief_max: 3
  engagement: adaptive           # adaptive | fixed
  suppressed_kinds: []           # insight kinds the user turned off
meetings:                        # which calendar events Nova shows and preps (filter: system/schemas/settings.md)
  all_day: include               # include | skip (deadlines and milestones always show)
  tentative: include             # include | skip
  not_responded: include         # include | skip (invitations not yet answered)
away:                            # set by nova-away; all null when not away
  start: null                    # YYYY-MM-DD (first day away)
  end: null                      # YYYY-MM-DD (last day away, inclusive); null while away = until the user says they are back
  set_on: null
paused: []                       # e.g. - { job: weekly-review, until: 2026-11-01 }
