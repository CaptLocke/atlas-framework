# Nova core settings. Copied to user/settings/nova.yaml by nova-setup at step 5 (attestation).
# Format: system/schemas/settings.md. Placeholders (null) are filled during setup.
user_display_name: null                # e.g. "Maya Chen"
timezone: null                         # IANA, e.g. America/Los_Angeles
repo: null                             # owner/name of this repo
installed_version: null                # setup writes system/VERSION; nova-update keeps it current
data_version: null                     # setup writes system/manifest.yaml: data_version; migrations keep it current
plan: null                             # pro | max_5x | max_20x | team | enterprise (user-stated)
attestation: null                      # REQUIRED before any ingestion; recorded in chat at setup step 5
#  statement: "I confirm I am permitted to store work information from my employer in this private GitHub repository."
#  employer: "[[organizations/<slug>]]"
#  role: <role>
#  recorded_on: YYYY-MM-DD
#  nova_version: <version>
#  reconfirm_due: YYYY-MM-DD           # first business day of next quarter
deliverables_folder:                   # where finished files are saved
  connector: null                      # connector name from connectors.yaml, or null (download only)
  path: "Nova Deliverables"
  folder_id: null
drop_folder:
  connector: null                      # or null if no cloud drive
  path: "Nova Drop"
  folder_id: null
first_brief_delivered: null            # set by daily-brief on the first brief
