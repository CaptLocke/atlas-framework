# Rhythms, triggers, away mode. Copied to user/settings/rhythms.yaml by nova-setup (step 10).
# Format: system/schemas/settings.md. Triggers: system/triggers.md.
work_hours: { days: [mon, tue, wed, thu, fri], start: "08:00", end: "18:00" }
moments:
  morning_thoughts: on
  evening_thoughts: on
  daily_brief: on
  weekly_review: on
  status_updates: { on: true, audiences: ["[[people/dana-ruiz]]"], day: fri }
  goal_progress: on
  user_health_check: on
  system_health_check: on
  automation_review: on
  reset_goals: on
  role_refresh: on
  performance_review: on
triggers:
  new_project: on
  new_key_person: on
  deadline_approaching: { on: true, days: 3 }
  key_meeting_upcoming: on
  commitment_overdue: on
insights:
  brief_max: 3
  engagement: adaptive           # adaptive | fixed
away:                            # set by nova-away; all null when not away
  start: null                    # YYYY-MM-DD (first day away)
  end: null                      # YYYY-MM-DD (last day away)
  set_on: null
paused:
  - { job: weekly-review, until: 2026-11-01 }
  - { moment: evening_thoughts, until: null }
