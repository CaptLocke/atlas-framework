# Autonomy settings. Copied to user/settings/governance.yaml by atlas-setup.
# PROTECTED (N6): changes only in chat with the user's explicit confirmation.
# Levels: auto | propose | approve | never. Locked classes cannot be changed.
# Format and override scope grammar: system/schemas/settings.md; meaning: system/rules/governance.md.
autonomy:
  # inside Atlas
  read: auto
  records_write: auto
  merge_supersede: auto          # clear cases follow this; ambiguous always proposed
  archive: auto
  dashboards_refresh: auto
  profile_update: propose
  user_content_edit: propose
  behavior_settings: propose
  extensions_create: propose
  updates_minor: auto            # patch + minor releases
  updates_major: propose
  # outside Atlas
  external_read: auto
  web_research: auto
  drafts_create: auto
  docs_create: auto
  deliverables_save: auto
  drop_folder_housekeeping: auto
  own_items_organize: propose
  docs_edit: propose
  own_calendar_manage: propose
  tasks_manage: propose
  shared_records_update: propose
  # locked
  governance_settings: approve
  send_communication: approve
  share_expose: approve
  destructive: approve           # includes forget and purge
  financial_legal_security: never
overrides:
  - scope: "organizations/acme"
    records_write: propose
  - scope: "connector:outlook"
    drafts_create: propose
  - scope: "category:crm"
    shared_records_update: approve
