# Atlas system manifest. System-owned; replaced on every update.
name: Atlas
version: 1.0.2            # must match system/VERSION
data_version: 1           # user data format version this release expects (see system/migrations/)
min_plan: pro             # minimum Claude plan
support_email: atlas.framework.support@gmail.com # issue reports (atlas-report-issue)
upstream: CaptLocke/atlas-framework  # public repo releases are fetched from
kernel_version: 2         # must equal the boot marker in system/kernel.md (atlas-kernel-<N>)
bootstrap_version: 2      # must equal "Atlas bootstrap <N>" in system/templates/bootstrap-stub.md

# The ONLY paths updates replace and N5 protects. Everything else is user-owned.
owned_paths:
  - CLAUDE.md
  - README.md
  - LICENSE
  - CHANGELOG.md
  - SECURITY.md
  - .gitignore
  - docs/
  - .claude/
  - system/

# Model roles. Routines are configured from these; an update can change them.
models:
  fast: claude-sonnet-5-5       # ingest, maintenance
  strongest: claude-opus-5-5    # judgment and writing

# Automation profiles shipped in system/routine-profiles/
profiles: [lean, standard, full]
