<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Goals</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.goal-head .rank { font-family: var(--font-heading); color: var(--star); margin-right: .45rem; font-variant-numeric: tabular-nums; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem 1.25rem; display: grid; gap: .75rem; }
.goal + .goal { margin-top: 1rem; }
.goal-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1rem; align-items: baseline; }
.goal h3 { font-size: 1.3rem; }
.goal-measure { display: grid; gap: .35rem; max-width: 34rem; }
.goal-measure p { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; color: var(--ink-2); }
.goal-measure b { color: var(--ink); font-size: 1rem; }
.goal-cols { display: grid; gap: 1rem 2rem; }
@media (min-width: 46rem) { .goal-cols { grid-template-columns: 1fr 1fr; } }
.goal h4 { font-family: var(--font-body); font-size: .85rem; color: var(--ink-2); font-weight: 600; margin-bottom: .35rem; }
.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; font-size: .93rem; }
.ev li { padding-left: 1.1rem; position: relative; }
.ev li::before { position: absolute; left: 0; top: 0; font-weight: 700; }
.ev li[data-dir="for"]::before { content: "+"; color: var(--ok); }
.ev li[data-dir="against"]::before { content: "\2212"; color: var(--danger); }
.ev li[data-dir="neutral"]::before { content: "\00B7"; color: var(--ink-2); }
.wins { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.wins li { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .1rem 1rem; }
.wins time { color: var(--ink-2); font-size: .875rem; font-variant-numeric: tabular-nums; padding-top: .1rem; }
.wins .w-body { display: grid; gap: .2rem; }
.wins .item-meta { font-size: .82rem; }
@media (max-width: 34rem) { .wins li { grid-template-columns: minmax(0, 1fr); } }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var ASSESS_TONE = { on_track: "ok", at_risk: "warn", off_track: "danger" };

  function wins(list) {
    return h("ul", { class: "wins" }, L(list).map(function (a) {
      return h("li", null, h("time", { datetime: a.date }, N.dateY(a.date)),
        h("div", { class: "w-body" }, h("p", null, N.rich(a.text)),
          a.goal || a.ref ? h("p", { class: "item-meta" }, a.goal ? h("span", null, N.name(a.goal)) : null, a.ref ? N.rid(a.ref.id || a.ref) : null) : null));
    }));
  }

  N.page({ title: "Goals" }, function (d, main) {
    var STATUS_ORDER = { active: 0, draft: 1 };
    var ASSESS_ORDER = { off_track: 0, at_risk: 1, on_track: 3 };
    var goals = L(d.goals).map(function (g, i) { return { g: g, i: i }; }).sort(function (a, b) {
      var x = a.g, y = b.g;
      var sx = x.status in STATUS_ORDER ? STATUS_ORDER[x.status] : 2, sy = y.status in STATUS_ORDER ? STATUS_ORDER[y.status] : 2;
      if (sx !== sy) return sx - sy;
      if (x.status === "active") {
        var rx = typeof x.rank === "number" ? x.rank : Infinity, ry = typeof y.rank === "number" ? y.rank : Infinity;
        if (rx !== ry) return rx < ry ? -1 : 1;
        if (rx === Infinity) {
          var ax = x.assessment in ASSESS_ORDER ? ASSESS_ORDER[x.assessment] : 2, ay = y.assessment in ASSESS_ORDER ? ASSESS_ORDER[y.assessment] : 2;
          if (ax !== ay) return ax - ay;
        }
      }
      return a.i - b.i;
    }).map(function (o) { return o.g; });
    var body = goals.length ? goals.map(function (g) {
      var hid = "g-" + g.id.replace(/\W/g, "-");
      var ev = L(g.evidence);
      return h("article", { class: "goal", "aria-labelledby": hid },
        h("div", { class: "goal-head" },
          h("h3", { id: hid }, g.status === "active" && typeof g.rank === "number" ? h("span", { class: "rank", title: "Your rank for this goal" }, "#" + g.rank) : null, g.title),
          h("div", { class: "chips" }, g.assessment ? N.chip(N.label(g.assessment), ASSESS_TONE[g.assessment]) : null, g.status !== "active" ? N.status(g.status) : null)),
        g.summary ? h("p", { class: "item-text" }, N.rich(g.summary)) : null,
        g.metric ? h("div", { class: "goal-measure" },
          h("p", null, h("span", null, g.metric), h("span", null, h("b", null, g.current || "No reading yet"), g.target ? " of " + g.target : "")),
          N.bar(g.progress, g.progress != null ? Math.round(g.progress * 100) + "% of target" : null)) : null,
        N.facts([["Period", g.period], ["Owner", g.owner ? N.name(g.owner) : null], ["Last measured", g.current_as_of ? N.date(g.current_as_of) : null]]),
        g.insight ? h("p", { class: "item-insight" }, N.rich(g.insight)) : null,
        h("div", { class: "goal-cols" },
          h("div", null, h("h4", null, "Evidence"), ev.length ? h("ul", { class: "ev" }, ev.map(function (e) {
            return h("li", { "data-dir": e.direction || "neutral" }, h("span", { class: "visually-hidden" }, e.direction === "against" ? "Against: " : e.direction === "for" ? "For: " : ""), N.rich(e.text), e.ref ? [" ", N.rid(e.ref.id || e.ref)] : null);
          })) : N.empty("No evidence recorded yet.")),
          h("div", null, h("h4", null, "Projects"), L(g.projects).length ? h("ul", { class: "ev" }, L(g.projects).map(function (p) {
            return h("li", { "data-dir": "neutral" }, N.ref(p), p.health ? [" ", N.status(p.health)] : null);
          })) : N.empty("No linked projects."))),
        L(g.accomplishments).length ? h("div", null, h("h4", null, "Accomplishments this period"), wins(g.accomplishments)) : null,
        N.rid(g.id));
    }) : N.empty("No active goals. Tell Atlas your goals in chat to add them.");
    main.appendChild(N.section({ id: "goals", title: "Goals", count: N.total("goals", goals.length), key: "goals",
      note: "In the order you ranked them. Progress, evidence for and against, and the work behind each goal.", body: body }));

    var log = L(d.accomplishments);
    main.appendChild(N.section({ id: "accomplishments", title: "Accomplishments", count: N.total("accomplishments", log.length), key: "accomplishments",
      note: "A running record for your performance review. Newest first.",
      body: log.length ? h("div", { class: "items", style: "padding:1rem 1.1rem" }, wins(log)) : N.empty("No accomplishments recorded yet. The weekly review adds them.") }));

    var active = goals.filter(function (g) { return g.status === "active"; });
    return { subtitle: "What you're working toward, and how it's going.",
      stats: (d.period && d.period.label ? [[d.period.label, "period"]] : []).concat([[active.length, ["active goal", "active goals"]],
        [active.filter(function (g) { return g.assessment === "on_track"; }).length, "on track"],
        [active.filter(function (g) { return g.assessment === "at_risk" || g.assessment === "off_track"; }).length, "need attention"],
        [N.total("accomplishments", log.length), ["accomplishment", "accomplishments"]]]) };
  });
})();
</script>
</body>
</html>
