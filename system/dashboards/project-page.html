<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Project</title>
<style id="atlas-base">
/* Atlas dashboard base styles.
   CANONICAL COPY. Every template in system/dashboards/*.html inlines this file
   verbatim inside <style id="atlas-base">. Edit this file, then run
   `python3 system/tests/dashboards/render.py --sync` to copy it into the
   templates, and `--check` to confirm they match.

   Theming: atlas-dashboards fills <style id="atlas-theme"> with --brand-* values
   from user/profile/design-system.md. Nothing here sets --brand-*, so an empty
   theme block falls back to the default palette below. */

:root {
  color-scheme: light dark;
  --font-heading: var(--brand-font-heading, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif);
  --font-body: var(--brand-font-body, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --font-id: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* Default palette (no brand): warm stone neutrals, navy accent, rust highlight, olive secondary. */
  --bg: var(--brand-bg, #f4f0e8);
  --surface: var(--brand-surface, #fcfaf5);
  --surface-2: #eae3d4;
  --ink: var(--brand-ink, #1c1a15);
  --ink-2: #5e584c;
  --line: #d3c7ad;
  --accent: var(--brand-accent, #28374a);
  --accent-ink: var(--brand-accent-ink, #ffffff);
  --accent-soft: #e9eef6;
  --star: var(--brand-highlight, #754437);
  --ok: #2c7552;
  --warn: #8f5500;
  --danger: #b0281f;
  --muted: #6b6751;

  --radius: 6px;
  --gutter: 16px;
  --measure: 72ch;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--brand-bg-dark, #1c1a15);
    --surface: var(--brand-surface-dark, #26241e);
    --surface-2: #3b382f;
    --ink: var(--brand-ink-dark, #f4f0e8);
    --ink-2: #aaa08b;
    --line: #3b382f;
    --accent: var(--brand-accent-dark, #b5c7e2);
    --accent-ink: var(--brand-accent-ink-dark, #101923);
    --accent-soft: #28374a;
    --star: var(--brand-highlight-dark, #d7826c);
    --ok: #6cc49a;
    --warn: #e5a94c;
    --danger: #f08b80;
    --muted: #908b6e;
  }
}
:root[data-theme="dark"] {
  --bg: var(--brand-bg-dark, #1c1a15);
  --surface: var(--brand-surface-dark, #26241e);
  --surface-2: #3b382f;
  --ink: var(--brand-ink-dark, #f4f0e8);
  --ink-2: #aaa08b;
  --line: #3b382f;
  --accent: var(--brand-accent-dark, #b5c7e2);
  --accent-ink: var(--brand-accent-ink-dark, #101923);
  --accent-soft: #28374a;
  --star: var(--brand-highlight-dark, #d7826c);
  --ok: #6cc49a;
  --warn: #e5a94c;
  --danger: #f08b80;
  --muted: #908b6e;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; line-height: 1.2; margin: 0; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Page frame ---- */
.wrap { max-width: 72rem; margin: 0 auto; padding: 0 var(--gutter); }
@media (min-width: 52rem) { :root { --gutter: 32px; } }

.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: .5rem .75rem; z-index: 10; }
.skip:focus { left: var(--gutter); top: .5rem; }

/* Masthead: the one expressive element. */
.mast { padding: 2.25rem 0 1.75rem; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
.mast-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .35rem 1rem; margin-bottom: 1.1rem; }
.mast-who { display: flex; align-items: center; gap: .6rem; color: var(--ink); font-family: var(--font-heading); font-size: 1.35rem; font-weight: 600; letter-spacing: -0.005em; margin: 0; }
.mast-fresh { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0; color: var(--ink-2); font-size: .85rem; font-variant-numeric: tabular-nums; }
/* Signal dot: green when the page is current, amber when it may be out of date, grey before the first refresh. */
.signal { width: .55rem; height: .55rem; border-radius: 50%; flex: none; background: var(--ok); box-shadow: 0 0 0 .2rem color-mix(in srgb, var(--ok) 22%, transparent); }
.signal[data-state="stale"] { background: var(--warn); box-shadow: 0 0 0 .2rem color-mix(in srgb, var(--warn) 22%, transparent); }
.signal[data-state="none"] { background: var(--ink-2); box-shadow: none; }
.mast-who svg { width: 2.75rem; height: 2.75rem; fill: var(--star); flex: none; }
.mast h1 { font-size: clamp(2.1rem, 6vw, 3.4rem); letter-spacing: -0.015em; font-weight: 600; }
.mast-sub { font-family: var(--font-heading); font-size: clamp(1.1rem, 2.6vw, 1.4rem); color: var(--ink-2); margin-top: .35rem; }
.mast-lede { max-width: var(--measure); margin-top: 1rem; font-size: 1.05rem; }
.mast-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .75rem; margin: 1.5rem 0 0; padding: 0; list-style: none; }
.mast-stats .stat { display: flex; flex-direction: column; gap: .2rem; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem 1rem .9rem; }
.mast-stats b { font-family: var(--font-heading); font-size: 1.9rem; line-height: 1.1; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.mast-stats .stat span { color: var(--ink-2); font-size: .875rem; line-height: 1.3; }
.mast-nav { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-size: .9rem; }
.mast-nav a[aria-current="page"] { color: var(--ink); text-decoration: none; font-weight: 600; }

/* Notices (stale data, connection problems) */
.notices { list-style: none; margin: 0 0 1.75rem; padding: 0; display: grid; gap: .6rem; }
.notice { --tone: var(--warn); display: flex; align-items: flex-start; gap: .75rem; padding: .85rem 1rem; border: 1px solid color-mix(in srgb, var(--tone) 45%, var(--line)); border-left: 4px solid var(--tone); border-radius: var(--radius); background: color-mix(in srgb, var(--tone) 14%, var(--surface)); color: var(--ink); font-size: .95rem; }
.notice[data-level="error"] { --tone: var(--danger); }
.notice[data-level="info"] { --tone: var(--accent); }
.notice p { margin: 0; min-width: 0; }
.notice b { color: var(--tone); font-weight: 650; }
.notice-icon { width: 1.3rem; height: 1.3rem; flex: none; margin-top: .05rem; fill: none; stroke: var(--tone); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---- Sections: heading in a margin column on wide screens ---- */
.sec { padding: 1.25rem 0 1.75rem; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; padding-top: 0; }
.sec-head { margin-bottom: .75rem; }
.sec-head h2 { font-size: 1.3rem; display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
.count { font-family: var(--font-body); font-size: .85rem; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 0 .55rem; line-height: 1.6; }
.sec-note { color: var(--ink-2); font-size: .9rem; margin-top: .3rem; max-width: 40ch; }
.sec-body { min-width: 0; }
@media (min-width: 52rem) {
  .sec { display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: 2rem; }
  .sec-head { margin: 0; }
  .sec-head > div { position: sticky; top: 1rem; }
  .sec:first-child { padding-top: 0; }
}

/* ---- Item rows ---- */
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); }
.item { position: relative; display: flex; gap: .75rem 1.25rem; justify-content: space-between; padding: .85rem 1rem .85rem 1.25rem; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item::before { content: ""; position: absolute; left: 0; top: .8rem; bottom: .8rem; width: 3px; border-radius: 0 2px 2px 0; background: var(--tone, transparent); }
.item[data-tone="danger"] { --tone: var(--danger); }
.item[data-tone="warn"] { --tone: var(--warn); }
.item[data-tone="ok"] { --tone: var(--ok); }
.item[data-tone="accent"] { --tone: var(--accent); }
.item[data-tone="muted"] { --tone: var(--muted); }
.item-main { min-width: 0; flex: 1; display: grid; gap: .25rem; }
.item-title { font-weight: 600; }
.item-meta { display: flex; flex-wrap: wrap; gap: .15rem 1rem; color: var(--ink-2); font-size: .875rem; }
.item-text { font-size: .95rem; max-width: var(--measure); }
.item-insight { font-size: .9rem; color: var(--ink-2); max-width: var(--measure); }
.item-insight b, .item-text b { color: var(--ink); font-weight: 600; }
.item-aside { flex: none; text-align: right; font-size: .875rem; color: var(--ink-2); display: grid; gap: .25rem; align-content: start; justify-items: end; }
@media (max-width: 34rem) {
  .item { flex-direction: column; }
  .item-aside { text-align: left; justify-items: start; display: flex; flex-wrap: wrap; gap: .4rem; }
}

/* Record IDs: always visible so the user can ask Atlas about the record. */
.rid { font-family: var(--font-id); font-size: .76rem; color: var(--ink-2); background: var(--surface-2); padding: .05em .4em; border-radius: 4px; -webkit-user-select: all; user-select: all; overflow-wrap: anywhere; justify-self: start; }
a.rid { text-decoration: none; }
a.rid:hover { color: var(--accent); }

/* Chips: short status words. Color always paired with text. */
.chip { display: inline-block; font-size: .78rem; font-weight: 600; line-height: 1.5; padding: 0 .5rem; border-radius: 999px; border: 1px solid currentColor; color: var(--ink-2); white-space: nowrap; }
.chip[data-tone="danger"] { color: var(--danger); }
.chip[data-tone="warn"] { color: var(--warn); }
.chip[data-tone="ok"] { color: var(--ok); }
.chip[data-tone="accent"] { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }

.empty { color: var(--ink-2); font-style: italic; padding: .25rem 0; }
.more { color: var(--ink-2); font-size: .875rem; margin-top: .6rem; }
.error-box { background: var(--surface); border: 1px solid var(--danger); padding: 1rem; border-radius: var(--radius); }

/* ---- Controls (filters, search, tabs) ---- */
.controls { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-bottom: .9rem; }
.seg { display: inline-flex; flex-wrap: wrap; gap: .3rem; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .25rem .8rem; cursor: pointer; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:hover { border-color: var(--accent); }
.search { flex: 1 1 14rem; max-width: 24rem; }
.search input { width: 100%; padding: .4rem .75rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

/* Key facts */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .9rem 1.25rem; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: .8rem; color: var(--ink-2); }
.facts dd { margin: 0; font-weight: 600; }

/* Progress bar */
.bar { height: .5rem; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* ---- Footer ---- */
.foot { margin-top: 2.5rem; padding: 1.25rem 0 2.5rem; border-top: 1px solid var(--line); color: var(--ink-2); font-size: .875rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem; align-items: center; }
.theme-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: .2rem .75rem; cursor: pointer; font-size: .85rem; color: var(--ink-2); }

/* ---- Print ---- */
/* Clickable cards open the record panel (N.recordPanel) */
.rec { cursor: pointer; transition: background-color .12s; }
.rec:hover { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.rec-open { all: unset; cursor: pointer; font: inherit; color: inherit; }
.rec-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
/* Record panel: a drawer on the right; full screen on phones */
dialog.rec-panel { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(42rem, 100%); height: 100%; max-height: none; max-width: 100%;
  border: 0; border-left: 1px solid var(--line); padding: 0; background: var(--surface); color: var(--ink); box-shadow: -10px 0 40px rgba(0, 0, 0, .22); }
dialog.rec-panel:not([open]) { display: none; }
dialog.rec-panel::backdrop { background: rgba(20, 18, 12, .45); }
.rp { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.rp-bar { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: .75rem;
  padding: calc(.75rem + env(safe-area-inset-top, 0px)) 1.5rem .75rem; background: var(--surface); border-bottom: 1px solid var(--line); }
.rp-bar .chips { flex: 1; min-width: 0; }
.rp-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: .3rem .85rem; font: inherit; font-size: .88rem; cursor: pointer; }
.rp-btn:hover { border-color: var(--accent); }
.rp-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rp-body { padding: 1.25rem 1.5rem 2.5rem; display: flex; flex-direction: column; gap: 1.35rem; }
.rp-body h2 { font-size: clamp(1.45rem, 4vw, 1.9rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.rp-sum { margin: .5rem 0 0; font-size: 1.02rem; }
.rp-h { font-family: var(--font-heading); font-size: 1.05rem; font-weight: 600; margin: 0 0 .45rem; }
.rp-details { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .75rem 1.25rem; margin: 0; }
.rp-details div { min-width: 0; }
.rp-details dt { font-size: .78rem; color: var(--ink-2); margin: 0 0 .1rem; }
.rp-details dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.rp-text { margin: 0; white-space: pre-line; max-width: var(--measure); }
.rp-list { margin: 0; padding-left: 1.1rem; display: grid; gap: .3rem; max-width: var(--measure); }
.rp-cut { margin: 0; font-size: .9rem; color: var(--ink-2); font-style: italic; }
.rp-links { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.rp-link { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: .75rem; width: 100%; padding: .55rem .8rem;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); cursor: pointer; }
.rp-link:hover { border-color: var(--accent); }
.rp-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rp-link span:first-child { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.rp-link-off { padding: .55rem .8rem; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); }
.rp-dates { margin: 0; font-size: .86rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rp-ask { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .9rem; padding-top: 1.1rem; border-top: 1px solid var(--line); }
.rp-ask .rp-btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rp-ask p { margin: 0; font-size: .88rem; color: var(--ink-2); }
.rp-copy { width: 100%; font: inherit; font-size: .88rem; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); }
html.rp-lock { overflow: hidden; }
@media (max-width: 640px) { dialog.rec-panel { width: 100%; border-left: 0; } .rp-bar, .rp-body { padding-left: 16px; padding-right: 16px; } }
@media (prefers-reduced-motion: reduce) { .rec { transition: none; } }

@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f0f0f0; --ink: #000000; --ink-2: #333333;
    --line: #bbbbbb; --accent: #000000; --star: #000000; --ok: #000000; --warn: #000000; --danger: #000000; --muted: #555555;
  }
  body { font-size: 11pt; }
  .no-print, .controls, .theme-btn, .skip, .mast-nav, dialog.rec-panel { display: none !important; }
  .items { border: 0; }
  .item { break-inside: avoid; padding-left: .75rem; }
  .sec { break-inside: auto; }
  .sec-head > div { position: static; }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
}
</style>
<style id="atlas-page">
.overview { display: grid; gap: 1rem; }
.overview .desc { display: grid; gap: .6rem; max-width: var(--measure); }
.callout { border-left: 3px solid var(--accent); background: var(--surface); padding: .75rem 1rem; border-radius: 0 var(--radius) var(--radius) 0; display: grid; gap: .35rem; max-width: var(--measure); }
.callout b { font-weight: 600; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 1rem; border-left: 2px solid var(--line); display: grid; gap: .8rem; }
.timeline li { position: relative; display: grid; gap: .1rem; }
.timeline li::before { content: ""; position: absolute; left: calc(-1rem - 5px); top: .45rem; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.timeline time { font-size: .85rem; color: var(--ink-2); }
.people { display: flex; flex-wrap: wrap; gap: .5rem .75rem; list-style: none; margin: 0; padding: 0; }
.people li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem .75rem; display: grid; gap: .15rem; font-size: .92rem; }
.people .role { color: var(--ink-2); font-size: .82rem; }
.why { border-left: 2px solid var(--line); padding-left: .75rem; font-size: .93rem; }
</style>

<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">
/* Atlas dashboard runtime.
   CANONICAL COPY. Every template inlines this file verbatim inside
   <script id="atlas-base-js">. Edit here, then run
   `python3 system/tests/dashboards/render.py --sync`.

   Safety: dashboard data comes from emails, documents, and meetings, so it is
   untrusted text. Everything is rendered with textContent / createElement,
   never parsed as HTML markup. No network calls, no connectors. Browser storage is used
   only for UI conveniences (theme, remembered filter) and is optional. */
(function () {
  "use strict";
  var N = (window.Atlas = {});
  N.meta = {};

  var LABELS = {
    i_owe: "I owe", waiting_on: "Waiting on",
    open: "Open", done: "Done", dropped: "Dropped", slipped: "Slipped",
    high: "High", medium: "Medium", low: "Low",
    on_track: "On track", at_risk: "At risk", off_track: "Off track", unknown: "Not assessed",
    proposed: "Proposed", active: "Active", paused: "Paused", cancelled: "Cancelled",
    made: "Made", reversed: "Reversed", superseded: "Superseded",
    potential: "Potential", resolved: "Resolved",
    draft: "Draft", achieved: "Achieved", missed: "Missed",
    meeting: "Meeting", one_on_one: "1:1", deadline: "Deadline", milestone: "Milestone", occurrence: "Event",
    ok: "OK", partial: "Partial", failed: "Failed", skipped_away: "Skipped (away)",
    skipped_paused: "Skipped (paused)", early_exit: "Nothing new", never_run: "Not run yet",
    pending: "Pending", approved: "Approved", rejected: "Rejected", executed: "Done", expired: "Expired",
    confirmed: "Confirmed", stated: "You said this", observed: "Observed", researched: "Researched",
    uploaded: "From your documents", inferred: "Inferred",
    ready: "Prep ready", planned: "Prep coming", none: "No prep", not_needed: "No prep needed",
    manager: "Manager", report: "Report", peer: "Peer", stakeholder: "Stakeholder", customer: "Customer",
    vendor: "Vendor", partner: "Partner", external: "External", other: "Other",
    task_group: "Task group", project: "Project", initiative: "Initiative", program: "Program",
    quarter: "Quarter", half: "Half-year", year: "Year", multi_year: "Multi-year"
  };
  N.label = function (v) {
    if (v == null) return "";
    return LABELS[v] || String(v).replace(/_/g, " ").replace(/^./, function (c) { return c.toUpperCase(); });
  };
  N.tones = {
    danger: ["slipped", "off_track", "failed", "high", "active_risk", "error", "missed"],
    warn: ["at_risk", "partial", "medium", "pending", "potential", "proposed", "warn"],
    ok: ["on_track", "ok", "done", "achieved", "made", "resolved", "confirmed", "stated", "ready", "executed"],
    accent: ["early_exit", "open", "active", "planned"]
  };
  N.tone = function (v) {
    for (var t in N.tones) if (N.tones[t].indexOf(v) !== -1) return t;
    return null;
  };

  /* ---- DOM helpers ---- */
  function add(el, c) {

    }
    return {
      el: panel, open: open,
      add: function (v) { if (v && v.id) views[v.id] = v; return v; },
      get: function (id) { return views[id]; }
    };
  };
  /* Panel section content: a paragraph, or a list of plain lines. */
  N.para = function (text) { return text ? h("p", { class: "rp-text" }, N.rich(text)) : null; };
  N.lines = function (items) { items = N.list(items).filter(Boolean); return items.length ? h("ul", { class: "rp-list" }, items.map(function (x) { return h("li", null, x); })) : null; };
  /* Dates line for a panel: "Created Oct 1, 2026 · Updated Oct 9, 2026". */
  N.datesLine = function (created, updated) {
    return [created ? "Created " + N.dateY(created) : null, updated ? "Updated " + N.dateY(updated) : null].filter(Boolean).join(" · ");
  };
  /* A title rendered as a button, so keyboard users can open the card's panel. */
  N.openTitle = function (text) { return h("button", { type: "button", class: "rec-open", "aria-haspopup": "dialog" }, text); };
  /* Make a card open the panel: anywhere on the card, except while the reader is selecting text. */
  N.clickable = function (card, panel, view) {
    card.classList.add("rec");
    card.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest("a, input, select")) return;
      var sel = window.getSelection && String(window.getSelection());
      if (sel && sel.length > 2 && !(e.target.closest && e.target.closest(".rec-open"))) return;
      panel.open(view);
    });
    return card;
  };
  /* Panel details: [label, value] pairs, empty ones dropped, then extra data details whose label isn't already shown. */
  N.mergeDetails = function (pairs, extra) {
    var out = [], seen = {};
    N.list(pairs).forEach(function (p) { if (p && p[1] != null && p[1] !== "") { out.push({ label: p[0], value: p[1] }); seen[p[0]] = 1; } });
    N.list(extra).forEach(function (x) { if (x && x.label && !seen[x.label]) out.push(x); });
    return out.slice(0, 16);
  };

  /* Notices: a label and an icon per level, so a warning reads as one at a glance. */
  var NOTICE = { warn: "Needs attention:", error: "Problem:", info: "Note:" };
  var NOTICE_ICON = {
    warn: ["M12 3.5 2.5 20h19L12 3.5z", "M12 10v4.5", "M12 17.4v.1"],
    error: ["M12 2.75a9.25 9.25 0 1 0 0 18.5 9.25 9.25 0 0 0 0-18.5z", "M12 7.5v6", "M12 16.6v.1"],
    info: ["M12 2.75a9.25 9.25 0 1 0 0 18.5 9.25 9.25 0 0 0 0-18.5z", "M12 11v5.5", "M12 7.6v.1"]
  };
  function noticeIcon(level) {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true"); svg.setAttribute("class", "notice-icon");
    NOTICE_ICON[level].forEach(function (d) { var p = document.createElementNS(ns, "path"); p.setAttribute("d", d); svg.appendChild(p); });
    return svg;
  }

  /* Render a page. build(data, main) appends sections to main and may return masthead options. */
  N.page = function (defaults, build) {
    var data = N.load();
    var app = document.getElementById("app");
    N.meta = (data && data.meta) || {};
    if (N.meta.locale) document.documentElement.setAttribute("lang", N.meta.locale);
    if (N.meta.title) document.title = N.meta.title;
    var main = h("main", { id: "main" });
    var mastOpts = { title: N.meta.title || defaults.title };
    if (!data) {
      mastOpts.subtitle = "Waiting for data";
      main.appendChild(N.empty("This page has no data yet. Ask Atlas in chat to refresh it."));
    } else {
      try {
        var extra = build(data, main) || {};
        for (var k in extra) mastOpts[k] = extra[k];
      } catch (e) {
        main.appendChild(h("div", { class: "error-box", role: "alert" }, "Part of this page couldn't be displayed. Ask Atlas in chat to refresh it."));
        if (window.console) console.error(e);
      }
    }
    var notices = N.list(N.meta.notices);
    add(app, [
      h("a", { class: "skip", href: "#main" }, "Skip to content"),
      h("div", { class: "wrap" },
        N.masthead(mastOpts),
        notices.length ? h("ul", { class: "notices", "aria-label": "Notices" }, notices.map(function (n) {
          var level = NOTICE[n.level] ? n.level : "warn";
          return h("li", { class: "notice", "data-level": level, role: level === "error" ? "alert" : null },
            noticeIcon(level),
            h("p", null, h("b", null, NOTICE[level] + " "), N.rich(n.text)));
        })) : null,
        main,
        N.footer())
    ]);
  };
})();
</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var HEALTH_TONE = { off_track: "danger", at_risk: "warn", on_track: "ok" };

  N.page({ title: "Project" }, function (d, main) {
    var p = d.project || {};
    main.appendChild(N.section({ id: "overview", title: "Overview",
      body: h("div", { class: "overview" },
        h("div", { class: "chips" }, N.status(p.health || "unknown"), N.status(p.status), p.scale ? N.chip(N.label(p.scale)) : null),
        L(p.description).length ? h("div", { class: "desc" }, L(p.description).map(function (x) { return h("p", null, N.rich(x)); })) : null,
        N.facts([["Owner", p.owner ? N.name(p.owner) : null], ["Serves goal", p.goal ? N.name(p.goal) : null], ["Started", p.start ? N.dateY(p.start) : null],
          ["Target", p.target ? N.dateY(p.target) + (N.daysFromToday(p.target) >= 0 ? " (" + N.rel(p.target) + ")" : "") : null],
          ["Organizations", L(p.organizations).map(N.name).join(", ")], ["Topics", L(p.topics).map(N.name).join(", ")]]),
        p.insight || p.next_step ? h("div", { class: "callout" }, p.insight ? h("p", null, N.rich(p.insight)) : null,
          p.next_step ? h("p", null, h("b", null, "Next step: "), N.rich(p.next_step)) : null) : null,
        N.rid(p.id)) }));

    var ppl = L(d.people);
    if (ppl.length) {
      main.appendChild(N.section({ id: "people", title: "People", count: N.total("people", ppl.length), key: "people",
        body: h("ul", { class: "people" }, ppl.map(function (x) {
          return h("li", null, h("span", null, x.title), h("span", { class: "role" }, [x.project_role || x.role, x.org ? N.name(x.org) : null].filter(Boolean).join(", ")), N.rid(x.id));
        })) }));
    }

    var cs = L(d.commitments);
    main.appendChild(N.section({ id: "commitments", title: "Open commitments", count: N.total("commitments", cs.length), key: "commitments",
      body: N.items(cs.map(function (c) {
        var late = c.status === "slipped" || (c.due && N.daysFromToday(c.due) < 0);
        return N.item({ tone: late ? "danger" : (c.direction === "waiting_on" ? "muted" : "accent"), title: c.title, id: c.id,
          meta: [N.label(c.direction), c.direction === "i_owe" ? (c.counterparty ? "For " + N.name(c.counterparty) : null) : (c.owner ? "From " + N.name(c.owner) : null)],
          nextStep: c.next_step, aside: [h("span", null, N.due(c.due)), c.status === "slipped" ? N.status("slipped") : null] });
      }), "No open commitments.") }));

    var rs = L(d.risks);
    main.appendChild(N.section({ id: "risks", title: "Risks and issues", count: N.total("risks", rs.length), key: "risks",
      body: N.items(rs.map(function (r) {
        return N.item({ tone: r.status === "active" ? "danger" : (r.status === "resolved" ? "ok" : "warn"), title: r.title, id: r.id, text: r.summary,
          meta: [r.likelihood ? "Likelihood " + r.likelihood : null, r.impact ? "Impact " + r.impact : null, r.owner ? "Owner " + N.name(r.owner) : null],
          extra: r.mitigation ? h("p", { class: "why" }, "Mitigation: ", N.rich(r.mitigation)) : null,
          aside: [N.chip(r.status === "active" ? "Issue" : N.label(r.status), r.status === "active" ? "danger" : N.tone(r.status))] });
      }), "No risks recorded.") }));

    var ds = L(d.decisions);
    main.appendChild(N.section({ id: "decisions", title: "Decisions", count: N.total("decisions", ds.length), key: "decisions",
      body: N.items(ds.map(function (x) {
        return N.item({ tone: x.status === "made" ? "accent" : "warn", title: x.title, id: x.id,
          meta: [x.decided_on ? "Decided " + N.dateY(x.decided_on) : "Not decided yet"],
          extra: h("p", { class: "why" }, "Why: ", x.rationale && x.rationale !== "unknown" ? N.rich(x.rationale) : "not recorded"),
          aside: [x.status !== "made" ? N.status(x.status) : null] });
      }), "No decisions recorded.") }));

    var qs = L(d.questions), ideas = L(d.ideas);
    if (qs.length || ideas.length) {
      main.appendChild(N.section({ id: "open", title: "Questions and ideas", count: qs.length + ideas.length,
        body: N.items(qs.map(function (q) {
          return N.item({ tone: "accent", title: q.title, id: q.id, meta: [q.asked_on ? "Asked " + N.date(q.asked_on) : null], aside: [N.chip("Question")] });
        }).concat(ideas.map(function (i) {
          return N.item({ tone: "muted", title: i.title, id: i.id, aside: [N.chip("Idea: " + N.label(i.status).toLowerCase())] });
        }))) }));
    }

    var ev = d.events || {};
    var evs = L(ev.upcoming).concat(L(ev.recent));
    if (evs.length) {
      main.appendChild(N.section({ id: "events", title: "Meetings and milestones", count: evs.length,
        body: N.items(evs.map(function (e) {
          var future = N.daysFromToday(e.start) >= 0;
          return N.item({ tone: future ? "accent" : "muted", title: e.title, id: e.id, meta: [N.label(e.kind), N.weekday(e.start) + (N.time(e.start) ? ", " + N.time(e.start) : "")],
            text: L(e.outcomes).join("; "), aside: [future ? N.chip("Upcoming", "accent") : N.chip("Held")] });
        })) }));
    }

    var ups = L(d.updates);
    main.appendChild(N.section({ id: "history", title: "History", count: N.total("updates", ups.length), key: "updates", note: "Newest first, from the project's record.",
      body: ups.length ? h("ol", { class: "timeline", reversed: true }, ups.map(function (u) {
        return h("li", null, h("time", { datetime: u.date }, N.dateY(u.date)), h("p", null, N.rich(u.text)));
      })) : N.empty("No history yet.") }));

    var srcs = L(d.sources);
    if (srcs.length) {
      main.appendChild(N.section({ id: "sources", title: "Sources", count: N.total("sources", srcs.length), key: "sources", note: "Where this page's facts came from.",
        body: N.items(srcs.map(function (s) {
          return N.item({ title: s.title, id: s.id, meta: [N.label(s.kind), s.occurred_on ? N.dateY(s.occurred_on) : null] });
        })) }));
    }
    return { title: p.title || "Project", subtitle: p.summary, stats: [[cs.length, ["open commitment", "open commitments"]], [rs.filter(function (r) { return r.status !== "resolved"; }).length, ["open risk", "open risks"]], [ds.length, ["decision", "decisions"]]] };
  });
})();
</script>
