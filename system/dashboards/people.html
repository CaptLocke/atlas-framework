<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>People</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.owes { display: grid; gap: .5rem 1.5rem; margin-top: .35rem; font-size: .9rem; }
@media (min-width: 40rem) { .owes { grid-template-columns: 1fr 1fr; } }
.owes h3 { font-family: var(--font-body); font-size: .8rem; color: var(--ink-2); font-weight: 600; margin-bottom: .15rem; }
.owes ul { margin: 0; padding-left: 1rem; display: grid; gap: .2rem; }
.owes .d { color: var(--ink-2); }
.owes .late { color: var(--danger); font-weight: 600; }
.person-name { display: flex; flex-wrap: wrap; gap: .25rem .6rem; align-items: baseline; }
.contact { font-variant-numeric: tabular-nums; }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;

  function owed(title, list) {
    list = L(list);
    if (!list.length) return null;
    return h("div", null, h("h3", null, title + " (" + list.length + ")"), h("ul", null, list.map(function (c) {
      var late = c.due && N.daysFromToday(c.due) < 0;
      return h("li", null, c.title, " ", h("span", { class: late ? "late" : "d" }, N.due(c.due)), " ", N.rid(c.id));
    })));
  }

  N.page({ title: "People" }, function (d, main) {
    var people = L(d.people);
    var filter = "all", query = "";
    var panel = N.recordPanel();
    function owedLines(list) {
      return N.lines(L(list).map(function (c) { return [c.title, c.due ? " \u00b7 " + N.due(c.due) : ""]; }));
    }
    function view(p) {
      return panel.add({ id: p.id, title: p.title, kind: "Person",
        chips: [p.relationship ? N.chip(N.label(p.relationship)) : null, p.quiet ? N.chip("Gone quiet", "warn") : null],
        summary: p.summary || [p.role, N.name(p.org)].filter(Boolean).join(", "),
        details: N.mergeDetails([["Role", p.role], ["Organization", N.name(p.org)], ["Relationship", p.relationship ? N.label(p.relationship) : null],
          ["Usually", p.cadence], ["Last contact", p.last_contact ? N.dateY(p.last_contact) + " (" + N.rel(p.last_contact) + ")" : "No contact recorded"],
          ["Next meeting", p.next_touchpoint ? p.next_touchpoint.title + ", " + N.weekday(p.next_touchpoint.start) : null], ["Also known as", L(p.aliases).join(", ")]], p.details),
        sections: [(p.quiet && p.quiet_reason) || p.insight ? { heading: "What Atlas noticed", nodes: N.para(p.quiet && p.quiet_reason ? p.quiet_reason : p.insight) } : null,
          L(p.i_owe).length ? { heading: "You owe " + p.title.split(" ")[0], nodes: owedLines(p.i_owe) } : null,
          L(p.they_owe).length ? { heading: p.title.split(" ")[0] + " owes you", nodes: owedLines(p.they_owe) } : null],
        body: p.body, body_truncated: p.body_truncated,
        links: [p.org].concat(L(p.links)).filter(Boolean),
        dates: N.datesLine(p.created, p.updated) });
    }
    var views = people.map(view);

    var list = h("ul", { class: "items" });
    var emptyMsg = N.empty("Nobody matches this view.");
    var rows = people.map(function (p, i) {
      var openN = L(p.i_owe).length + L(p.they_owe).length;
      var last = p.last_contact ? "Last contact " + N.rel(p.last_contact) : "No contact recorded";
      var li = N.item({ tone: p.quiet ? "warn" : (openN ? "accent" : null),
        title: h("span", { class: "person-name" }, N.openTitle(p.title), p.relationship ? N.chip(N.label(p.relationship)) : null),
        id: p.id,
        meta: [[p.role, p.org ? N.name(p.org) : null].filter(Boolean).join(", "), p.cadence ? "Usually " + p.cadence : null],
        insight: p.quiet && p.quiet_reason ? p.quiet_reason : p.insight,
        extra: openN ? h("div", { class: "owes" }, owed("You owe", p.i_owe), owed("They owe you", p.they_owe)) : null,
        aside: [h("span", { class: "contact" }, last), p.quiet ? N.chip("Gone quiet", "warn") : null,
          p.next_touchpoint ? h("span", null, "Next: " + p.next_touchpoint.title + ", " + N.weekday(p.next_touchpoint.start)) : null] });
      li._p = p;
      N.clickable(li, panel, views[i]);
      li._text = [p.title, p.role, N.name(p.org), p.relationship, L(p.aliases).join(" ")].join(" ").toLowerCase();
      list.appendChild(li);
      return li;
    });
    function apply() {
      var shown = 0;
      rows.forEach(function (li) {
        var p = li._p;
        var ok = (filter === "all" || (filter === "quiet" && p.quiet) || (filter === "open" && (L(p.i_owe).length + L(p.they_owe).length)) || (filter === "soon" && p.next_touchpoint))
          && (!query || li._text.indexOf(query) !== -1);
        li.hidden = !ok; shown += ok ? 1 : 0;
      });
      list.hidden = !shown; emptyMsg.hidden = !!shown;
    }
    main.appendChild(N.section({ id: "people", title: "Key relationships", count: N.total("people", people.length), key: "people",
      note: "Who you owe, who owes you, and who has gone quiet.",
      body: people.length ? [h("div", { class: "controls" },
        N.segmented("Show people", [{ value: "all", label: "Everyone" }, { value: "quiet", label: "Gone quiet" },
          { value: "open", label: "Open items" }, { value: "soon", label: "Meeting soon" }], "all", function (v) { filter = v; apply(); }),
        N.search("Find a person or company", function (q) { query = q; apply(); })), list, emptyMsg]
        : N.empty("No people recorded yet.") }));
    main.appendChild(panel.el);

    var ins = L(d.insights);
    if (ins.length) {
      main.appendChild(N.section({ id: "insights", title: "Worth knowing", body: N.items(ins.map(function (i) {
        return N.item({ tone: "accent", title: i.text, text: i.why, nextStep: i.suggested_action, aside: [null] });
      })) }));
    }
    var s = d.summary || {};
    return { subtitle: "The people who matter to your work.",
      stats: [[N.total("people", people.length), "people"], [s.quiet != null ? s.quiet : people.filter(function (p) { return p.quiet; }).length, "gone quiet"],
        [s.i_owe != null ? s.i_owe : 0, "things you owe"], [s.they_owe != null ? s.they_owe : 0, "owed to you"]] };
  });
})();
</script>
</body>
</html>
