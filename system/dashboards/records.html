<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Records</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.rec-title { display: flex; flex-wrap: wrap; gap: .25rem .55rem; align-items: baseline; }
.rec-links { margin: .3rem 0 0; font-size: .86rem; color: var(--ink-2); }
.item[data-tone="muted"] .item-title { color: var(--ink-2); }
.pick { display: inline-flex; align-items: center; gap: .45rem; font-size: .9rem; }
.pick label { color: var(--ink-2); }
.pick select { padding: .3rem .6rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-width: 100%; }
.rec-count { margin: 0 0 .5rem; font-size: .86rem; color: var(--ink-2); }
.more-wrap { display: flex; justify-content: center; margin-top: .9rem; }
.more-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .35rem 1rem; cursor: pointer; }
.more-btn:hover { border-color: var(--accent); }
.upd { font-variant-numeric: tabular-nums; white-space: nowrap; }
@media print { .more-wrap, .pick { display: none !important; } }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var PAGE = 100;
  var CLOSED_TONE = { done: "ok", achieved: "ok", resolved: "ok", answered: "ok", adopted: "ok" };

  function select(name, options, initial, onChange) {
    var key = (N.meta.dashboard || "page") + ":" + name;
    var saved = N.store.get(key);
    var current = options.some(function (o) { return o.value === saved; }) ? saved : initial;
    var id = "s-" + Math.random().toString(36).slice(2, 8);
    var el = h("select", { id: id, onchange: function (e) { current = e.target.value; N.store.set(key, current); onChange(current); } },
      options.map(function (o) { return h("option", { value: o.value, selected: o.value === current ? "selected" : null }, o.label); }));
    setTimeout(function () { el.value = current; onChange(current); }, 0);
    return h("div", { class: "pick" }, h("label", { for: id }, name), el);
  }

  N.page({ title: "Records" }, function (d, main) {
    var records = L(d.records), types = L(d.types), s = d.summary || {};
    var labelOf = {};
    types.forEach(function (t) { labelOf[t.type] = t.label; });
    var typeOrder = {};
    types.forEach(function (t, i) { typeOrder[t.type] = i; });
    var state = { type: "all", scope: "current", sort: "updated", words: [], limit: PAGE };


    var panel = N.recordPanel();
    function statusChip(r) { return r.status ? N.chip(N.label(r.status), CLOSED_TONE[r.status] || N.tone(r.status)) : null; }
    function viewOf(r) {
      return { id: r.id, title: r.title, kind: singular(r.type), chips: statusChip(r), summary: r.summary,
        details: r.details, body: r.body, body_truncated: r.body_truncated, links: r.links, dates: N.datesLine(r.created, r.updated) };
    }

    var rows = records.map(function (r) {
      var facts = L(r.facts).filter(Boolean);
      var li = N.item({ tone: r.current ? null : "muted",
        title: h("span", { class: "rec-title" }, N.openTitle(r.title), N.chip(singular(r.type)), statusChip(r)),
        id: r.id,
        text: r.summary,
        meta: facts,
        extra: L(r.links).length ? h("p", { class: "rec-links" }, h("span", { class: "visually-hidden" }, "Linked to: "), N.refs(r.links)) : null,
        aside: [r.updated ? h("span", { class: "upd" }, "Updated " + N.rel(r.updated)) : null] });
      li._r = r;
      N.clickable(li, panel, panel.add(viewOf(r)));
      li._text = [r.title, r.summary, r.id, L(r.aliases).join(" "), facts.join(" "),
        L(r.links).map(function (x) { return N.name(x); }).join(" "), labelOf[r.type] || r.type].join(" ").toLowerCase();
      return li;
    });

    function singular(type) {
      var l = labelOf[type];
      if (!l) return N.label(type);
      if (/ies$/.test(l)) return l.replace(/ies$/, "y");
      if (/People$/.test(l)) return l.replace(/People$/, "Person");
      return l.replace(/s$/, "");
    }

    var list = h("ul", { class: "items" });
    var emptyMsg = N.empty("No records match. Try fewer words, another type, or All.");
    var moreBtn = h("button", { type: "button", class: "more-btn", onclick: function () { state.limit += PAGE; apply(); } }, "Show 100 more");
    var status = h("p", { class: "rec-count", role: "status", "aria-live": "polite" });

    function sorted(list) {
      var by = state.sort;
      return list.slice().sort(function (a, b) {
        var x = a._r, y = b._r;
        if (by === "name") return String(x.title).localeCompare(String(y.title));
        if (by === "type") {
          var tx = typeOrder[x.type] != null ? typeOrder[x.type] : 999, ty = typeOrder[y.type] != null ? typeOrder[y.type] : 999;
          if (tx !== ty) return tx - ty;
          return String(x.title).localeCompare(String(y.title));
        }
        return String(y.updated || "").localeCompare(String(x.updated || "")) || String(x.title).localeCompare(String(y.title));
      });
    }

    function apply() {
      var matches = rows.filter(function (li) {
        var r = li._r;
        if (state.type !== "all" && r.type !== state.type) return false;
        if (state.scope === "current" && !r.current) return false;
        if (state.scope === "closed" && r.current) return false;
        for (var i = 0; i < state.words.length; i++) if (li._text.indexOf(state.words[i]) === -1) return false;
        return true;
      });
      matches = sorted(matches);
      while (list.firstChild) list.removeChild(list.firstChild);
      matches.slice(0, state.limit).forEach(function (li) { list.appendChild(li); });
      var shown = Math.min(matches.length, state.limit);
      list.hidden = !matches.length; emptyMsg.hidden = !!matches.length;
      moreBtn.hidden = matches.length <= state.limit;
      status.textContent = matches.length ? (shown < matches.length ? "Showing " + shown + " of " + matches.length + " matching records" : matches.length + (matches.length === 1 ? " matching record" : " matching records")) : "";
    }
    function reset() { state.limit = PAGE; apply(); }

    var typeOptions = [{ value: "all", label: "All types (" + records.length + ")" }].concat(types.map(function (t) {
      return { value: t.type, label: t.label + " (" + t.count + ")" };
    }));
    var hidden = [];
    if (s.restricted) hidden.push(h("p", { class: "sec-note" }, s.restricted + (s.restricted === 1 ? " record is" : " records are") + " hidden by your data rules. Ask Atlas in chat about them."));
    if (s.archived) hidden.push(h("p", { class: "sec-note" }, s.archived + " archived " + (s.archived === 1 ? "record isn't" : "records aren't") + " shown. Ask Atlas in chat to see them."));

    main.appendChild(N.section({ id: "records", title: "All records", count: N.total("records", records.length), key: "records",
      note: "Everything Atlas has filed. Select a record to open it. To change one, ask Atlas in chat.",
      body: records.length ? [
        h("div", { class: "controls" },
          N.search("Search names, summaries, and links", function (q) { state.words = q.split(/\s+/).filter(Boolean); reset(); }),
          N.segmented("Show records", [{ value: "current", label: "Current" }, { value: "closed", label: "Closed" }, { value: "all", label: "All" }],
            "current", function (v) { state.scope = v; reset(); })),
        h("div", { class: "controls" },
          select("Type", typeOptions, "all", function (v) { state.type = v; reset(); }),
          select("Sort", [{ value: "updated", label: "Recently updated" }, { value: "name", label: "Name (A–Z)" }, { value: "type", label: "Type" }],
            "updated", function (v) { state.sort = v; reset(); })),
        hidden, status, list, emptyMsg, h("div", { class: "more-wrap" }, moreBtn), panel.el]
        : [hidden, N.empty("Nothing filed yet. Atlas adds records as it reads your mail, meetings, and notes.")] }));

    return { subtitle: "All your knowledge, in one place.",
      stats: [[s.total != null ? s.total : N.total("records", records.length), ["record", "records"]],
        [s.current != null ? s.current : records.filter(function (r) { return r.current; }).length, "current"],
        [types.length, types.length === 1 ? "type" : "types"]] };
  });
})();
</script>
</body>
</html>
