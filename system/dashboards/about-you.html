<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>About You</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.group + .group { margin-top: 1.25rem; }
.group h3 { font-size: 1.05rem; margin-bottom: .45rem; }
.stmts { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.stmt { display: grid; gap: .3rem; padding: .7rem 1rem; border-top: 1px solid var(--line); }
.stmt:first-child { border-top: 0; }
.stmt-text { max-width: var(--measure); }
.stmt-tag { display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; font-size: .82rem; color: var(--ink-2); }
.stmt[data-status="proposed"] .stmt-text { font-style: italic; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: .75rem; list-style: none; margin: 0; padding: 0; }
.swatch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-size: .85rem; }
.swatch i { display: block; height: 3rem; border-bottom: 1px solid var(--line); }
.swatch p { padding: .4rem .6rem 0; font-weight: 600; }
.swatch span { display: block; padding: 0 .6rem .5rem; color: var(--ink-2); }
.basics { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; }
.file-meta { font-size: .85rem; color: var(--ink-2); margin-bottom: .75rem; }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var STATUS = { confirmed: ["Confirmed", "ok"], stated: ["You said this", "ok"], proposed: ["Not yet confirmed", "warn"] };

  function statement(s) {
    var st = STATUS[s.status] || STATUS[s.provenance === "stated" ? "stated" : "proposed"];
    return h("li", { class: "stmt", "data-status": s.status || null },
      h("p", { class: "stmt-text" }, N.rich(s.text)),
      h("p", { class: "stmt-tag" }, N.chip(st[0], st[1]), s.provenance && s.provenance !== "stated" ? h("span", null, N.label(s.provenance)) : null,
        s.date ? h("span", null, N.dateY(s.date)) : null, L(s.evidence).map(function (e) { return N.rid(e.id || e); })));
  }

  N.page({ title: "About You" }, function (d, main) {
    var b = d.basics || {};
    main.appendChild(N.section({ id: "basics", title: "The basics", note: "From your profile. Tell Atlas in chat if anything is wrong.",
      body: h("div", { class: "basics" }, N.facts([["Name", b.name], ["Role", b.role], ["Company", b.company ? N.ref(b.company, { noId: true }) : null],
        ["Manager", b.manager ? N.ref(b.manager, { noId: true }) : null], ["Time zone", b.timezone],
        ["Key people", L(b.key_people).map(N.name).join(", ")], ["Current goals", L(b.goals).map(N.name).join(", ")]]),
        b.self ? h("p", { style: "margin-top:.75rem" }, N.rid(b.self.id || b.self)) : null) }));

    var props = L(d.proposals);
    if (props.length) {
      main.appendChild(N.section({ id: "proposals", title: "Waiting for your OK", count: N.total("proposals", props.length), key: "proposals",
        note: "Things Atlas noticed but won't rely on until you confirm. Reply yes or no in chat.",
        body: N.items(props.map(function (q) {
          return N.item({ tone: "warn", title: q.text, text: q.proposed_change ? "Would add: " + q.proposed_change : null, aside: [h("span", null, "Asked " + N.date(q.asked))] });
        })) }));
    }

    L(d.files).forEach(function (f) {
      var groups = L(f.groups);
      var n = groups.reduce(function (a, g) { return a + L(g.statements).length; }, 0);
      main.appendChild(N.section({ id: "f-" + f.part, title: f.title || N.label(f.part), count: N.total("files." + f.part, n), key: "files." + f.part,
        note: f.description,
        body: [h("p", { class: "file-meta" }, (f.updated ? "Updated " + N.dateY(f.updated) + ". " : ""), f.path ? N.path(f.path) : null),
          groups.length ? groups.map(function (g) {
            return h("div", { class: "group" }, g.heading ? h("h3", null, g.heading) : null, h("ul", { class: "stmts" }, L(g.statements).map(statement)));
          }) : N.empty("Nothing recorded yet. Atlas learns this as you work together.")] }));
    });

    var ds = d.design;
    if (ds) {
      main.appendChild(N.section({ id: "design", title: "Design system", note: "Used for your documents, decks, and these pages.",
        body: [ds.summary ? h("p", { class: "item-text", style: "margin-bottom:1rem" }, N.rich(ds.summary)) : null,
          L(ds.colors).length ? h("ul", { class: "swatches", "aria-label": "Brand colors" }, L(ds.colors).map(function (c) {
            var hex = /^#[0-9a-fA-F]{3,8}$/.test(c.hex || "") ? c.hex : "transparent";
            return h("li", { class: "swatch" }, h("i", { style: "background:" + hex, "aria-hidden": "true" }), h("p", null, c.name), h("span", null, [c.hex, c.use].filter(Boolean).join(", ")));
          })) : null,
          L(ds.fonts).length ? h("div", { style: "margin-top:1rem" }, N.facts(L(ds.fonts).map(function (f) { return [f.role, f.family]; }))) : null,
          ds.path ? h("p", { class: "file-meta", style: "margin-top:.75rem" }, N.path(ds.path)) : null] }));
    }

    var c = d.counts || {};
    return { subtitle: "How Atlas sees you, and why.",
      lede: "Everything here came from something you said, did, or shared. Only confirmed items are treated as fact.",
      stats: [[c.statements || 0, "things Atlas knows"], [c.confirmed || 0, "confirmed"], [c.proposed || props.length, "waiting for you"]] };
  });
})();
</script>
</body>
</html>
