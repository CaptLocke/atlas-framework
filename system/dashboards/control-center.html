<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Guide</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
/* ---- A sticky section list on the left, the sections on the right ---- */
.guide { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-10); align-items: start; }
.side { position: sticky; top: calc(var(--header-h, 74px) + 24px); display: flex; flex-direction: column; gap: 2px; }
.side a { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 14px; border-radius: var(--radius-pill); color: var(--ink-2); font-size: 14px; font-weight: 500; text-decoration: none; }
.side a:hover { background: var(--sunken-hover); color: var(--ink); }
.side a .atl-icon { width: 14px; height: 14px; }
.side a b { margin-left: auto; font-weight: 600; color: var(--warn); }
.parts { display: flex; flex-direction: column; gap: var(--space-11); min-width: 0; }
.part { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; scroll-margin-top: calc(var(--header-h, 74px) + 24px); }
.part-head h2 { font-size: clamp(28px, 3vw, 34px); line-height: 1.15; font-weight: 300; letter-spacing: -0.02em; }
.part-head p { margin-top: 6px; font-size: 14px; color: var(--muted); }
@media (max-width: 60rem) {
  .guide { grid-template-columns: minmax(0, 1fr); gap: var(--space-7); }
  .side { position: static; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; gap: 6px; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .side a { flex: none; border: 1px solid var(--line); background: var(--surface); }
  .part { scroll-margin-top: 16px; }
}
.small { font-size: 13px; color: var(--muted); }
.guide-foot { margin-top: var(--space-10); }   /* last update and health check, under everything */

/* ---- Status: health, automations beside connections ---- */
.health { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: var(--space-5) var(--space-7); border: 1px solid var(--line); border-radius: var(--radius-card-sm); background: var(--surface); }
.health__word { font-size: 18px; font-weight: 500; }
.health__text { flex: 1 1 18rem; min-width: 0; font-size: 14px; color: var(--ink-2); }
.status-cards { display: flex; flex-wrap: wrap; gap: var(--space-7); align-items: flex-start; }
.scard { flex: 3 1 420px; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); padding: var(--space-7) 0 var(--space-3); }
.scard + .scard { flex: 2 1 300px; }
.scard h3 { padding: 0 var(--space-7) var(--space-3); font-size: 15px; font-weight: 600; }
.srow { display: flex; align-items: flex-start; gap: 12px; padding: 12px var(--space-7); border-top: 1px solid var(--line-soft); }
.srow > .atl-icon { margin-top: 3px; width: 15px; height: 15px; }
.srow > .atl-icon.ok { color: var(--good-mark); }
.srow > .atl-icon.bad { color: var(--bad); }
.srow > .atl-icon.warn { color: var(--warn-mark); }
.srow__t { flex: 1 1 auto; min-width: 0; }
.srow__t b { display: block; font-size: 14px; font-weight: 600; }
.srow__t span { display: block; font-size: 12px; color: var(--muted); }
.srow__end { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.srow__end .w { font-size: 12px; font-weight: 600; }
.srow__end .w.good { color: var(--good); } .srow__end .w.warn { color: var(--warn); } .srow__end .w.bad { color: var(--bad); } .srow__end .w.neutral { color: var(--muted); }
.srow__end span:last-child { font-size: 12px; color: var(--muted); }
.copy-text { margin: 0; padding: 12px 14px; background: var(--sunken); border-radius: var(--radius-md); font-family: var(--font-id); font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }

/* ---- Rows with their own actions (Waiting for your OK, Activity) ---- */
.okrow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: var(--space-5) var(--space-8); border-top: 1px solid var(--line-soft); }
.okrow:first-child { border-top: 0; }
.okrow__t { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.okrow__t b { display: flex; align-items: flex-start; gap: 8px; font-size: 15px; font-weight: 600; }
.okrow__t b .atl-icon { margin-top: 3px; width: 14px; height: 14px; }
.okrow__t span { font-size: 12px; color: var(--muted); }
.okrow__t p { font-size: 13px; color: var(--ink-2); }
.okrow__t p strong { color: var(--ink); font-weight: 600; }
.okrow .atl-actions { flex: 0 1 auto; max-width: 100%; }
.act { display: grid; grid-template-columns: 56px 18px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px var(--space-8); border-top: 1px solid var(--line-soft); font-size: 14px; }
.act:first-child { border-top: 0; }
.act time { font-size: 12px; color: var(--muted); }
.act .atl-icon { width: 14px; height: 14px; color: var(--ink-2); }
.act__t b { font-weight: 600; }
.act__note { display: block; font-size: 12px; color: var(--warn); }
@media (max-width: 40rem) { .okrow, .act { padding-left: var(--space-6); padding-right: var(--space-6); } .act { grid-template-columns: 18px minmax(0, 1fr); } .act time { grid-column: 2; grid-row: 2; } .act > .atl-badge { grid-column: 2; justify-self: start; } }

/* ---- Folds ---- */
details.fold { border: 1px solid var(--line); border-radius: var(--radius-card-sm); background: var(--surface); }
details.fold > summary { min-height: 56px; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-7); cursor: pointer; font-size: 15px; font-weight: 500; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary > .atl-icon:first-child { width: 14px; height: 14px; color: var(--muted); }
details.fold > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform 160ms ease; }
details.fold[open] > summary::after { transform: rotate(-135deg); }
details.fold[open] > summary { border-bottom: 1px solid var(--line-soft); }
.fold-body { padding: var(--space-6) var(--space-7); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.fold-body h3 { font-size: 20px; line-height: 1.3; font-weight: 400; }
.fold-body h4 { font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
.folds { display: flex; flex-direction: column; gap: var(--space-3); }
.block { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }

/* ---- How Atlas works: guide entries, a legend of icons and colors ---- */
.entries { display: grid; gap: var(--space-4); }
.entry { display: grid; gap: 6px; padding-top: var(--space-4); border-top: 1px solid var(--line-soft); }
.entry:first-child { border-top: 0; padding-top: 0; }
.entry h3 { font-size: 18px; font-weight: 500; display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap; }
.entry h3 span { font-size: 13px; color: var(--muted); font-weight: 400; }
.entry p { max-width: var(--measure); color: var(--ink-2); }
.entry ul, .entry ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: var(--measure); color: var(--ink-2); }
.say { list-style: none !important; padding: 0 !important; display: flex !important; flex-wrap: wrap; gap: 8px !important; max-width: none !important; }
.say li { background: var(--sunken); color: var(--ink); border-radius: var(--radius-pill); padding: 5px 14px; font-size: 13px; font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-7); align-items: flex-start; }
.legend > .atl-card { flex: 3 1 360px; }
.legend > .atl-card + .atl-card { flex: 2 1 280px; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--ink-2); }
.icons li { display: flex; align-items: center; gap: 10px; }
.icons .atl-icon { width: 15px; height: 15px; color: var(--ink); }
.states { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13px; color: var(--ink-2); }
.states li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; }
.states .atl-badge { justify-self: start; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-3); list-style: none; margin: 0; padding: 0; }
.swatch { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; font-size: 13px; background: var(--surface); }
.swatch i { display: block; height: 40px; border-bottom: 1px solid var(--line); }
.swatch p { padding: 6px 10px 0; font-weight: 600; }
.swatch span { display: block; padding: 0 10px 8px; color: var(--muted); }
.findbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.settings { display: grid; gap: var(--space-7); grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); align-items: start; }
.settings__list { display: flex; flex-direction: column; }
.act__end { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var RUN = { ok: ["Ran fine", "good"], early_exit: ["Ran fine", "good"], partial: ["Partly ran", "warn"], failed: ["Failed", "bad"],
    skipped_away: ["Skipped: away", "neutral"], skipped_paused: ["Paused", "neutral"], never_run: ["Not run yet", "neutral"] };
  var SEV_TONE = { high: "bad", medium: "warn", low: "neutral" };
  var CONN = { ok: ["Connected", "good"], issue: ["Needs attention", "bad"], unknown: ["Not checked yet", "neutral"], fallback: ["Not connected", "warn"] };
  var CAT_ICON = { mail: "mail", calendar: "event", files: "records", messages: "chat", chat: "chat", tasks: "commitment", notes: "draft" };
  var HEALTH = { ok: ["Running well", "good"], attention: ["Needs a look", "warn"], problem: ["Something's wrong", "bad"] };
  var STMT = { confirmed: ["Confirmed", "good"], proposed: ["Not yet confirmed", "warn"] };
  var PROV = { stated: "You said so", observed: "Observed", researched: "Researched", uploaded: "From your documents", inferred: "Inferred" };
  /* What a page press reads as in Activity */
  var VERB = { set_setting: ["settings", "You set {q}"], undo: ["undo", "You asked Atlas to undo {q}"], mark_done: ["done", "You marked {q} done"], mark_received: ["done", "You marked {q} received"], move_date: ["snooze", "You moved {q}"],
    answer: ["chat", "You answered {q}"], decline: ["dismiss", "You declined {q}"], not_useful: ["dismiss", "You said {q} wasn't useful"],
    confirm: ["done", "You confirmed {q}"], correct: ["draft", "You corrected {q}"], nudge: ["mail", "You asked for a nudge on {q}"], approve: ["done", "You approved {q}"] };
  var REQ = { queued: ["Waiting", "neutral", "pending"], waiting_chat: ["Waiting for a chat", "neutral", "pending"], needs_chat: ["Needs a chat", "warn", "chat"],
    applied: ["Applied", "good", "done"], refused: ["Not applied", "warn", null] };

  function small(text) { return text ? h("span", { class: "small" }, text) : null; }
  function fold(summary, count, body, icon) {
    return h("details", { class: "fold" }, h("summary", null, icon ? N.icon(icon) : null, h("span", null, summary), count != null ? N.badge(String(count)) : null), h("div", { class: "fold-body" }, body));
  }
  function part(id, title, note, body) {
    return h("section", { class: "part", id: id, "aria-labelledby": id + "-h" },
      h("div", { class: "part-head" }, h("h2", { id: id + "-h" }, title), note ? h("p", null, note) : null), body);
  }
  function zoneName() {
    try {
      var parts = new Intl.DateTimeFormat(N.meta.locale || undefined, { timeZone: N.meta.timezone, timeZoneName: "longGeneric" }).formatToParts(new Date());
      for (var i = 0; i < parts.length; i++) if (parts[i].type === "timeZoneName") return parts[i].value;
    } catch (e) { /* fall through */ }
    return N.meta.timezone || null;
  }

  N.page({ title: "Guide" }, function (d, main) {
    var issues = L(d.known_issues).filter(function (i) { return i.status !== "resolved"; });
    var asks = L(d.approvals), routines = L(d.routines);
    var acts = L(d.questions).filter(function (q) { return q.kind === "action"; });
    var qs = L(d.questions).filter(function (q) { return q.kind !== "action"; });
    var titles = {};
    routines.forEach(function (r) { titles[r.name] = r.title || r.name; });
    function byWhom(by) {
      if (!by) return null;
      if (by === "chat") return "Asked in a chat";
      var r = String(by).replace(/^routine:/, "");
      return "From the " + (titles[r] || r) + " automation";
    }

    if (d.away && d.away.active) {
      main.appendChild(h("ul", { class: "notices" }, h("li", { class: "notice", "data-level": "info" },
        h("p", null, "Away mode is on until " + N.dateY(d.away.end) + ". Briefs and drafts are paused; information is still collected. Say “I'm back” in chat to end it."))));
    }
    var parts = h("div", { class: "parts" });

    /* ================= Status: health, automations, connections ================= */
    var st = d.status || {}, hs = HEALTH[st.overall] || HEALTH.ok;
    var sys = d.system || {}, up = sys.update || {}, imp = sys.notes_import, impText = null;
    if (imp) {
      var from = imp.source_system ? " from " + imp.source_system : "", done = imp.processed || 0;
      var notes = function (n) { return n + (n === 1 ? " note" : " notes"); };
      if (imp.status === "complete") impText = "done: " + notes(done) + " brought in" + from + (imp.skipped ? ", " + imp.skipped + " skipped" : "");
      else if (imp.status === "undone") impText = "undone: the notes" + from + " were taken back out";
      else if (imp.status === "planned") impText = "getting ready to bring in your notes" + from;
      else if (imp.status === "sampling") impText = "checking a few sample notes" + from + " with you first";
      else if (imp.total) impText = "in progress, " + done + " of " + notes(imp.total) + from;
      else impText = "in progress, " + notes(done) + from + " so far";
    }
    var sysLine = [
      sys.updated_on ? "Your last Atlas update: " + N.date(sys.updated_on) : null,
      up.available && up.latest_version ? "Atlas " + up.latest_version + " is available" : null,
      sys.last_user_check ? "Your last health check: " + N.date(sys.last_user_check) : null,
      impText ? "Notes import " + impText : null
    ].filter(Boolean).join(". ");
    var flagged = L(d.suspicious);
    var issueRows = issues.map(function (i) {
      return N.row({ title: i.summary, tone: SEV_TONE[i.severity] || null, meta: [i.since ? "Since " + N.date(i.since) : null],
        badge: N.badge(i.severity === "high" ? "Critical" : i.severity === "medium" ? "Needs action" : "Minor", SEV_TONE[i.severity] || "neutral"),
        detail: i.fix ? function () { return N.detail({ blocks: [{ heading: "To fix", nodes: N.para(i.fix) }],
          actions: [N.request("Help me fix this", N.withId("Help me fix " + N.quote(i.summary), i.id), "secondary")] }); } : null });
    });
    var zone = zoneName();
    var autoCard = h("div", { class: "scard", id: "automations" }, h("h3", null, "Automations"),
      routines.length ? routines.map(function (r) {
        var lr = r.last_run || {}, s = lr.status || "never_run", off = r.enabled === false, word = off ? ["Off", "neutral"] : r.paused ? ["Paused", "neutral"] : RUN[s] || RUN.never_run;
        return h("div", { class: "srow" }, N.icon(word[1] === "good" ? "done" : word[1] === "bad" || word[1] === "warn" ? "alert" : "pending", word[1] === "good" ? "ok" : word[1]),
          h("span", { class: "srow__t" }, h("b", null, r.title || r.name), h("span", null, r.schedule_text || r.schedule),
            lr.summary ? h("span", null, N.rich(lr.summary)) : null),
          h("span", { class: "srow__end" }, h("span", { class: "w " + word[1] }, word[0]),
            h("span", null, lr.started ? N.dateTime(lr.started) : off || r.paused ? "" : r.next_run ? "Next " + N.dateTime(r.next_run) : "")));
      }) : h("p", { class: "srow" }, "No automations are set up yet."),
      h("p", { class: "srow small" }, [zone ? "Times are yours, in " + zone + "." : "", d.profile ? " Your " + N.label(d.profile).toLowerCase() + " profile." : "", " Ask Atlas in chat to pause, move or change one."].join("")));
    var conns = L(d.connections);
    var connCard = conns.length ? h("div", { class: "scard", id: "connections" }, h("h3", null, "Connections"), conns.map(function (c) {
      var s = CONN[c.status] || CONN.unknown, cat = L(c.categories)[0];
      return h("div", { class: "srow" }, N.icon(CAT_ICON[cat] || "link"),
        h("span", { class: "srow__t" }, h("b", null, c.name), h("span", null, c.note ? N.rich(c.note) : L(c.categories).map(N.label).join(", "))),
        N.badge(s[0], s[1]));
    })) : null;
    var jobs = L(d.jobs);
    parts.appendChild(part("status", "Status", "What Atlas runs on its own, and what it's connected to.", [
      h("div", { class: "health", role: "status" }, N.dot(hs[1]), h("span", { class: "health__word" }, hs[0]),
        h("span", { class: "health__text" }, N.rich(st.headline) || (issues.length ? "" : "Everything Atlas checks is working."))),
      issues.length ? N.listBox(issueRows) : null, N.more("known_issues"),
      h("div", { class: "status-cards" }, autoCard, connCard),
      up.available && up.notes ? h("p", { class: "small" }, N.rich(up.notes)) : null,
      jobs.length ? fold("Each step of the automations", jobs.length, N.listBox(jobs.map(function (j) {
        var w = RUN[j.last_status] || RUN.never_run;
        return N.row({ title: j.title || j.name, tone: w[1] === "neutral" ? null : w[1],
          meta: [j.last_success ? "Last succeeded " + N.dateTime(j.last_success) : "Not run yet", j.detail, j.paused ? "Paused" + (j.paused_until ? " until " + N.date(j.paused_until) : "") : null],
          badge: N.badge(w[0], w[1]) });
      })), "automation") : null,
      flagged.length ? fold("Suspicious instructions Atlas ignored", flagged.length,
        [h("p", { class: "small" }, "Found inside emails or documents in the last 14 days. Atlas did not follow them."),
          N.listBox(flagged.map(function (f) { return N.row({ title: N.rich(f.summary), meta: [N.dateTime(f.at)] }); }))], "alert") : null]));

    /* ================= Waiting for your OK: action needed, approvals, questions ================= */
    var oks = [];
    function okRow(icon, title, meta, note, actions) {
      return { data: {}, el: h("li", { class: "okrow" }, h("span", { class: "okrow__t" }, h("b", null, N.icon(icon), title), meta ? h("span", null, meta) : null, note), h("div", { class: "atl-actions" }, actions)) };
    }
    acts.forEach(function (q) {
      oks.push(okRow("alert", q.text, "Only you can do this", [q.how ? h("p", null, N.rich(q.how)) : null, q.copy_text ? h("pre", { class: "copy-text" }, q.copy_text) : null],
        [q.copy_text ? h("button", { type: "button", class: "atl-btn atl-btn--secondary", onclick: function (e) { N.copyText(q.copy_text, e.currentTarget); } }, N.icon("copy"), h("span", null, "Copy the text")) : null,
          N.request("I've done this", N.withId("I've done this: " + N.quote(q.text), q.id), "primary", true, { kind: "mark_done", target: q.id, quoted: q.text })]));
    });
    asks.forEach(function (a) {
      oks.push(okRow(/send|reply|forward/i.test(a.action) ? "mail" : "pending", a.action,
        [a.prepared ? "Prepared: " + a.prepared : null, byWhom(a.requested_by), a.requested_on ? "Asked " + N.date(a.requested_on) : null].filter(Boolean).join(" · "),
        a.why ? h("p", null, N.rich(a.why)) : null,
        [N.request("Approve", N.withId("Approve " + N.quote(a.action), a.id), "primary", true, { kind: "approve", target: a.id, quoted: a.action }),
          N.request("Decline", N.withId("Decline " + N.quote(a.action), a.id), "secondary", false, { kind: "decline", target: a.id, quoted: a.action })]));
    });
    qs.forEach(function (q) {
      var proposal = !!(q.proposed_change || q.evidence);
      oks.push(okRow("help", q.text, [q.evidence ? "Looks done" : "Question from Atlas", q.asked ? "Asked " + N.date(q.asked) : null].filter(Boolean).join(" · "),
        q.proposed_change ? h("p", null, h("strong", null, "Atlas suggests: "), N.rich(q.proposed_change)) : q.evidence ? h("p", null, h("strong", null, "Seen: "), N.rich(q.evidence)) : null,
        proposal ? [N.request("Yes", N.withId("Yes to your question " + N.quote(q.text), q.id), "primary", true, { kind: "answer", target: q.id, quoted: q.text, args: { choice: "yes" } }),
          N.request("No", N.withId("No to your question " + N.quote(q.text), q.id), "secondary", false, { kind: "answer", target: q.id, quoted: q.text, args: { choice: "no" } })]
          : [N.request("Answer in chat", N.withId("About your question " + N.quote(q.text) + ":", q.id), "secondary")]));
    });
    var nWaiting = acts.length + N.total("approvals", asks.length) + N.total("questions", qs.length);
    parts.appendChild(part("approvals", "Waiting for your OK",
      "Atlas sends or changes nothing here until you approve it. Anything that leaves Atlas goes out from a chat, once you confirm. Requests expire after 14 days that you're not away.",
      [N.listCard({ id: "ok-list", title: "Needs you", count: nWaiting || null, items: oks, show: 5, noun: "", empty: "Nothing is waiting for you." }),
        N.more("approvals"), N.more("questions")]));

    /* ================= Activity: your page presses (live pages) and Atlas's runs ================= */
