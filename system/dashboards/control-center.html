<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Guide</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.part { display: flex; flex-direction: column; gap: var(--space-6); }
.part-head { display: flex; flex-direction: column; gap: 4px; padding-top: var(--space-2); border-top: 1px solid var(--line); }
.part-head h2 { font-size: 30px; line-height: 34px; letter-spacing: -0.01em; padding-top: var(--space-4); }
.part-head p { color: var(--muted); font-size: 14px; }
.block { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; scroll-margin-top: calc(var(--header-h, 66px) + 16px); }
@media (max-width: 40rem) { .block { scroll-margin-top: 16px; } }
.block-tools { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }
.small { font-size: 14px; color: var(--muted); }
/* Status in one line */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.status-word { font-family: var(--font-display); font-size: 22px; line-height: 27px; font-weight: 500; }
.status-text { flex: 1 1 18rem; min-width: 0; color: var(--ink-2); }
.status .atl-dot { width: 12px; height: 12px; }
.copy-text { margin: 0; padding: 12px 14px; background: var(--sunken); border-radius: var(--radius-md); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; line-height: 19px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
/* Automations table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 12px 20px; border-top: 1px solid var(--line-soft); vertical-align: top; }
.tbl thead th { border-top: 0; background: var(--sunken); font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tbl td:first-child { font-weight: 500; }
.tbl .small { display: block; margin-top: 2px; font-weight: 400; }
.run { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
@media (max-width: 34rem) {
  .tbl thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tbl tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
  .tbl tbody tr:first-child { border-top: 0; }
  .tbl td { border: 0; padding: 0; }
  .tbl td[data-wide] { grid-column: 1 / -1; }
  .tbl td[data-label]::before { content: attr(data-label) " "; color: var(--muted); font-weight: 400; }
}
/* Folds */
details.fold { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
details.fold > summary { min-height: 52px; display: flex; align-items: center; gap: var(--space-2); padding: 0 20px; cursor: pointer; font-weight: 500; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(-135deg); }
details.fold > summary:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: var(--radius-lg); }
details.fold[open] > summary { border-bottom: 1px solid var(--line-soft); }
.fold-body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.fold-body h3 { font-size: 22px; line-height: 27px; }
.fold-body h4 { font-family: var(--font-sans); font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
/* Guide entries */
.entries { display: grid; gap: var(--space-4); }
.entry { display: grid; gap: 6px; padding-top: var(--space-4); border-top: 1px solid var(--line-soft); }
.entry:first-child { border-top: 0; padding-top: 0; }
.entry h3 { font-size: 20px; line-height: 26px; display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap; }
.entry h3 span { font-family: var(--font-sans); font-size: 14px; color: var(--muted); font-weight: 400; }
.entry p { max-width: var(--measure); color: var(--ink-2); }
.entry ul, .entry ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: var(--measure); color: var(--ink-2); }
.say { list-style: none !important; padding: 0 !important; display: flex !important; flex-wrap: wrap; gap: 8px !important; max-width: none !important; }
.say li { background: var(--accent-soft); color: var(--accent); border-radius: var(--radius-pill); padding: 3px 12px; font-size: 14px; }
/* Design system swatches */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-3); list-style: none; margin: 0; padding: 0; }
.swatch { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; font-size: 14px; background: var(--surface); }
.swatch i { display: block; height: 40px; border-bottom: 1px solid var(--line); }
.swatch p { padding: 6px 10px 0; font-weight: 500; }
.swatch span { display: block; padding: 0 10px 8px; color: var(--muted); }
.conns { display: flex; flex-wrap: wrap; gap: var(--space-2); list-style: none; margin: 0; padding: 0; }
.conn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface); font-size: 14px; }
.conn .small { margin-left: 2px; }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var RUN_TONE = { ok: "good", early_exit: "good", partial: "warn", failed: "bad" };
  var SEV_TONE = { high: "bad", medium: "warn", low: "neutral" };
  var CONN = { ok: ["Connected", "good"], issue: ["Needs attention", "bad"], unknown: ["Not checked yet", "neutral"], fallback: ["No connector (manual)", "neutral"] };
  var HEALTH = { ok: ["Running well", "good"], attention: ["Needs a look", "warn"], problem: ["Something's wrong", "bad"] };
  var STMT = { confirmed: ["Confirmed", "good"], proposed: ["Not yet confirmed", "warn"] };
  var PROV = { stated: "You said so", observed: "Observed", researched: "Researched", uploaded: "From your documents", inferred: "Inferred" };

  function small(text) { return text ? h("span", { class: "small" }, text) : null; }
  function run(text, tone) { return h("span", { class: "run" }, N.dot(tone), text); }
  function fold(summary, count, body) {
    return h("details", { class: "fold" }, h("summary", null, h("span", null, summary), count != null ? N.badge(String(count)) : null), h("div", { class: "fold-body" }, body));
  }
  function block(id, title, count, note, body, tools) {
    return h("div", { class: "block", id: id },
      h("div", { class: "block-tools" }, h("h3", { class: "sub" }, title, count != null ? h("span", { class: "count" }, String(count)) : null), tools || null),
      note ? h("p", { class: "small" }, note) : null, body);
  }
  function part(id, title, note, blocks) {
    return h("section", { class: "part", id: id, "aria-labelledby": id + "-h" },
      h("div", { class: "part-head" }, h("h2", { id: id + "-h" }, title), note ? h("p", null, note) : null), blocks);
  }
  function zoneName() {
    try {
      var parts = new Intl.DateTimeFormat(N.meta.locale || undefined, { timeZone: N.meta.timezone, timeZoneName: "longGeneric" }).formatToParts(new Date());
      for (var i = 0; i < parts.length; i++) if (parts[i].type === "timeZoneName") return parts[i].value;
    } catch (e) { /* fall through */ }
    return N.meta.timezone || null;
  }

  N.page({ title: "Guide" }, function (d, main) {
    var issues = L(d.known_issues).filter(function (i) { return i.status !== "resolved"; });
    var asks = L(d.approvals), routines = L(d.routines);
    var acts = L(d.questions).filter(function (q) { return q.kind === "action"; });
    var qs = L(d.questions).filter(function (q) { return q.kind !== "action"; });
    var titles = {};
    routines.forEach(function (r) { titles[r.name] = r.title || r.name; });
    function byWhom(by) {
      if (!by) return null;
      if (by === "chat") return "Asked in a chat";
      var r = String(by).replace(/^routine:/, "");
      return "From the " + (titles[r] || r) + " automation";
    }

    if (d.away && d.away.active) {
      main.appendChild(h("ul", { class: "notices" }, h("li", { class: "notice", "data-level": "info" },
        h("p", null, "Away mode is on until " + N.dateY(d.away.end) + ". Briefs and drafts are paused; information is still collected. Say “I'm back” in chat to end it."))));
    }

    /* ================= Needs you: action needed, approvals, questions ================= */
    var cards = [];
    acts.forEach(function (q) {
      cards.push(N.card({ eyebrow: ["Only you can do this", "warn"], title: q.text, detail: q.how || null,
        body: q.copy_text ? h("pre", { class: "copy-text" }, q.copy_text) : null,
        actions: [q.copy_text ? h("button", { type: "button", class: "atl-btn atl-btn--secondary", onclick: function (e) { N.copyText(q.copy_text, e.currentTarget); } }, N.icon("copy"), h("span", null, "Copy the text")) : null,
          N.request("I've done this", N.withId("I've done this: " + N.quote(q.text), q.id), "primary", true, { kind: "mark_done", target: q.id, quoted: q.text })] }));
    });
    asks.forEach(function (a) {
      cards.push(N.card({ eyebrow: ["Waiting for your OK", "warn"], title: a.action,
        detail: [a.prepared ? "Prepared: " + a.prepared : null, byWhom(a.requested_by), a.requested_on ? "Asked " + N.date(a.requested_on) : null].filter(Boolean).join(" · "),
        body: a.why ? h("p", null, N.rich(a.why)) : null,
        actions: [N.request("Approve", N.withId("Approve " + N.quote(a.action), a.id), "primary", true, { kind: "approve", target: a.id, quoted: a.action }),
          N.request("Decline", N.withId("Decline " + N.quote(a.action), a.id), "secondary", false, { kind: "decline", target: a.id, quoted: a.action })] }));
    });
    qs.forEach(function (q) {
      var proposal = !!q.proposed_change;
      cards.push(N.card({ eyebrow: ["Question from Atlas", "info"], title: q.text,
        detail: q.asked ? "Asked " + N.date(q.asked) : null,
        body: proposal ? h("p", null, h("b", null, "Proposed: "), N.rich(q.proposed_change)) : null,
        actions: proposal ? [N.request("Yes", N.withId("Yes to your question " + N.quote(q.text), q.id), "primary", true, { kind: "answer", target: q.id, quoted: q.text, args: { choice: "yes" } }),
          N.request("No", N.withId("No to your question " + N.quote(q.text), q.id), "secondary", false, { kind: "answer", target: q.id, quoted: q.text, args: { choice: "no" } })]
          : [N.request("Answer in chat", N.withId("About your question " + N.quote(q.text) + ":", q.id), "secondary")] }));
    });
    var nWaiting = acts.length + N.total("approvals", asks.length) + N.total("questions", qs.length);
    main.appendChild(N.section({ id: "needs", title: "Needs you", count: nWaiting || null,
      note: nWaiting ? "Atlas won't do these until you say so. Requests for your OK expire after 14 days that you're not away. Each button copies a reply for your Atlas chat." : null,
      body: [cards.length ? h("div", { class: "atl-grid" }, cards) : N.empty("Nothing is waiting for you."), N.more("approvals"), N.more("questions")] }));

    /* ================= How Atlas runs: status, issues, automations, connections ================= */
    var st = d.status || {}, hs = HEALTH[st.overall] || HEALTH.ok;
    var sys = d.system || {}, up = sys.update || {}, imp = sys.notes_import, impText = null;
    if (imp) {
      var from = imp.source_system ? " from " + imp.source_system : "", done = imp.processed || 0;
      var notes = function (n) { return n + (n === 1 ? " note" : " notes"); };
      if (imp.status === "complete") impText = "done: " + notes(done) + " brought in" + from + (imp.skipped ? ", " + imp.skipped + " skipped" : "");
      else if (imp.status === "undone") impText = "undone: the notes" + from + " were taken back out";
      else if (imp.status === "planned") impText = "getting ready to bring in your notes" + from;
      else if (imp.status === "sampling") impText = "checking a few sample notes" + from + " with you first";
      else if (imp.total) impText = "in progress, " + done + " of " + notes(imp.total) + from;
      else impText = "in progress, " + notes(done) + from + " so far";
    }
    var sysLine = [
      sys.installed_version ? "Atlas " + sys.installed_version + (up.available && up.latest_version ? ", update to " + up.latest_version + " available" : ", up to date") +
        (up.last_checked ? " (checked " + N.date(up.last_checked) + ")" : "") : null,
      sys.last_user_check ? "Your last health check: " + N.date(sys.last_user_check) : null,
      impText ? "Notes import " + impText : null
    ].filter(Boolean).join(". ");
    var flagged = L(d.suspicious);
    var issueRows = issues.map(function (i) {
      return N.row({ title: i.summary, tone: SEV_TONE[i.severity] || null, meta: [i.since ? "Since " + N.date(i.since) : null],
        badge: N.badge(i.severity === "high" ? "Problem" : i.severity === "medium" ? "Needs attention" : "Minor", SEV_TONE[i.severity] || "neutral"),
        detail: i.fix ? function () { return N.detail({ blocks: [{ heading: "To fix", nodes: N.para(i.fix) }],
          actions: [N.request("Help me fix this", N.withId("Help me fix " + N.quote(i.summary), i.id), "secondary")] }); } : null });
    });
    var healthBlock = block("health", "Health", null, null, [
      h("div", { class: "status" }, N.dot(hs[1]), h("span", { class: "status-word" }, hs[0]),
        h("span", { class: "status-text" }, N.rich(st.headline) || (issues.length ? "" : "Everything Atlas checks is working."))),
      issues.length ? N.listBox(issueRows) : null,
      N.more("known_issues"),
      up.available && up.notes ? h("p", { class: "small" }, N.rich(up.notes)) : null,
      sysLine ? h("p", { class: "small" }, sysLine + ".") : null,
      flagged.length ? fold("Suspicious instructions Atlas ignored", flagged.length,
        [h("p", { class: "small" }, "Found inside emails or documents in the last 14 days. Atlas did not follow them."),
          N.listBox(flagged.map(function (f) { return N.row({ title: N.rich(f.summary), meta: [N.dateTime(f.at)] }); }))]) : null]);

    var zone = zoneName();
    var autoBody = routines.length ? h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
      h("thead", null, h("tr", null, ["Automation", "When", "Last run", "Next run"].map(function (c) { return h("th", { scope: "col" }, c); }))),
      h("tbody", null, routines.map(function (r) {
        var lr = r.last_run || {}, s = lr.status || "never_run", off = r.enabled === false;
        return h("tr", null,
          h("td", null, r.title || r.name, r.paused ? small("Paused" + (r.paused_until ? " until " + N.date(r.paused_until) : "")) : null),
          h("td", null, r.schedule_text || r.schedule),
          h("td", { "data-wide": "" }, run(off ? "Off" : N.label(s), off ? null : RUN_TONE[s]), lr.started ? " " + N.dateTime(lr.started) : "", small(lr.summary)),
          h("td", { "data-label": "Next:" }, off || r.paused ? "Not scheduled" : (r.next_run ? N.dateTime(r.next_run) : "")));
      })))) : N.empty("No automations are set up yet.");
    var conns = L(d.connections);
    var connList = conns.length ? h("ul", { class: "conns", "aria-label": "Connections" }, conns.map(function (c) {
      var s = CONN[c.status] || CONN.unknown;
      return h("li", { class: "conn" }, N.dot(s[1]), h("span", null, c.name), c.status !== "ok" ? small(s[0] + (c.note ? ": " + N.rich(c.note) : "")) : null);
    })) : null;
    var jobs = L(d.jobs), runs = L(d.runs);
    var detail = (jobs.length || runs.length) ? fold("Each step and recent runs", null, [
      jobs.length ? h("div", { class: "tbl-wrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, h("th", { scope: "col" }, "Step"), h("th", { scope: "col" }, "Last result"), h("th", { scope: "col" }, "Details"))),
        h("tbody", null, jobs.map(function (j) {
          return h("tr", null, h("td", null, j.title || j.name),
            h("td", null, run(N.label(j.last_status || "never_run"), RUN_TONE[j.last_status])),
            h("td", { "data-wide": "" }, [j.last_success ? "Last succeeded " + N.dateTime(j.last_success) : "Not run yet", j.detail ? ". " + j.detail : "",
              j.paused ? ". Paused" + (j.paused_until ? " until " + N.date(j.paused_until) : "") : ""].join("")));
        })))) : null,
      runs.length ? [h("h4", null, "Recent runs"), N.listBox(runs.map(function (r) {
        return N.row({ title: (r.title || r.routine) + ", " + N.dateTime(r.started), tone: RUN_TONE[r.status] || null,
          meta: [r.duration_min != null ? r.duration_min + " min" : null, r.summary], badge: N.badge(N.label(r.status), RUN_TONE[r.status] || "neutral") });
      })), N.more("runs")] : null]) : null;
    var autoBlock = block("automations", "Automations", routines.length,
      [zone ? "Times are yours, in " + zone + ". " : "", d.profile ? "Your " + N.label(d.profile).toLowerCase() + " profile. " : "", "Ask Atlas in chat to pause, move or change one."].join(""),
      [autoBody, connList, detail]);
    main.appendChild(part("runs", "How Atlas runs", null, [healthBlock, autoBlock]));

    /* ================= What Atlas knows: recently filed, about you, the guide ================= */
    var rf = d.recently_filed || {}, filed = L(rf.items), days = rf.days || 14;
    var filedRows = filed.map(function (f) {
      var isNew = f.change === "new";
      var row = N.row({ title: f.title, tone: isNew ? "info" : null,
        meta: [N.label(f.kind), f.what, f.from ? "From " + f.from : null, f.at ? N.weekday(f.at) : null],
        badge: N.badge(isNew ? "New" : "Updated", isNew ? "good" : "neutral"),
        action: N.request("Wrong?", N.withId("That's filed wrong: " + N.quote(f.title), f.id), "ghost") });
      row._change = isNew ? "new" : "updated";
      return row;
    });
    var filedShow = "all", filedQ = "";
    var filedEmpty = h("p", { class: "empty", hidden: true }, "Nothing here matches.");
    function applyFiled() {
      var n = 0;
      filedRows.forEach(function (r) { var ok = (filedShow === "all" || r._change === filedShow) && N.matches(r, filedQ); r.hidden = !ok; n += ok ? 1 : 0; });
      filedEmpty.hidden = n > 0;
    }
    var left = (N.meta.truncated || {}).recently_filed;
    var filedBlock = block("filed", "Recently filed", N.total("recently_filed", filed.length),
      "What Atlas filed in the last " + days + " days, newest first. If one is wrong, say so.",
      filed.length ? [N.listBox(filedRows), filedEmpty, h("p", { class: "more" }, (left ? left + " more in the last " + days + " days. " : "") + "For anything older, ask Atlas in chat.")]
        : N.empty("Atlas hasn't filed anything in the last " + days + " days."),
      filed.length ? [N.segmented("Show", [{ value: "all", label: "All" }, { value: "new", label: "New" + (rf["new"] != null ? " (" + rf["new"] + ")" : "") },
        { value: "updated", label: "Updated" + (rf.updated != null ? " (" + rf.updated + ")" : "") }], "all", function (v) { filedShow = v; applyFiled(); }),
        N.search("Find in recently filed", function (q) { filedQ = q; applyFiled(); })] : null);

    var ab = d.about || {}, b = ab.basics || {}, files = L(ab.files);
    /* A belief is named by its profile file; its text (quoted) says which statement (plans: live pages). */
    function statement(s) {
      var tag = STMT[s.status] || STMT[s.provenance === "stated" ? "confirmed" : "proposed"];
      var ev = L(s.evidence).map(N.name).filter(function (x) { return x && x.indexOf("/") === -1; });
      var where = (PROV[s.provenance] || N.label(s.provenance)) + (ev.length ? ": " + ev.join(", ") : "");
      var proposed = s.status === "proposed";
      return N.row({ title: N.rich(s.text), tone: proposed ? "warn" : "good",
        meta: [where, s.date ? N.dateY(s.date) : null], badge: N.badge(tag[0], tag[1]),
        action: proposed ? N.request("Confirm", "Your belief about me is right: " + N.quote(N.rich(s.text)), "secondary", true,
          s.part && { kind: "confirm", target: "profile/" + s.part, quoted: s.text }) : null,
        detail: proposed ? function () { return N.detail({ actions: [N.request("Correct it", "Your belief about me is wrong: " + N.quote(N.rich(s.text)) + ". Actually,", "secondary", false,
          s.part && { kind: "correct", target: "profile/" + s.part, quoted: s.text, input: "text" })] }); } : null });
    }
    var all = [], featured = [];
    files.forEach(function (f) { L(f.groups).forEach(function (g) { L(g.statements).forEach(function (s) { if (s && !s.part) s.part = f.part; all.push(s); if (s.featured) featured.push(s); }); }); });
    if (!featured.length) featured = all.slice(0, 3);
    var who = [b.role ? b.role + (b.company ? " at " + N.name(b.company) : "") : null, b.manager ? "reports to " + N.name(b.manager) : null].filter(Boolean).join("; ");
    var restCount = all.length - featured.length;
    var foldBody = [N.facts([["Name", b.name], ["Time zone", b.timezone], ["Key people", L(b.key_people).map(N.name).join(", ")], ["Current goals", L(b.goals).map(N.name).join(", ")]])];
    files.forEach(function (f) {
      var groups = L(f.groups).map(function (g) {
        var rest = L(g.statements).filter(function (s) { return featured.indexOf(s) === -1; });
        return rest.length ? h("div", { class: "block" }, g.heading ? h("h4", null, g.heading) : null, N.listBox(rest.map(statement))) : null;
      }).filter(Boolean);
      foldBody.push(h("div", { class: "block" }, h("h3", null, f.title || N.label(f.part)),
        f.description || f.updated ? h("p", { class: "small" }, [f.description, f.updated ? "Updated " + N.dateY(f.updated) + "." : null].filter(Boolean).join(" ")) : null,
        groups.length ? groups : N.empty("Nothing more here yet."), N.more("about.files." + f.part)));
    });
    var ds = ab.design;
    if (ds) {
      foldBody.push(h("div", { class: "block" }, h("h3", null, "Design system"), h("p", { class: "small" }, "Used for your documents, decks, and these pages."),
        ds.summary ? h("p", null, N.rich(ds.summary)) : null,
        L(ds.colors).length ? h("ul", { class: "swatches", "aria-label": "Brand colors" }, L(ds.colors).map(function (c) {
          var hex = /^#[0-9a-fA-F]{3,8}$/.test(c.hex || "") ? c.hex : "transparent";
          return h("li", { class: "swatch" }, h("i", { style: "background:" + hex, "aria-hidden": "true" }), h("p", null, c.name), h("span", null, [c.hex, c.use].filter(Boolean).join(", ")));
        })) : null,
        L(ds.fonts).length ? N.facts(L(ds.fonts).map(function (f) { return [f.role, f.family]; })) : null));
    }
    var aboutBlock = block("about", "About you", null,
      (who ? who + ". " : "") + "What Atlas believes about you, and where each belief came from. Only confirmed ones are treated as fact.",
      [featured.length ? N.listBox(featured.map(statement)) : N.empty("Atlas hasn't learned anything about you yet."),
        fold("Everything else Atlas knows about you", restCount > 0 ? restCount + " more" : null, foldBody)]);

    var g = d.guide || {}, news = L(g.whats_new), secs = L(g.sections);
    function paras(list) { return L(list).map(function (p) { return h("p", null, N.rich(p)); }); }
    var entryEls = [];
    function entry(it) {
      var el = h("article", { class: "entry" }, h("h3", null, it.title), paras(it.body),
        L(it.bullets).length ? h("ul", null, L(it.bullets).map(function (x) { return h("li", null, N.rich(x)); })) : null,
        L(it.steps).length ? h("ol", null, L(it.steps).map(function (x) { return h("li", null, N.rich(x)); })) : null,
        L(it.examples).length ? h("ul", { class: "say", "aria-label": "Try saying" }, L(it.examples).map(function (x) { return h("li", null, "“" + x + "”"); })) : null);
      entryEls.push(el);
      return el;
    }
    var folds = [];
    if (news.length) {
      folds.push(fold("What's new in Atlas " + news[0].version, null, [h("div", { class: "entries" }, news.map(function (r) {
        return h("article", { class: "entry" }, h("h3", null, "Atlas " + r.version, r.date ? h("span", null, N.dateY(r.date)) : null),
          h("ul", null, L(r.items).map(function (x) { return h("li", null, N.rich(x)); })));
      })), N.more("guide.whats_new")]));
    }
    var secFolds = secs.map(function (s) {
      var f = fold(s.title, null, [s.intro ? h("p", { class: "small" }, N.rich(s.intro)) : null,
        L(s.items).length ? h("div", { class: "entries" }, L(s.items).map(entry)) : N.empty("Nothing here yet."), N.more("guide.sections." + s.id)]);
      folds.push(f);
      return f;
    });
    var guideEmpty = h("p", { class: "empty", hidden: true }, "Nothing in the guide matches. Ask Atlas in chat instead.");
    function findGuide(q) {
      entryEls.forEach(function (e) { e.hidden = !N.matches(e, q); });
      var any = false;
      secFolds.forEach(function (f) {
        var hit = !q || f.querySelectorAll(".entry:not([hidden])").length > 0;
        f.hidden = !hit; if (q && hit) f.open = true; any = any || hit;
      });
      guideEmpty.hidden = !q || any;
    }
    var guideBlock = block("guide", "Guide", null, "What Atlas can do, how to ask, and what changed lately.",
      [g.intro ? h("p", null, N.rich(g.intro)) : null, folds.length ? folds : N.empty("Ask Atlas in chat what it can do."), guideEmpty],
      secs.length ? N.search("How do I…", findGuide) : null);
    main.appendChild(part("knows", "What Atlas knows", null, [filedBlock, aboutBlock, guideBlock]));

    return {
      dateLine: "How Atlas is running, and what it knows about you.", lead: st.headline,
      stats: [
        { key: "needs", jump: "needs", value: nWaiting, label: ["needs you", "need you"] },
        { key: "issues", jump: "health", tone: "bad", value: N.total("known_issues", issues.length), label: ["known issue", "known issues"] },
        { key: "automations", jump: "automations", value: routines.length, label: ["automation", "automations"] },
        sys.installed_version ? { key: "version", jump: "health", value: sys.installed_version, label: up.available ? "Atlas version, update available" : "Atlas version" } : null]
    };
  });
})();
</script>
