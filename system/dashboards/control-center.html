<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Control Center</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.state { display: inline-flex; align-items: center; gap: .45rem; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.state::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--tone, var(--muted)); }
.state[data-tone="ok"] { --tone: var(--ok); }
.state[data-tone="warn"] { --tone: var(--warn); }
.state[data-tone="danger"] { --tone: var(--danger); }
.jobs-line { font-size: .85rem; color: var(--ink-2); }
.jobtable { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: .9rem; }
.jobtable th, .jobtable td { text-align: left; padding: .55rem .9rem; border-top: 1px solid var(--line); vertical-align: top; }
.jobtable thead th { border-top: 0; font-size: .8rem; color: var(--ink-2); font-weight: 600; }
.jobtable td:first-child { font-weight: 600; }
@media (max-width: 34rem) {
  .jobtable thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .jobtable tr { display: grid; grid-template-columns: 1fr auto; padding: .5rem .8rem; border-top: 1px solid var(--line); }
  .jobtable td { border: 0; padding: .1rem 0; }
  .jobtable td:nth-child(3) { grid-column: 1 / -1; color: var(--ink-2); }
}
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: .9rem; }
.log li { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: .1rem 1rem; padding: .45rem 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.log time { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.log .actor { color: var(--ink-2); font-size: .82rem; }
@media (max-width: 34rem) { .log li { grid-template-columns: minmax(0, 1fr); } }
.fix { font-size: .92rem; }
.fix b { font-weight: 600; }
.copy { margin-top: .6rem; }
.copy pre { margin: 0; padding: .7rem .9rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); font-family: var(--font-id); font-size: .82rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.copy button { margin-top: .45rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .8rem; cursor: pointer; font-size: .85rem; }
.copy button:hover { border-color: var(--accent); }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var RUN_TONE = { ok: "ok", early_exit: "ok", partial: "warn", failed: "danger", skipped_away: null, skipped_paused: null, never_run: null };
  var SEV_TONE = { high: "danger", medium: "warn", low: null };
  var CONN = { ok: ["Connected", "ok"], issue: ["Needs attention", "danger"], unknown: ["Not checked yet", null], fallback: ["No connector (manual)", null] };

  function state(text, tone) { return h("span", { class: "state", "data-tone": tone || null }, text); }

  N.page({ title: "Control Center" }, function (d, main) {
    var issues = L(d.known_issues).filter(function (i) { return i.status !== "resolved"; });
    var asks = L(d.approvals), routines = L(d.routines);
    var acts = L(d.questions).filter(function (q) { return q.kind === "action"; });
    var qs = L(d.questions).filter(function (q) { return q.kind !== "action"; });

    function copyBlock(text) {
      var pre = h("pre", null, text);
      var btn = h("button", { type: "button" }, "Copy");
      btn.addEventListener("click", function () {
        try {
          navigator.clipboard.writeText(text).then(function () { btn.textContent = "Copied"; },
            function () { btn.textContent = "Select the text above to copy it"; });
        } catch (e) { btn.textContent = "Select the text above to copy it"; }
      });
      return h("div", { class: "copy" }, pre, btn);
    }

    if (d.away && d.away.active) {
      main.appendChild(h("ul", { class: "notices" }, h("li", { class: "notice", "data-level": "info" },
        "Away mode is on until " + N.dateY(d.away.end) + ". Briefs and drafts are paused; information is still collected. Say \"I'm back\" in chat to end it.")));
    }

    if (acts.length) {
      main.appendChild(N.section({ id: "actions", title: "Action needed",
        note: ["Only you can do these. Atlas keeps them here, and at the top of your ", N.pageLink("daily-brief", "Daily Brief"), ", until they're done. Tell Atlas in chat when you've done one."],
        body: N.items(acts.map(function (q) {
          return N.item({ tone: "warn", title: q.text, text: q.how || null,
            extra: q.copy_text ? copyBlock(q.copy_text) : null,
            aside: [q.asked ? h("span", null, "Since " + N.date(q.asked)) : null] });
        })) }));
    }

    main.appendChild(N.section({ id: "issues", title: "Known issues", count: N.total("known_issues", issues.length), key: "known_issues",
      note: "Problems Atlas found that may need you.",
      body: N.items(issues.map(function (i) {
        return N.item({ tone: SEV_TONE[i.severity] || "muted", title: i.summary, aside: [N.chip(N.label(i.severity), SEV_TONE[i.severity]), h("span", null, "Since " + N.date(i.since))],
          extra: i.fix ? h("p", { class: "fix" }, h("b", null, "To fix: "), N.rich(i.fix)) : null });
      }), "No known issues. Everything Atlas checks is working.") }));

    main.appendChild(N.section({ id: "approvals", title: "Waiting for your OK", count: N.total("approvals", asks.length), key: "approvals",
      note: "Nothing here happens until you say yes in chat. Requests expire after 14 days that you're not away.",
      body: N.items(asks.map(function (a) {
        return N.item({ tone: "warn", title: a.action, text: a.why,
          meta: [a.prepared ? "Prepared: " + a.prepared : null, a.requested_by ? "Requested by " + a.requested_by : null],
          aside: [h("span", null, "Asked " + N.date(a.requested_on)), a.expires_on ? h("span", null, "Expires " + N.date(a.expires_on)) : null] });
      }), "Nothing is waiting for approval.") }));

    main.appendChild(N.section({ id: "questions", title: "Questions from Atlas", count: N.total("questions", qs.length), key: "questions",
      note: "Answer in chat whenever it suits you.",
      body: N.items(qs.map(function (q) {
        return N.item({ tone: "accent", title: q.text, text: q.proposed_change ? "Proposed: " + q.proposed_change : null,
          aside: [q.kind ? N.chip(N.label(q.kind)) : null] });
      }), "No open questions.") }));

    main.appendChild(N.section({ id: "automations", title: "Automations", count: routines.length,
      note: d.profile ? "Your " + N.label(d.profile).toLowerCase() + " automation profile. Ask Atlas in chat to pause, reschedule, or change one." : null,
      body: N.items(routines.map(function (r) {
        var lr = r.last_run || {};
        var st = lr.status || "never_run";
        return N.item({ tone: r.enabled === false ? "muted" : (RUN_TONE[st] || "muted"), title: r.title || r.name,
          meta: [r.schedule_text || r.schedule, r.paused ? "Paused" + (r.paused_until ? " until " + N.date(r.paused_until) : "") : null],
          text: lr.summary,
          extra: L(r.jobs).length ? h("p", { class: "jobs-line" }, "Runs: " + L(r.jobs).join(", ")) : null,
          aside: [state(r.enabled === false ? "Off" : N.label(st), r.enabled === false ? null : RUN_TONE[st]),
            lr.started ? h("span", null, "Last " + N.dateTime(lr.started)) : null,
            r.next_run && r.enabled !== false ? h("span", null, "Next " + N.dateTime(r.next_run)) : null] });
      }), "No automations are set up yet.") }));

    var jobs = L(d.jobs);
    if (jobs.length) {
      main.appendChild(N.section({ id: "jobs", title: "Jobs", note: "Each automation runs these steps. Last result of each.",
        body: h("table", { class: "jobtable" },
          h("thead", null, h("tr", null, h("th", { scope: "col" }, "Job"), h("th", { scope: "col" }, "Last result"), h("th", { scope: "col" }, "Details"))),
          h("tbody", null, jobs.map(function (j) {
            return h("tr", null, h("td", null, j.title || j.name),
              h("td", null, state(N.label(j.last_status || "never_run"), RUN_TONE[j.last_status])),
              h("td", null, [j.last_success ? "Last succeeded " + N.dateTime(j.last_success) : "Not run yet", j.detail ? ". " + j.detail : "", j.paused ? ". Paused" + (j.paused_until ? " until " + N.date(j.paused_until) : "") : ""].join("")));
          }))) }));
    }

    var conns = L(d.connections);
    main.appendChild(N.section({ id: "connections", title: "Connections", count: conns.length,
      note: "The tools Atlas reads from and drafts in.",
      body: N.items(conns.map(function (c) {
        var s = CONN[c.status] || CONN.unknown;
        return N.item({ tone: s[1] || "muted", title: c.name,
          meta: [L(c.categories).map(N.label).join(", "), c.available_in_routines === false ? "Not available to automations" : null, c.last_seen ? "Last read " + N.dateTime(c.last_seen) : null],
          text: c.note, aside: [state(s[0], s[1])] });
      }), "No tools connected yet.") }));

    var runs = L(d.runs);
    if (runs.length) {
      main.appendChild(N.section({ id: "runs", title: "Recent runs", count: N.total("runs", runs.length), key: "runs",
        body: N.items(runs.map(function (r) {
          return N.item({ tone: RUN_TONE[r.status] || "muted", title: r.routine + ", " + N.dateTime(r.started), text: r.summary,
            meta: [r.duration_min != null ? r.duration_min + " min" : null, r.report], aside: [state(N.label(r.status), RUN_TONE[r.status])] });
        })) }));
    }

    var act = L(d.activity);
    main.appendChild(N.section({ id: "activity", title: "Recent activity", count: N.total("activity", act.length), key: "activity",
      note: "Every change Atlas made, newest first.",
      body: act.length ? h("div", { class: "items", style: "padding:.4rem 1rem" }, h("ul", { class: "log" }, act.map(function (a) {
        return h("li", null, h("time", { datetime: a.at }, N.dateTime(a.at)),
          h("div", null, h("p", null, N.rich(a.summary)), h("p", { class: "actor" }, [a.actor, a.action].filter(Boolean).join(", "))));
      }))) : N.empty("No activity yet.") }));

    var flagged = L(d.suspicious);
    if (flagged.length) {
      main.appendChild(N.section({ id: "flagged", title: "Suspicious content", note: "Instructions found inside emails or documents. Atlas ignored them.",
        body: N.items(flagged.map(function (f) { return N.item({ tone: "warn", title: f.summary, meta: [N.dateTime(f.at), f.source ? N.rid(f.source) : null] }); })) }));
    }

    var sys = d.system || {};
    var up = sys.update || {};
    var imp = sys.notes_import;
    var impText = null;
    if (imp) {
      var from = imp.source_system ? " from " + imp.source_system : "";
      var done = imp.processed || 0;
      var plural = function (n) { return n + (n === 1 ? " note" : " notes"); };
      if (imp.status === "complete") impText = "Done: " + plural(done) + " brought in" + from + (imp.skipped ? ", " + imp.skipped + " skipped" : "");
      else if (imp.status === "undone") impText = "Undone: the notes" + from + " were taken back out";
      else if (imp.status === "planned") impText = "Getting ready to bring in your notes" + from;
      else if (imp.status === "sampling") impText = "Checking a few sample notes" + from + " with you first";
      else if (imp.total) impText = "In progress: " + done + " of " + plural(imp.total) + from;
      else impText = "In progress: " + plural(done) + from + " so far";
    }
    main.appendChild(N.section({ id: "system", title: "Atlas itself",
      body: [N.facts([["Version", sys.installed_version], ["Latest release", up.latest_version ? up.latest_version + (up.available ? " (update available)" : "") : null],
        ["Last checked for updates", up.last_checked ? N.date(up.last_checked) : null], ["Your health check", sys.last_user_check ? N.date(sys.last_user_check) : null],
        ["System health check", sys.last_system_check ? N.date(sys.last_system_check) : null], ["Data format", sys.data_version != null ? "Version " + sys.data_version : null], ["Import", impText]]),
        up.available && up.notes ? h("p", { class: "item-insight", style: "margin-top:.75rem" }, N.rich(up.notes)) : null] }));

    var failing = routines.filter(function (r) { var s = (r.last_run || {}).status; return s === "failed" || s === "partial"; }).length;
    var st = d.status || {};
    return { subtitle: "How Atlas is running, and what it needs from you.", lede: st.headline || (failing ? failing + " automation needs a look" : "Everything is running"),
      stats: (acts.length ? [[acts.length, acts.length === 1 ? "action for you" : "actions for you"]] : []).concat([
        [routines.filter(function (r) { return r.enabled !== false; }).length, "automations on"],
        [N.total("approvals", asks.length), "waiting for your OK"], [N.total("questions", qs.length), ["question", "questions"]], [issues.length, ["known issue", "known issues"]]]) };
  });
})();
</script>
</body>
</html>
