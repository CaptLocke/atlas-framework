<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Decisions and Risks</title>
<style id="nova-base">
/* Nova dashboard base styles.
   CANONICAL COPY. Every template in system/dashboards/*.html inlines this file
   verbatim inside <style id="nova-base">. Edit this file, then run
   `python3 system/tests/dashboards/render.py --sync` to copy it into the
   templates, and `--check` to confirm they match.

   Theming: nova-dashboards fills <style id="nova-theme"> with --brand-* values
   from user/profile/design-system.md. Nothing here sets --brand-*, so an empty
   theme block falls back to the neutral defaults below. */

:root {
  color-scheme: light dark;
  --font-heading: var(--brand-font-heading, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif);
  --font-body: var(--brand-font-body, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --font-id: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  --bg: var(--brand-bg, #f4f6f8);
  --surface: var(--brand-surface, #ffffff);
  --surface-2: #eaeef2;
  --ink: var(--brand-ink, #1a2632);
  --ink-2: #4a5866;
  --line: #d3dae1;
  --accent: var(--brand-accent, #2b5a8a);
  --accent-ink: var(--brand-accent-ink, #ffffff);
  --accent-soft: #e2ebf5;
  --star: var(--brand-highlight, #a86f12);
  --ok: #2c7552;
  --warn: #8f5500;
  --danger: #b0281f;
  --muted: #7a8794;

  --radius: 6px;
  --gutter: 16px;
  --measure: 72ch;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--brand-bg-dark, #10161d);
    --surface: var(--brand-surface-dark, #17212b);
    --surface-2: #1f2b37;
    --ink: var(--brand-ink-dark, #e3e9ef);
    --ink-2: #a5b2bf;
    --line: #2c3a48;
    --accent: var(--brand-accent-dark, #8eb5e3);
    --accent-ink: var(--brand-accent-ink-dark, #0d1620);
    --accent-soft: #1d3149;
    --star: var(--brand-highlight-dark, #e2b45c);
    --ok: #6cc49a;
    --warn: #e5a94c;
    --danger: #f08b80;
    --muted: #7f8e9c;
  }
}
:root[data-theme="dark"] {
  --bg: var(--brand-bg-dark, #10161d);
  --surface: var(--brand-surface-dark, #17212b);
  --surface-2: #1f2b37;
  --ink: var(--brand-ink-dark, #e3e9ef);
  --ink-2: #a5b2bf;
  --line: #2c3a48;
  --accent: var(--brand-accent-dark, #8eb5e3);
  --accent-ink: var(--brand-accent-ink-dark, #0d1620);
  --accent-soft: #1d3149;
  --star: var(--brand-highlight-dark, #e2b45c);
  --ok: #6cc49a;
  --warn: #e5a94c;
  --danger: #f08b80;
  --muted: #7f8e9c;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; line-height: 1.2; margin: 0; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Page frame ---- */
.wrap { max-width: 72rem; margin: 0 auto; padding: 0 var(--gutter); }
@media (min-width: 52rem) { :root { --gutter: 32px; } }

.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: .5rem .75rem; z-index: 10; }
.skip:focus { left: var(--gutter); top: .5rem; }

/* Masthead: the one expressive element. */
.mast { padding: 2.25rem 0 1.75rem; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
.mast-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .35rem 1rem; margin-bottom: 1.1rem; }
.mast-who { display: flex; align-items: center; gap: .5rem; color: var(--ink-2); font-size: .9rem; margin: 0; }
.mast-fresh { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: 0; color: var(--ink-2); font-size: .85rem; font-variant-numeric: tabular-nums; }
.mast-who svg { width: 1.1rem; height: 1.1rem; fill: var(--star); flex: none; }
.mast h1 { font-size: clamp(2.1rem, 6vw, 3.4rem); letter-spacing: -0.015em; font-weight: 600; }
.mast-sub { font-family: var(--font-heading); font-size: clamp(1.1rem, 2.6vw, 1.4rem); color: var(--ink-2); margin-top: .35rem; }
.mast-lede { max-width: var(--measure); margin-top: 1rem; font-size: 1.05rem; }
.mast-stats { display: flex; flex-wrap: wrap; gap: .5rem 1.75rem; margin: 1.25rem 0 0; padding: 0; list-style: none; }
.mast-stats li { display: flex; align-items: baseline; gap: .4rem; color: var(--ink-2); font-size: .9rem; }
.mast-stats b { font-family: var(--font-heading); font-size: 1.5rem; color: var(--ink); font-weight: 600; }
.mast-nav { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-size: .9rem; }
.mast-nav a[aria-current="page"] { color: var(--ink); text-decoration: none; font-weight: 600; }

/* Notices (stale data, connection problems) */
.notices { list-style: none; margin: 0 0 1.5rem; padding: 0; display: grid; gap: .5rem; }
.notice { border-left: 3px solid var(--warn); background: var(--surface); padding: .6rem .9rem; border-radius: 0 var(--radius) var(--radius) 0; font-size: .95rem; }
.notice[data-level="error"] { border-color: var(--danger); }
.notice[data-level="info"] { border-color: var(--accent); }

/* ---- Sections: heading in a margin column on wide screens ---- */
.sec { padding: 1.25rem 0 1.75rem; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; padding-top: 0; }
.sec-head { margin-bottom: .75rem; }
.sec-head h2 { font-size: 1.3rem; display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
.count { font-family: var(--font-body); font-size: .85rem; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 0 .55rem; line-height: 1.6; }
.sec-note { color: var(--ink-2); font-size: .9rem; margin-top: .3rem; max-width: 40ch; }
.sec-body { min-width: 0; }
@media (min-width: 52rem) {
  .sec { display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: 2rem; }
  .sec-head { margin: 0; }
  .sec-head > div { position: sticky; top: 1rem; }
  .sec:first-child { padding-top: 0; }
}

/* ---- Item rows ---- */
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); }
.item { position: relative; display: flex; gap: .75rem 1.25rem; justify-content: space-between; padding: .85rem 1rem .85rem 1.25rem; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item::before { content: ""; position: absolute; left: 0; top: .8rem; bottom: .8rem; width: 3px; border-radius: 0 2px 2px 0; background: var(--tone, transparent); }
.item[data-tone="danger"] { --tone: var(--danger); }
.item[data-tone="warn"] { --tone: var(--warn); }
.item[data-tone="ok"] { --tone: var(--ok); }
.item[data-tone="accent"] { --tone: var(--accent); }
.item[data-tone="muted"] { --tone: var(--muted); }
.item-main { min-width: 0; flex: 1; display: grid; gap: .25rem; }
.item-title { font-weight: 600; }
.item-meta { display: flex; flex-wrap: wrap; gap: .15rem 1rem; color: var(--ink-2); font-size: .875rem; }
.item-text { font-size: .95rem; max-width: var(--measure); }
.item-insight { font-size: .9rem; color: var(--ink-2); max-width: var(--measure); }
.item-insight b, .item-text b { color: var(--ink); font-weight: 600; }
.item-aside { flex: none; text-align: right; font-size: .875rem; color: var(--ink-2); display: grid; gap: .25rem; align-content: start; justify-items: end; }
@media (max-width: 34rem) {
  .item { flex-direction: column; }
  .item-aside { text-align: left; justify-items: start; display: flex; flex-wrap: wrap; gap: .4rem; }
}

/* Record IDs: always visible so the user can ask Nova about the record. */
.rid { font-family: var(--font-id); font-size: .76rem; color: var(--ink-2); background: var(--surface-2); padding: .05em .4em; border-radius: 4px; -webkit-user-select: all; user-select: all; overflow-wrap: anywhere; justify-self: start; }
a.rid { text-decoration: none; }
a.rid:hover { color: var(--accent); }

/* Chips: short status words. Color always paired with text. */
.chip { display: inline-block; font-size: .78rem; font-weight: 600; line-height: 1.5; padding: 0 .5rem; border-radius: 999px; border: 1px solid currentColor; color: var(--ink-2); white-space: nowrap; }
.chip[data-tone="danger"] { color: var(--danger); }
.chip[data-tone="warn"] { color: var(--warn); }
.chip[data-tone="ok"] { color: var(--ok); }
.chip[data-tone="accent"] { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }

.empty { color: var(--ink-2); font-style: italic; padding: .25rem 0; }
.more { color: var(--ink-2); font-size: .875rem; margin-top: .6rem; }
.error-box { background: var(--surface); border: 1px solid var(--danger); padding: 1rem; border-radius: var(--radius); }

/* ---- Controls (filters, search, tabs) ---- */
.controls { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-bottom: .9rem; }
.seg { display: inline-flex; flex-wrap: wrap; gap: .3rem; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .25rem .8rem; cursor: pointer; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:hover { border-color: var(--accent); }
.search { flex: 1 1 14rem; max-width: 24rem; }
.search input { width: 100%; padding: .4rem .75rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

/* Key facts */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .9rem 1.25rem; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: .8rem; color: var(--ink-2); }
.facts dd { margin: 0; font-weight: 600; }

/* Progress bar */
.bar { height: .5rem; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* ---- Footer ---- */
.foot { margin-top: 2.5rem; padding: 1.25rem 0 2.5rem; border-top: 1px solid var(--line); color: var(--ink-2); font-size: .875rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem; align-items: center; }
.theme-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: .2rem .75rem; cursor: pointer; font-size: .85rem; color: var(--ink-2); }

/* ---- Print ---- */
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f0f0f0; --ink: #000000; --ink-2: #333333;
    --line: #bbbbbb; --accent: #000000; --star: #000000; --ok: #000000; --warn: #000000; --danger: #000000; --muted: #555555;
  }
  body { font-size: 11pt; }
  .no-print, .controls, .theme-btn, .skip, .mast-nav { display: none !important; }
  .items { border: 0; }
  .item { break-inside: avoid; padding-left: .75rem; }
  .sec { break-inside: auto; }
  .sec-head > div { position: static; }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
}
</style>
<style id="nova-page">
.why { border-left: 2px solid var(--line); padding-left: .75rem; font-size: .95rem; max-width: var(--measure); }
.why b { font-weight: 600; }
.alts { font-size: .875rem; color: var(--ink-2); }
.sev { display: inline-grid; grid-template-columns: repeat(3, .55rem); gap: 2px; vertical-align: middle; margin-right: .35rem; }
.sev i { height: .55rem; border-radius: 1px; background: var(--surface-2); }
.sev i.on { background: var(--tone, var(--ink-2)); }
.risk-score { display: flex; align-items: center; font-size: .8rem; color: var(--ink-2); }
.page-search { margin-bottom: 1.5rem; }
.page-search .search { max-width: 32rem; }
</style>
<style id="nova-theme">{{NOVA_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="nova-data" type="application/json">{{NOVA_DATA}}</script>
<script id="nova-base-js">
/* Nova dashboard runtime.
   CANONICAL COPY. Every template inlines this file verbatim inside
   <script id="nova-base-js">. Edit here, then run
   `python3 system/tests/dashboards/render.py --sync`.

   Safety: dashboard data comes from emails, documents, and meetings, so it is
   untrusted text. Everything is rendered with textContent / createElement,
   never parsed as HTML markup. No network calls, no connectors. Browser storage is used
   only for UI conveniences (theme, remembered filter) and is optional. */
(function () {
  "use strict";
  var N = (window.Nova = {});
  N.meta = {};

  var LABELS = {
    i_owe: "I owe", waiting_on: "Waiting on",
    open: "Open", done: "Done", dropped: "Dropped", slipped: "Slipped",
    high: "High", medium: "Medium", low: "Low",
    on_track: "On track", at_risk: "At risk", off_track: "Off track", unknown: "Not assessed",
    proposed: "Proposed", active: "Active", paused: "Paused", cancelled: "Cancelled",
    made: "Made", reversed: "Reversed", superseded: "Superseded",
    potential: "Potential", resolved: "Resolved",
    draft: "Draft", achieved: "Achieved", missed: "Missed",
    meeting: "Meeting", one_on_one: "1:1", deadline: "Deadline", milestone: "Milestone", occurrence: "Event",
    ok: "OK", partial: "Partial", failed: "Failed", skipped_away: "Skipped (away)",
    skipped_paused: "Skipped (paused)", early_exit: "Nothing new", never_run: "Not run yet",
    pending: "Pending", approved: "Approved", rejected: "Rejected", executed: "Done", expired: "Expired",
    confirmed: "Confirmed", stated: "You said this", observed: "Observed", researched: "Researched",
    uploaded: "From your documents", inferred: "Inferred",
    ready: "Prep ready", planned: "Prep coming", none: "No prep", not_needed: "No prep needed",
    manager: "Manager", report: "Report", peer: "Peer", stakeholder: "Stakeholder", customer: "Customer",
    vendor: "Vendor", partner: "Partner", external: "External", other: "Other",
    task_group: "Task group", project: "Project", initiative: "Initiative", program: "Program",
    quarter: "Quarter", half: "Half-year", year: "Year", multi_year: "Multi-year"
  };
  N.label = function (v) {
    if (v == null) return "";
    return LABELS[v] || String(v).replace(/_/g, " ").replace(/^./, function (c) { return c.toUpperCase(); });
  };
  N.tones = {
    danger: ["slipped", "off_track", "failed", "high", "active_risk", "error", "missed"],
    warn: ["at_risk", "partial", "medium", "pending", "potential", "proposed", "warn"],
    ok: ["on_track", "ok", "done", "achieved", "made", "resolved", "confirmed", "stated", "ready", "executed"],
    accent: ["early_exit", "open", "active", "planned"]
  };
  N.tone = function (v) {
    for (var t in N.tones) if (N.tones[t].indexOf(v) !== -1) return t;
    return null;
  };

  /* ---- DOM helpers ---- */
  function add(el, c) {
    if (c == null || c === false || c === "") return;
    if (Array.isArray(c)) { for (var i = 0; i < c.length; i++) add(el, c[i]); return; }
    el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      for (var k in props) {
        var v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  N.h = h;
  N.add = add;

  /* ---- Browser storage (optional; never required) ---- */
  N.store = {
    get: function (k) { try { return window.localStorage.getItem("nova:" + k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem("nova:" + k, v); } catch (e) { /* ignore */ } }
  };

  /* ---- Data ---- */
  N.load = function () {
    var node = document.getElementById("nova-data");
    var raw = node ? node.textContent.trim() : "";
    if (!raw || raw.indexOf("{{") === 0) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  };
  N.list = function (v) { return Array.isArray(v) ? v : []; };

  /* ---- Dates. Date-only values are calendar days; datetimes carry an offset. ---- */
  function dateOnly(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function toDate(s) { return dateOnly(s) ? new Date(s + "T12:00:00Z") : new Date(s); }
  function fmt(s, opts) {
    if (!s) return "";
    var d = toDate(s);
    if (isNaN(d.getTime())) return String(s);
    opts.timeZone = dateOnly(s) ? "UTC" : (N.meta.timezone || undefined);
    try { return new Intl.DateTimeFormat(N.meta.locale || undefined, opts).format(d); }
    catch (e) { return String(s); }
  }
  N.date = function (s) { return fmt(s, { month: "short", day: "numeric" }); };
  N.dateY = function (s) { return fmt(s, { year: "numeric", month: "short", day: "numeric" }); };
  N.weekday = function (s) { return fmt(s, { weekday: "short", month: "short", day: "numeric" }); };
  N.dayName = function (s) { return fmt(s, { weekday: "long" }); };
  N.longDate = function (s) { return fmt(s, { weekday: "long", year: "numeric", month: "long", day: "numeric" }); };
  N.time = function (s) { return dateOnly(s) ? "" : fmt(s, { hour: "numeric", minute: "2-digit" }); };
  N.dateTime = function (s) { return dateOnly(s) ? N.date(s) : fmt(s, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
  N.dayKey = function (s) {
    if (!s) return null;
    if (dateOnly(s)) return s;
    var d = new Date(s);
    if (isNaN(d.getTime())) return null;
    try {
      return new Intl.DateTimeFormat("en-CA", { timeZone: N.meta.timezone || undefined, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
    } catch (e) { return s.slice(0, 10); }
  };
  N.daysFromToday = function (s) {
    var k = N.dayKey(s), today = N.meta.as_of;
    if (!k || !today) return null;
    return Math.round((Date.parse(k + "T00:00:00Z") - Date.parse(today + "T00:00:00Z")) / 86400000);
  };
  N.rel = function (s) {
    var n = N.daysFromToday(s);
    if (n == null) return "";
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    return n > 0 ? "in " + n + " days" : -n + " days ago";
  };
  N.due = function (s) {
    if (!s) return "No date";
    var n = N.daysFromToday(s);
    if (n == null) return "Due " + N.date(s);
    if (n < 0) return (n === -1 ? "1 day" : -n + " days") + " overdue";
    if (n === 0) return "Due today";
    if (n === 1) return "Due tomorrow";
    return "Due " + N.date(s);
  };

  /* ---- Record references ---- */
  var ID_RE = /\[\[([a-z]+\/[a-z0-9][a-z0-9-]*)\]\]/g;
  N.rid = function (id) {
    if (!id) return null;
    var text = "[[" + id + "]]";
    var base = N.meta.record_base_url;
    if (base && /^https:\/\//.test(base) && /^[a-z]+\/[a-z0-9][a-z0-9-]*$/.test(id)) {
      return h("a", { class: "rid", href: base + id + ".md", target: "_blank", rel: "noopener noreferrer", title: "Open the record file" }, text);
    }
    return h("code", { class: "rid", title: "Record ID: mention it in chat to ask Nova about it" }, text);
  };
  /* A file path in the user's repository (not a record), e.g. a prep note or profile file. */
  N.path = function (p) { return p ? h("code", { class: "rid", title: "File in your Nova repository" }, p) : null; };
  /* A ref is {id, title}. Renders the title followed by its ID. */
  N.ref = function (r, opts) {
    if (!r) return null;
    if (typeof r === "string") return N.rid(r);
    return h("span", { class: "ref" }, r.title || r.id, r.id && !(opts && opts.noId) ? [" ", N.rid(r.id)] : null);
  };
  N.refs = function (list) {
    list = N.list(list);
    var out = [];
    list.forEach(function (r, i) { if (i) out.push(", "); out.push(N.ref(r)); });
    return out;
  };
  N.name = function (r) { return r ? (typeof r === "string" ? r : r.title || r.id) : ""; };
  /* Plain text with [[type/slug]] mentions styled as IDs. */
  N.rich = function (text) {
    if (text == null) return null;
    text = String(text);
    var out = [], last = 0, m;
    ID_RE.lastIndex = 0;
    while ((m = ID_RE.exec(text))) {
      if (m.index > last) out.push(text.slice(last, m.index));
      out.push(N.rid(m[1]));
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  };

  };
  N.bar = function (fraction, label) {

  };
  applyTheme(N.store.get("theme") || "auto");

  var STAR = "M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5z";
  function star() {

  /* The standard refresh marker: when this page was last refreshed and by what, flagged when older

  N.refreshedText = function () {
    var at = N.meta.generated_at;

    if (by === "chat") who = " in chat";
    else if (by && /^routine:/.test(by)) who = " by the " + by.slice(8).replace(/-/g, " ") + " run";

  N.masthead = function (o) {

      o.subtitle ? h("p", { class: "mast-sub" }, o.subtitle) : null,

      o.stats && o.stats.length ? h("ul", { class: "mast-stats" }, o.stats.map(function (s) {

      nav.length ? h("nav", { class: "mast-nav", "aria-label": "Other Nova pages" }, nav.map(function (n) {

      })) : null);
  };

  N.footer = function () {
    var at = N.meta.generated_at;
    return h("footer", { class: "foot" },
      h("p", null, (at ? "Refreshed " + N.dateY(at) + ", " + N.time(at) : "Not refreshed yet") + " · Ask Nova in chat to change anything"),
      h("p", { class: "chips" }, N.meta.nova_version ? h("span", null, "Nova " + N.meta.nova_version) : null, N.themeButton()));
  };

  /* Render a page. build(data, main) appends sections to main and may return masthead options. */
  N.page = function (defaults, build) {

    N.meta = (data && data.meta) || {};

      h("a", { class: "skip", href: "#main" }, "Skip to content"),
      h("div", { class: "wrap" },
        N.masthead(mastOpts),
        notices.length ? h("ul", { class: "notices", "aria-label": "Notices" }, notices.map(function (n) {
          return h("li", { class: "notice", "data-level": n.level || "warn" }, N.rich(n.text));

  };
})();

<script id="nova-page-js">
(function () {
  var N = window.Nova, h = N.h, L = N.list;
  var LEVEL = { low: 1, medium: 2, high: 3 };

  function meter(label, v, tone) {
    var n = LEVEL[v] || 0;
    var cells = [1, 2, 3].map(function (i) { return h("i", { class: i <= n ? "on" : null }); });
    return h("span", { class: "risk-score", style: tone ? "--tone:var(--" + tone + ")" : null },
      h("span", { class: "sev", "aria-hidden": "true" }, cells), label + " " + (v ? N.label(v).toLowerCase() : "not rated"));
  }
  function filterable(listEl, rows, emptyMsg) {
    var state = { f: null, q: "" };
    return { set: function (k, v) { state[k] = v; var shown = 0;
      rows.forEach(function (r) { var ok = r._match(state.f) && (!state.q || r._text.indexOf(state.q) !== -1); r.hidden = !ok; shown += ok ? 1 : 0; });
      listEl.hidden = !shown; emptyMsg.hidden = !!shown; } };
  }

  N.page({ title: "Decisions and Risks" }, function (d, main) {
    var risks = L(d.risks), decisions = L(d.decisions);
    var controllers = [];
    var search = N.search("Search decisions and risks", function (q) { controllers.forEach(function (c) { c.set("q", q); }); });
    main.appendChild(h("div", { class: "page-search no-print" }, search));

    var rList = h("ul", { class: "items" }), rEmpty = N.empty("No risks match.");
    var rRows = risks.map(function (r) {
      var score = (LEVEL[r.likelihood] || 1) * (LEVEL[r.impact] || 1);
      var tone = r.status === "resolved" ? "ok" : (r.status === "active" || score >= 6 ? "danger" : score >= 3 ? "warn" : "muted");
      var li = N.item({ tone: tone, title: r.title, id: r.id, text: r.summary,
        meta: [r.owner ? "Owner " + N.name(r.owner) : "No owner", L(r.projects).length ? L(r.projects).map(N.name).join(", ") : null, r.updated ? "Updated " + N.date(r.updated) : null],
        insight: r.insight,
        extra: r.mitigation ? h("p", { class: "why" }, h("b", null, "Mitigation: "), N.rich(r.mitigation)) : null,
        aside: [N.chip(r.status === "active" ? "Issue" : N.label(r.status), r.status === "active" ? "danger" : N.tone(r.status)),
          meter("Likelihood", r.likelihood, tone === "ok" ? "ok" : tone), meter("Impact", r.impact, tone === "ok" ? "ok" : tone)] });
      li._text = [r.title, r.summary, r.id, r.mitigation, N.name(r.owner), L(r.projects).map(N.name).join(" ")].join(" ").toLowerCase();
      li._match = function (f) { return f === "all" || (f === "open" && r.status !== "resolved") || (f === "issues" && r.status === "active") || (f === "resolved" && r.status === "resolved"); };
      rList.appendChild(li);
      return li;
    });
    var rc = filterable(rList, rRows, rEmpty); controllers.push(rc);
    main.appendChild(N.section({ id: "risks", title: "Risks and issues", count: N.total("risks", risks.length), key: "risks",
      note: "An issue is a risk that has already happened. Highest exposure first.",
      body: risks.length ? [h("div", { class: "controls" }, N.segmented("Show risks", [{ value: "open", label: "Open" }, { value: "issues", label: "Issues" },
        { value: "resolved", label: "Resolved" }, { value: "all", label: "All" }], "open", function (v) { rc.set("f", v); })), rList, rEmpty]
        : N.empty("No risks recorded.") }));

    var dList = h("ul", { class: "items" }), dEmpty = N.empty("No decisions match.");
    var dRows = decisions.map(function (x) {
      var revisit = x.revisit_on && N.daysFromToday(x.revisit_on) <= 14;
      var li = N.item({ tone: x.status === "made" ? "accent" : (x.status === "proposed" ? "warn" : "muted"), title: x.title, id: x.id, text: x.summary,
        meta: [x.decided_on ? "Decided " + N.dateY(x.decided_on) : "Not decided yet", L(x.deciders).length ? "By " + L(x.deciders).map(N.name).join(", ") : null,
          L(x.projects).length ? L(x.projects).map(N.name).join(", ") : null],
        extra: [h("p", { class: "why" }, h("b", null, "Why: "), x.rationale && x.rationale !== "unknown" ? N.rich(x.rationale) : "Not recorded. Ask Nova to find or capture the reasoning."),
          L(x.alternatives).length ? h("p", { class: "alts" }, "Also considered: " + L(x.alternatives).join("; ")) : null],
        aside: [x.status !== "made" ? N.status(x.status) : null, x.reversible === false ? N.chip("Hard to reverse") : null,
          x.revisit_on ? h("span", null, "Revisit " + N.date(x.revisit_on)) : null, revisit ? N.chip("Revisit soon", "warn") : null] });
      li._text = [x.title, x.summary, x.id, x.rationale, L(x.alternatives).join(" "), L(x.deciders).map(N.name).join(" "), L(x.projects).map(N.name).join(" ")].join(" ").toLowerCase();
      li._match = function (f) { return f === "all" || (f === "made" && x.status === "made") || (f === "proposed" && x.status === "proposed") || (f === "revisit" && revisit); };
      dList.appendChild(li);
      return li;
    });
    var dc = filterable(dList, dRows, dEmpty); controllers.push(dc);
    main.appendChild(N.section({ id: "decisions", title: "Decision log", count: N.total("decisions", decisions.length), key: "decisions",
      note: "What was decided, by whom, and why. Newest first.",
      body: decisions.length ? [h("div", { class: "controls" }, N.segmented("Show decisions", [{ value: "all", label: "All" }, { value: "made", label: "Made" },
        { value: "proposed", label: "Proposed" }, { value: "revisit", label: "Revisit soon" }], "all", function (v) { dc.set("f", v); })), dList, dEmpty]
        : N.empty("No decisions recorded yet.") }));

    var ins = L(d.insights);
    if (ins.length) {
      main.appendChild(N.section({ id: "insights", title: "Worth knowing", body: N.items(ins.map(function (i) {
        return N.item({ tone: "accent", title: i.text, text: i.why, nextStep: i.suggested_action, aside: [h("span", null, i.id)] });
      })) }));
    }
    var s = d.summary || {};
    return { subtitle: "As of " + N.longDate(N.meta.as_of),
      stats: [[s.issues != null ? s.issues : risks.filter(function (r) { return r.status === "active"; }).length, "active issues"],
        [s.open_risks != null ? s.open_risks : risks.filter(function (r) { return r.status === "potential"; }).length, "open risks"],
        [s.decisions_90d != null ? s.decisions_90d : decisions.length, "decisions in 90 days"]] };
  });
})();
</script>
