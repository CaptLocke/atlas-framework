<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Today</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.prio { list-style: none; margin: 0; padding: 0; counter-reset: prio; display: grid; gap: 1.1rem; }
.prio li { counter-increment: prio; display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: .25rem .75rem; }
.prio li::before { content: counter(prio); grid-row: span 3; font-family: var(--font-heading); font-size: 2.1rem; line-height: 1; color: var(--star); font-weight: 600; }
.prio-title { font-weight: 600; font-size: 1.08rem; }
.prio-why { color: var(--ink-2); font-size: .95rem; max-width: var(--measure); }
/* Schedule */
.when { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.when small { display: block; font-weight: 400; color: var(--ink-2); font-size: .8rem; }
.sched .item-main { grid-template-columns: 5.5rem minmax(0, 1fr); column-gap: 1rem; }
.sched .item-main > :not(.when) { grid-column: 2; }
.sched .when { grid-row: span 6; }
@media (max-width: 34rem) {
  .sched .item-main { grid-template-columns: minmax(0, 1fr); }
  .sched .item-main > :not(.when) { grid-column: 1; }
  .sched .when { grid-row: auto; }
  .sched .when small { display: inline; margin-left: .35rem; }
}
/* Due and slipping: I owe, then Waiting on */
.sub { font-family: var(--font-body); font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 .45rem; }
.sub-group + .sub-group { margin-top: 1.25rem; }
.notes { margin: 0; padding-left: 1.1rem; display: grid; gap: .45rem; max-width: var(--measure); }
/* This week: the seven-day strip */
.week-wrap { overflow-x: auto; margin: 0 -2px; padding: 2px 2px .35rem; }
.week { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(5.75rem, 1fr)); gap: .45rem; min-width: 42rem; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .55rem .5rem .6rem; display: grid; gap: .35rem; align-content: start; min-width: 0; }
.day[data-today="1"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day[data-off="1"] { background: transparent; border-style: dashed; color: var(--ink-2); }
.day-name { font-size: .76rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.day[data-today="1"] .day-name { color: var(--accent); }
.day-num { font-family: var(--font-heading); font-size: 1.3rem; font-weight: 600; line-height: 1; color: var(--ink); }
.load { height: 3.2rem; background: var(--surface-2); border-radius: 4px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.load i { display: block; background: var(--accent); }
.day[data-heavy="1"] .load i { background: var(--warn); }
.day-hrs { font-size: .76rem; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.35; }
.day-hrs b { color: var(--ink); font-weight: 600; }
.pins { list-style: none; margin: 0; padding: 0; display: grid; gap: .2rem; }
.pin { font-size: .72rem; line-height: 1.3; padding: .15rem .3rem .15rem .35rem; border-radius: 3px; border-left: 3px solid var(--line); background: var(--surface-2); color: var(--ink); overflow-wrap: break-word; hyphens: auto; }
.pin[data-tone="owe"] { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.pin[data-tone="star"] { border-left-color: var(--star); background: color-mix(in srgb, var(--star) 20%, var(--surface)); }
.pin[data-tone="star"]::before, .legend .lg-star::before { content: "\25C6"; color: var(--star); margin-right: .25rem; }
.pin-more { font-size: .72rem; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin-top: .6rem; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; vertical-align: -.05rem; margin-right: .3rem; }
.legend .lg-meet { background: var(--accent); }
.legend .lg-owe { background: var(--danger); }
.legend .lg-star { width: auto; height: auto; background: none; font-style: normal; margin-right: 0; }
.week-free { margin-top: .5rem; font-size: .9rem; color: var(--ink-2); }
.week-free b { color: var(--ink); }
/* Coming up */
.mstones { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .75rem 1rem; }
.ms { border-left: 3px solid var(--star); padding: .1rem 0 .1rem .75rem; display: grid; gap: .1rem; align-content: start; min-width: 0; }
.ms[data-kind="deadline"] { border-left-color: var(--danger); }
.ms time { font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ms-title { font-weight: 600; overflow-wrap: anywhere; }
.ms-meta { font-size: .85rem; color: var(--ink-2); }
@media print { .week-wrap { overflow: visible; } }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;

  function notes(list) {
    return h("ul", { class: "notes" }, L(list).map(function (n) { return h("li", null, N.rich(n.text)); }));
  }
  function hrs(x) { return (Math.round((x || 0) * 10) / 10) + " h"; }
  function mins(start, end) {
    var a = Date.parse(start), b = Date.parse(end);
    if (isNaN(a) || isNaN(b) || b <= a) return null;
    var m = Math.round((b - a) / 60000);
    return m < 60 ? m + " min" : (m % 60 ? hrs(m / 60) : (m / 60) + " h");
  }
  function overdue(c) { return c.status === "slipped" || (c.due && N.daysFromToday(c.due) < 0); }

  N.page({ title: "Today" }, function (d, main) {
    var b = d.brief || {};
    var catchUp = b.kind === "catch-up";
    var today = L(d.today), due = L(d.due), waiting = L(d.waiting_on);

    /* Order: action needed, (catch-up only: while you were away), top priorities, schedule, due and slipping
       (I owe, then Waiting on), needs you, worth knowing, drafts ready, this week, coming up.
       Section heads carry a description, no count. */
    var acts = L(d.actions);
    if (acts.length) {
      main.appendChild(N.section({ id: "actions", title: "Action needed",
        note: "Only you can do these. They stay here until they're done; tell Atlas in chat when you've done one.",
        body: N.items(acts.map(function (a) {
          return N.item({ tone: "warn", title: a.text, text: a.how || null,
            insight: a.copy_text ? ["The text to copy is on the ", N.pageLink("control-center", "Guide"), " page, or ask Atlas in chat."] : null,
            aside: [null] });
        })) }));
    }

    if (catchUp && L(d.while_away).length) {
      main.appendChild(N.section({ id: "away", title: "While you were away", note: "What happened while you were out, most important first.",
        body: notes(d.while_away), key: "while_away" }));
    }

    main.appendChild(N.section({ id: "priorities", title: "Top priorities", note: "Ranked against your goals, not just due dates.",
      body: L(d.priorities).length ? h("ol", { class: "prio" }, L(d.priorities).map(function (p) {
        return h("li", null, h("p", { class: "prio-title" }, p.text), p.why ? h("p", { class: "prio-why" }, N.rich(p.why)) : null);
      })) : N.empty("No priorities set for today.") }));

    main.appendChild(N.section({ id: "schedule", title: "Schedule", key: "today",
      note: "Today's meetings with whether prep is ready, and what's due today.",
      body: today.length ? h("ul", { class: "items sched" }, today.map(function (e) {
        var prep = e.prep || {}, dated = e.kind === "deadline" || e.kind === "milestone";
        var li = N.item({ tone: e.kind === "deadline" ? "danger" : e.kind === "milestone" ? "accent" : prep.status === "ready" ? "ok" : prep.status === "none" ? "warn" : null,
          title: e.title, id: e.id,
          meta: [e.location, L(e.attendees).length ? "With " + L(e.attendees).map(N.name).join(", ") : null, e.project ? N.name(e.project) : null],
          insight: prep.summary || prep.todo || null,
          aside: [prep.status && !dated ? N.status(prep.status) : null, dated ? N.chip(N.label(e.kind), e.kind === "deadline" ? "danger" : null) : null]
        });
        var len = !e.all_day && e.end ? mins(e.start, e.end) : null;
        var when = h("p", { class: "when" }, e.all_day ? "All day" : N.time(e.start),
          len ? h("small", null, len) : null,
          e.end && !e.all_day ? h("span", { class: "visually-hidden" }, " to " + N.time(e.end)) : null);
        li.firstChild.insertBefore(when, li.firstChild.firstChild);
        return li;
      })) : N.empty("No meetings or deadlines today.") }));

    function owed(c) {
      var n = N.daysFromToday(c.due);
      return N.item({ tone: overdue(c) ? "danger" : (n === 0 ? "warn" : "accent"), title: c.title, id: c.id,
        meta: [c.counterparty ? "For " + N.name(c.counterparty) : null, c.priority ? N.label(c.priority) + " priority" : null],
        nextStep: c.next_step,
        aside: [h("span", null, N.due(c.due)), c.status === "slipped" ? N.status("slipped") : null] });
    }
    function awaited(c) {
      return N.item({ tone: overdue(c) ? "warn" : "muted", title: c.title, id: c.id,
        meta: [c.counterparty ? "From " + N.name(c.counterparty) : null, c.since ? "Asked " + N.date(c.since) : null],
        nextStep: c.next_step, aside: [h("span", null, N.due(c.due)), c.status === "slipped" ? N.status("slipped") : null] });
    }
    function group(label, list, fn, key, emptyText) {
      return h("div", { class: "sub-group" }, h("h3", { class: "sub" }, label),
        N.items(list.map(fn), emptyText), N.more(key));
    }
    main.appendChild(N.section({ id: "due", title: "Due and slipping",
      note: "Due soon or overdue: what you owe first, then what others owe you.",
      body: [group("I owe", due, owed, "due", "Nothing you owe is due in the next few days."),
        group("Waiting on", waiting, awaited, "waiting_on", "You're not waiting on anyone.")] }));

    var asks = L(d.approvals), qs = L(d.questions);
    if (asks.length || qs.length) {
      main.appendChild(N.section({ id: "asks", title: "Needs you", note: "Reply in chat to approve, decline, or answer.",
        body: [N.items(asks.map(function (a) {
            return N.item({ tone: "warn", title: a.action, text: a.why, aside: [N.status("pending")] });
          }).concat(qs.map(function (q) {
            return N.item({ tone: "accent", title: q.text, aside: [N.chip("Question")] });
          }))), N.more("approvals"), N.more("questions")] }));
    }

    if (L(d.insights).length) {
      main.appendChild(N.section({ id: "insights", title: "Worth knowing", note: "Patterns Atlas noticed, with the reasoning.",
        body: N.items(L(d.insights).map(function (i) {
          return N.item({ tone: "accent", title: i.text, text: i.why,
            nextStep: i.suggested_action,
            extra: [i.draft && i.draft.where ? h("p", { class: "item-insight" }, h("b", null, "Draft ready: "),
                (i.draft.to ? "to " + i.draft.to + ", " : "") + "in " + i.draft.where + ". Review and send it yourself, or say \"send it\" in chat.") : null,
              L(i.refs).length ? h("p", { class: "item-meta" }, h("span", null, "Based on ", N.refs(i.refs))) : null],
            aside: [i.draft && i.draft.where ? N.chip("Draft ready", "ok") : null] });
        })) }));
    }

    if (L(d.drafts).length) {
      main.appendChild(N.section({ id: "drafts", title: "Drafts ready", note: "Waiting in your email drafts. Nothing has been sent.", key: "drafts",
        body: N.items(L(d.drafts).map(function (x) {
          return N.item({ title: x.title, meta: [x.to ? "To " + x.to : null, x.where], text: x.why, id: x.ref && x.ref.id });
        })) }));
    }

    /* This week: one tile per day, meeting load against work hours, free hours, what's due (milestones marked). */
    var wk = d.week || {}, days = L(wk.days), cap = wk.work_hours_per_day || 10;
    if (days.length) {
      var strip = h("ul", { class: "week", "aria-label": "The next seven days" }, days.map(function (day) {
        var off = day.work_day === false, mh = day.meeting_hours || 0, n = N.daysFromToday(day.date);
        var items = L(day.due), more = (N.meta.truncated || {})["week." + day.date] || 0;
        var dueWords = items.map(function (x) {
          return (x.kind === "milestone" ? "milestone: " : x.kind === "deadline" ? "deadline: " : x.direction === "waiting_on" ? "from " + N.name(x.counterparty) + ": " : "you owe: ") + x.title;
        });
        var label = (n === 0 ? "Today, " : "") + N.longDate(day.date) + ". " +
          (off ? "Not a work day" : (day.meetings != null ? day.meetings + (day.meetings === 1 ? " meeting, " : " meetings, ") : "") + hrs(mh) + " in meetings, " + hrs(day.free_hours) + " free") +
          (dueWords.length ? ". Due: " + dueWords.join("; ") : "") + (more ? "; and " + more + " more" : "") + ".";
        return h("li", { class: "day", "aria-label": label, "data-today": n === 0 ? "1" : null, "data-off": off ? "1" : null,
            "data-heavy": !off && mh / cap > 0.6 ? "1" : null },
          h("span", { class: "day-name", "aria-hidden": "true" }, n === 0 ? "Today" : N.dayName(day.date).slice(0, 3)),
          h("span", { class: "day-num", "aria-hidden": "true" }, N.date(day.date).replace(/^\D+/, "")),
          off ? h("span", { class: "day-hrs", "aria-hidden": "true" }, "Day off")
            : [h("span", { class: "load", "aria-hidden": "true", title: hrs(mh) + " of meetings" }, h("i", { style: "height:" + Math.min(100, Math.round(mh / cap * 100)) + "%" })),
              h("span", { class: "day-hrs", "aria-hidden": "true" }, h("b", null, hrs(mh)), " meetings", h("br"), h("b", null, hrs(day.free_hours)), " free")],
          items.length || more ? h("ul", { class: "pins", "aria-hidden": "true" }, items.map(function (x) {
              var tone = x.kind === "milestone" ? "star" : (x.kind === "deadline" || x.direction === "i_owe") ? "owe" : null;
              return h("li", { class: "pin", "data-tone": tone }, x.title);
            }), more ? h("li", { class: "pin-more" }, "+" + more + " more") : null) : null);
      }));
      var free = typeof wk.free_hours === "number" ? wk.free_hours
        : days.reduce(function (s, x) { return s + (x.free_hours || 0); }, 0);
      main.appendChild(N.section({ id: "week", title: "This week",
        note: "Meeting load, free time and what's due each day.",
        body: [h("div", { class: "week-wrap" }, strip),
          h("p", { class: "legend", "aria-hidden": "true" },
            h("span", null, h("i", { class: "lg-meet" }), "meetings, against a " + cap + "-hour day"),
            h("span", null, h("i", { class: "lg-owe" }), "due from you"),
            h("span", null, h("i", { class: "lg-star" }), "milestone")),
          h("p", { class: "week-free" }, "About ", h("b", null, hrs(free)), " free for focused work across the week, in gaps of an hour or more.")] }));
    }

    /* Coming up: milestones and deadlines in the next 60 days. */
    var ms = L(d.milestones);
    if (d.week || ms.length) {
      main.appendChild(N.section({ id: "coming", title: "Coming up", key: "milestones",
        note: "Milestones and deadlines in the next two months.",
        body: ms.length ? h("ul", { class: "mstones" }, ms.map(function (m) {
          return h("li", { class: "ms", "data-kind": m.kind || "milestone" },
            h("time", { datetime: m.date }, N.weekday(m.date) + " · " + N.rel(m.date)),
            h("p", { class: "ms-title" }, m.title),
            (m.kind === "deadline" || m.project) ? h("p", { class: "ms-meta" },
              [m.kind === "deadline" ? "Deadline" : null, m.project ? N.name(m.project) : null].filter(Boolean).join(" · ")) : null,
            m.note ? h("p", { class: "ms-meta" }, N.rich(m.note)) : null);
        })) : N.empty("No milestones or deadlines in the next two months.") }));
    }

    var meetings = today.filter(function (e) { return e.kind !== "deadline" && e.kind !== "milestone"; });
    var prepped = meetings.filter(function (e) { return (e.prep || {}).status === "ready"; }).length;
    var dueToday = due.concat(waiting).filter(function (c) { return c.status !== "slipped" && N.daysFromToday(c.due) === 0; }).length;
    var late = due.concat(waiting).filter(overdue).length;
    var stats = [];
    if (acts.length) stats.push([acts.length, ["needs only you", "need only you"]]);
    stats.push([meetings.length, meetings.length === 1 ? "meeting" + (prepped ? ", prepped" : "") : "meetings" + (prepped ? ", " + prepped + " prepped" : "")]);
    stats.push([dueToday, "due today"]);
    stats.push([late, "overdue"]);
    return {
      title: catchUp ? "Catch-up Brief" : "Today",
      subtitle: catchUp && b.away ? "Away " + N.date(b.away.start) + " to " + N.date(b.away.end) : N.longDate(b.date || N.meta.as_of),
      lede: b.headline,
      stats: stats
    };
  });
})();
</script>
</body>
</html>
