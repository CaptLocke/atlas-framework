<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Today</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
/* ---- Your day: a proportional timeline (1.6px a minute), the now line in ember, meeting blocks ---- */
.day-sec { display: flex; flex-direction: column; gap: var(--space-4); }
.allday { display: flex; flex-wrap: wrap; gap: 8px; }
.earlier { display: flex; flex-direction: column; gap: 6px; padding: 14px 18px; border-radius: var(--radius-lg); background: var(--sunken); font-size: 14px; color: var(--ink-2); }
.earlier p { display: flex; align-items: center; gap: 10px; }
.earlier b { color: var(--ink); font-weight: 600; }
.earlier .atl-icon { color: var(--muted); width: 15px; height: 15px; }
.tl { position: relative; --tl-gutter: 88px; }
@media (max-width: 40rem) { .tl { --tl-gutter: 52px; } .tl-strand { left: 34px; width: 16px; } .tl-now { left: 40px; } .tl-block { padding: 0 10px; gap: 8px; } .tl-block > .atl-icon, .tl-tag, .tl-dur { display: none; } }
.tl-tick { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.tl-tick span { flex: 0 0 52px; font-size: 12px; color: var(--muted); transform: translateY(-50%); }
@media (max-width: 40rem) { .tl-tick span { flex-basis: 40px; font-size: 11px; } }
.tl-tick i { flex: 1 1 auto; height: 1px; background: var(--line); }
.tl-strand { position: absolute; left: 50px; top: 0; width: 28px; height: 100%; pointer-events: none; overflow: visible; }
.tl-strand path { fill: none; stroke: var(--strand); vector-effect: non-scaling-stroke; }
.tl-now { position: absolute; left: 56px; right: 0; z-index: 1; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.tl-now i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl-now b { flex: 1 1 auto; height: 1px; background: var(--accent); }
.tl-block { position: absolute; z-index: 2; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font-family: inherit; text-align: left; cursor: pointer; transition: border-color 160ms ease, background 160ms ease; }
.tl-block:hover { border-color: var(--ink); }
.tl-block[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: var(--night-text); }
.tl-block > .atl-icon { width: 15px; height: 15px; }
.tl-block__text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tl-block__title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-block__time { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-block[aria-pressed="true"] .tl-block__time { color: var(--night-muted); }
.tl-block--short .tl-block__time { display: none; }
/* How many commitments a block carries: placed in a focus window, or open with a meeting's people */
.tl-count { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: var(--radius-pill); background: var(--neutral-bg); color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
.tl-count .atl-icon { width: 11px; height: 11px; }
.tl-block[aria-pressed="true"] .tl-count { background: var(--night-raised); color: var(--night-text); }
.tl-tag { flex: none; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted); white-space: nowrap; }
.tl-block[aria-pressed="true"] .tl-tag { color: var(--accent-on-night); }
/* Focus: an open window Atlas placed commitments in, in ember. Free: an open window with nothing placed, neutral. */
.tl-block--win { border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--ink); }
.tl-block--win > .atl-icon { color: var(--accent); }
.tl-block--win .tl-count { background: var(--accent); color: var(--on-accent); }   /* ink or white, whichever reads on this accent (_base.js) */
.tl-block--win[aria-pressed="true"] { background: var(--accent-soft); border-style: solid; color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.tl-block--win[aria-pressed="true"] .tl-block__time { color: var(--muted); }
.tl-block--win[aria-pressed="true"] .tl-count { background: var(--accent); color: var(--on-accent); }
.tl-block--free { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-2); }
.tl-block--free > .atl-icon { color: var(--muted); }
.tl-block--free[aria-pressed="true"] { background: var(--sunken); border-style: solid; border-color: var(--ink); color: var(--ink); }
.tl-block--free[aria-pressed="true"] .tl-block__time { color: var(--muted); }
.brief__group--fit h3 { color: var(--accent-text); }
.brief__group--fit .mini { background: var(--accent-soft); }
.brief__group--fit .mini__when { color: var(--accent-text); }
.brief--focus { border-color: var(--accent); }
.tl-quiet { padding: var(--space-7) var(--space-8); border-radius: var(--radius-card); background: var(--sunken); color: var(--ink-2); }

/* ---- The brief for the chosen block ---- */
.brief { gap: var(--space-4); }
.brief__kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brief__kicker span + span { letter-spacing: 0; font-weight: 500; text-transform: none; font-size: 13px; }
.brief__meta { font-size: 14px; color: var(--muted); }
.brief__facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; margin: 0; font-size: 14px; }
.brief__facts dt { color: var(--muted); }
.brief__facts dd { margin: 0; color: var(--ink); }
.brief__group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.brief__group h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; }
.brief__group--owe h3 { color: var(--warn); }
.brief__group--out h3 { color: var(--bad); }
.mini { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--warn-bg); }
.brief__group--out .mini { background: var(--bad-bg); }
.mini > .atl-icon { margin-top: 2px; color: var(--ink-2); }
.mini__text { flex: 1 1 auto; min-width: 0; }
.mini__title { display: block; font-size: 14px; font-weight: 500; color: var(--ink); }
.mini__sub { display: block; font-size: 12px; color: var(--muted); }
.mini__when { flex: none; font-size: 12px; font-weight: 600; color: var(--warn); }
.brief__group--out .mini__when { color: var(--bad); }

/* ---- Needs you rows ---- */
.need { display: flex; flex-direction: column; gap: 8px; padding: var(--space-5) var(--space-8); border-top: 1px solid var(--line-soft); }
.need:first-child { border-top: 0; }
.need__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.need__title { display: flex; align-items: flex-start; gap: 8px; font-size: 15px; font-weight: 500; }
.need__title .atl-icon { margin-top: 3px; width: 14px; height: 14px; }
.need__meta { font-size: 12px; color: var(--muted); }
.need__note { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.need .atl-actions { margin-top: 4px; }
@media (max-width: 40rem) { .need { padding: var(--space-4) var(--space-6); } }

/* ---- Top priorities: the night card; only #1 takes ember ---- */
.prio-card { padding: var(--space-9) var(--space-8); display: flex; flex-direction: column; gap: var(--space-4); }
.prio-card .kicker-row .meta { color: var(--night-muted); }
.prio { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.prio li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 12px; padding: var(--space-5) var(--space-4); border-top: 1px solid var(--night-line); }
.prio li:first-child { border-top: 0; background: var(--night-raised); border-radius: var(--radius-md); }
.prio-n { grid-row: span 2; font-size: 30px; line-height: 1; font-weight: 200; color: var(--night-muted); }
.prio li:first-child .prio-n { color: var(--accent-on-night); }
.prio-title { display: flex; align-items: flex-start; gap: 8px; font-size: 16px; font-weight: 500; color: var(--night-text); }
.prio-title .atl-icon { margin-top: 3px; width: 14px; height: 14px; color: var(--night-muted); }
.prio-why { font-size: 13px; line-height: 1.45; color: var(--night-muted); }
.prio-title > span:not(.slot) { flex: 1 1 auto; min-width: 0; }
.prio-pick { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.prio-pick:hover .prio-title > span:not(.slot) { text-decoration: underline; text-underline-offset: 0.2em; }
.slot { flex: none; display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--night-raised); color: var(--night-text); font-size: 12px; font-weight: 600; white-space: nowrap; }
.slot .atl-icon { width: 11px; height: 11px; color: var(--night-muted); }
.slot--warn { background: rgba(233, 194, 122, 0.14); color: var(--warn-on-night); }
.slot--warn .atl-icon { color: var(--warn-on-night); }
@media (max-width: 40rem) { .prio-title { flex-wrap: wrap; } .slot { margin-left: 22px; } }

/* ---- Overdue: age bar and people, oldest first ---- */
.od { padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-4); }
.od__bar { display: flex; height: 10px; gap: 3px; border-radius: var(--radius-pill); overflow: hidden; }
.od__bar i { display: block; height: 100%; }
.od__legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink-2); }
.od__legend span { display: inline-flex; align-items: center; gap: 7px; }
.od__legend i { width: 9px; height: 9px; border-radius: 3px; }
.age0 { background: var(--warn-mark); } .age1 { background: #e9a9b4; } .age2 { background: #c2566a; } .age3 { background: var(--bad); }
:root[data-theme="dark"] .age3 { background: #a83a4c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .age3 { background: #a83a4c; } }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.person { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 4px 14px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
.person:first-child { border-top: 0; }
.person .atl-avatar { grid-row: span 3; }
.person__name { font-size: 15px; font-weight: 600; }
.person__name span { font-weight: 400; color: var(--muted); font-size: 13px; }
.person__items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.person__items li { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--ink-2); }
.person__items li > .atl-icon { flex: none; width: 11px; height: 11px; margin-top: 4px; }
.person__item { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }   /* title, lateness and button wrap here, beside the icon */
.late { font-weight: 600; color: var(--bad); }
.late--soft { color: #a5384b; }
:root[data-theme="dark"] .late--soft { color: var(--bad); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .late--soft { color: var(--bad); } }
.soon { font-weight: 600; color: var(--warn); }
.person .atl-actions { margin-top: 4px; }
.person .atl-btn { min-height: 36px; padding: 0 14px; font-size: 13px; }

/* ---- Below the columns: while away, this week, coming up ---- */
.notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: var(--measure); }
.week-wrap { overflow-x: auto; padding: 2px; }
.week { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }   /* columns set by the script: work days share the width */
.wday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card-sm); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.wday[data-today="1"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.wday-off { border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); min-height: 100%; display: flex; justify-content: center; padding-top: 14px; }   /* days off, folded into one thin tile */
.wday-off__n { width: 16px; height: 16px; border-radius: 50%; background: var(--bad-bg); color: var(--bad); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }   /* something falls due on those days */
.wday-name { font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
.wday-num { font-size: 32px; line-height: 1; font-weight: 200; letter-spacing: -0.03em; color: var(--ink); }
.load { height: 6px; background: var(--sunken); border-radius: var(--radius-pill); overflow: hidden; }
.load i { display: block; height: 100%; background: var(--ink); border-radius: var(--radius-pill); }
.wday[data-heavy="1"] .load i { background: var(--warn-mark); }
.wday-hrs { font-size: 12px; line-height: 1.5; color: var(--muted); }
.wday-hrs b { color: var(--ink); font-weight: 600; }
.pins { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pin { font-size: 12px; line-height: 1.35; padding: 4px 9px; border-radius: 10px; background: var(--neutral-bg); color: var(--ink-2); overflow-wrap: break-word; hyphens: auto; }
.pin[data-tone="owe"] { background: var(--bad-bg); color: var(--bad); }
.pin[data-tone="star"] { background: var(--info-bg); color: var(--info); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.legend .lg-meet { background: var(--ink); }
.legend .lg-owe { background: var(--bad-bg); border: 1px solid var(--bad); }
.legend .lg-ms .atl-icon { width: 11px; height: 11px; color: var(--info); }
.pin[data-tone="star"] .atl-icon { width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
.wday-none { margin-top: 4px; font-size: 13px; color: var(--muted); }
.week-free { font-size: 14px; color: var(--ink-2); }
.week-free b { color: var(--ink); font-weight: 600; }
.guide-link { display: flex; align-items: center; gap: 12px; padding: var(--space-5) var(--space-7); border: 1px solid var(--line); border-radius: var(--radius-card-sm); background: var(--surface); font-size: 14px; color: var(--ink-2); }
.guide-link .atl-icon { color: var(--ink); }
.guide-link a { margin-left: auto; font-weight: 600; color: var(--ink); }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>

<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var S = 1.6;                 /* the timeline's scale: 1.6px a minute */
  var picked = null;           /* the block whose brief is open; kept across live repaints */

  function hrs(x) { return (Math.round((x || 0) * 10) / 10) + " h"; }
  var mins = N.mins, hm = N.hm, clock = N.clock, span = N.clockRange;
  function tick(m) { var hh = Math.floor(m / 60) % 24; return (hh % 12 || 12) + (hh < 12 ? " AM" : " PM"); }   /* the timeline's hour marks */
  function overdue(c) { return c.status === "slipped" || (!!c.due && N.daysFromToday(c.due) < 0); }
  function late(c) { var n = c.due ? -N.daysFromToday(c.due) : 0; return n > 0 ? n : 1; }
  function lateText(n) { return n === 1 ? "1 day late" : n + " days late"; }
  function first(r) { return String(N.name(r) || "").split(" ")[0]; }
  function idOf(r) { return r && (typeof r === "string" ? r : r.id); }

  N.page({ title: "Today" }, function (d, main) {
    var b = d.brief || {};
    var catchUp = b.kind === "catch-up";
    var day = b.date || N.meta.as_of;
    var today = L(d.today), due = L(d.due), waiting = L(d.waiting_on);
    var acts = L(d.actions), asks = L(d.approvals), qs = L(d.questions), drafts = L(d.drafts);
    var T = N.meta.truncated || {};

    /* The now line follows the viewer's clock, and only on the brief's own day. */
    var nowMin = N.dayKey(new Date().toISOString()) === day ? mins(new Date()) : null;

    if (catchUp && L(d.while_away).length) {
      main.appendChild(N.section({ id: "away", title: "While you were away", note: "What happened while you were out, most important first.",
        body: h("ul", { class: "notes" }, L(d.while_away).map(function (n) { return h("li", null, N.rich(n.text)); })), key: "while_away" }));
    }

    var left = h("div", { class: "atl-col" }), right = h("div", { class: "atl-col" });
    main.appendChild(h("div", { class: "atl-cols" }, left, right));

    /* ================= Your day ================= */
    var meetings = [], allDay = [];
    today.forEach(function (e) {
      var s = mins(e.start), en = e.end ? mins(e.end) : null;
      if (e.all_day || s == null || en == null || en <= s) allDay.push(e);
      else meetings.push({ e: e, s: s, en: en });
    });
    meetings.sort(function (a, b) { return a.s - b.s; });
    var earlier = nowMin == null ? [] : meetings.filter(function (m) { return m.en <= nowMin; });
    var ahead = meetings.filter(function (m) { return earlier.indexOf(m) === -1; });
    var next = ahead.filter(function (m) { return nowMin == null || m.s >= nowMin; })[0] || null;
    var current = nowMin == null ? null : ahead.filter(function (m) { return m.s <= nowMin && m.en > nowMin; })[0] || null;

    /* Who each meeting is with, to pull in what's owed either way. */
    function people(e) { var ids = {}; L(e.attendees).forEach(function (a) { var k = idOf(a); if (k) ids[k] = 1; }); return ids; }
    function owedFor(e) {
      var ids = people(e);
      return { owe: due.filter(function (c) { return ids[idOf(c.counterparty)]; }), out: waiting.filter(function (c) { return ids[idOf(c.counterparty)]; }) };
    }

    /* Open windows (atlas-brief §E): gaps between meetings, with what Atlas placed there */
    var dd = d.day && d.day.work_day !== false ? d.day : null;
    var wins = dd ? L(dd.windows).map(function (w) { return { win: true, id: "win:" + w.start, s: hm(w.start), en: hm(w.end), w: w }; })
      .filter(function (x) { return x.s != null && x.en != null && (nowMin == null || x.en > nowMin); }) : [];
    var winOf = {};
    wins.forEach(function (x) { L(x.w.items).forEach(function (it) { winOf[it.id] = x.id; }); });

    var briefHolder = h("div");
    function prepText(p) {
      p = p || {};
      var s = p.status ? N.label(p.status) : null;
      return [s, p.summary || p.todo].filter(Boolean).join(" · ");
    }
    function mini(c, owe) {
      var n = c.due ? N.daysFromToday(c.due) : null;
      var when = overdue(c) ? lateText(late(c)) : c.due ? N.due(c.due) : null;
      return h("div", { class: "mini" }, N.icon("commitment"),
        h("span", { class: "mini__text" }, h("span", { class: "mini__title" }, c.title),
          h("span", { class: "mini__sub" }, [owe ? "For " + N.name(c.counterparty) : N.name(c.counterparty), c.priority ? N.label(c.priority) : null].filter(Boolean).join(" · "))),
        when ? h("span", { class: "mini__when" }, n === 0 && !overdue(c) ? "Due today" : when) : null);
    }
    function countPill(n, why) {
      return h("span", { class: "tl-count", "aria-hidden": "true", title: n + (n === 1 ? " commitment " : " commitments ") + why }, N.icon("commitment"), String(n));
    }
    function sizeText(it) { return it.sized === false ? "size unknown" : it.minutes >= 60 ? hrs(it.minutes / 60) : it.minutes + " min"; }
    function paintWindow(x) {
      var w = x.w, its = L(w.items), used = its.reduce(function (n, it) { return n + (it.minutes || 0); }, 0);
      var word = its.length ? "Focus" : "Free";
      briefHolder.appendChild(h("section", { class: "atl-card brief" + (its.length ? " brief--focus" : ""), id: "brief", "aria-live": "polite", "aria-label": word + " time at " + clock(x.s) },
        h("p", { class: "brief__kicker" }, h("span", null, word + " time · " + (x.en - x.s) + " min"), h("span", null, span(x.s, x.en))),
        h("h2", { class: "atl-card__title" }, word),
        its.length ? h("div", { class: "brief__group brief__group--fit" }, h("h3", null, "Fits here · about " + used + " min"),
          its.map(function (it) {
            return h("div", { class: "mini" }, N.icon("commitment"), h("span", { class: "mini__text" }, h("span", { class: "mini__title" }, it.title),
              h("span", { class: "mini__sub" }, it.rank ? "#" + it.rank + " priority" : "Due today")), h("span", { class: "mini__when" }, (it.at ? clock(hm(it.at)) + " · " : "") + sizeText(it)));
          })) : h("p", { class: "brief__meta" }, "Nothing placed here: time for whatever comes up."),
        w.left ? h("dl", { class: "brief__facts" }, h("dt", null, "Left over"), h("dd", null, w.left + " min")) : null,
        its.length ? h("div", { class: "atl-actions" }, N.prompt("Help me get " + its[0].title + " done in the " + clock(x.s) + " focus time")) : null));
    }
    function paintBrief() {
      briefHolder.textContent = "";
      var x = wins.filter(function (y) { return y.id === picked; })[0];
