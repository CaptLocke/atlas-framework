<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Daily Brief</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.prio { list-style: none; margin: 0; padding: 0; counter-reset: prio; display: grid; gap: 1.1rem; }
.prio li { counter-increment: prio; display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: .25rem .75rem; }
.prio li::before { content: counter(prio); grid-row: span 3; font-family: var(--font-heading); font-size: 2.1rem; line-height: 1; color: var(--star); font-weight: 600; }
.prio-title { font-weight: 600; font-size: 1.08rem; }
.prio-why { color: var(--ink-2); font-size: .95rem; max-width: var(--measure); }
.sched .item { padding-left: 1rem; }
.when { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); min-width: 5.5rem; }
.sched .item-main { grid-template-columns: 5.5rem minmax(0, 1fr); column-gap: 1rem; }
.sched .item-main > :not(.when) { grid-column: 2; }
.sched .when { grid-row: span 6; }
@media (max-width: 34rem) {
  .sched .item-main { grid-template-columns: minmax(0, 1fr); }
  .sched .item-main > :not(.when) { grid-column: 1; }
  .sched .when { grid-row: auto; }
}
.notes { margin: 0; padding-left: 1.1rem; display: grid; gap: .45rem; max-width: var(--measure); }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;

  function notes(list) {
    return h("ul", { class: "notes" }, L(list).map(function (n) { return h("li", null, N.rich(n.text)); }));
  }

  N.page({ title: "Daily Brief" }, function (d, main) {
    var b = d.brief || {};
    var catchUp = b.kind === "catch-up";
    var today = L(d.today), due = L(d.due), waiting = L(d.waiting_on);

    /* Order: action needed, (catch-up only: while you were away), top priorities, today, due and slipping,
       waiting on others, needs you, worth knowing, drafts ready. Section heads carry a description, no count. */
    var acts = L(d.actions);
    if (acts.length) {
      main.appendChild(N.section({ id: "actions", title: "Action needed",
        note: "Only you can do these. They stay here until they're done; tell Atlas in chat when you've done one.",
        body: N.items(acts.map(function (a) {
          return N.item({ tone: "warn", title: a.text, text: a.how || null,
            insight: a.copy_text ? ["The text to copy is on the ", N.pageLink("control-center", "Control Center"), ", or ask Atlas in chat."] : null,
            aside: [null] });
        })) }));
    }

    if (catchUp && L(d.while_away).length) {
      main.appendChild(N.section({ id: "away", title: "While you were away", note: "What happened while you were out, most important first.",
        body: notes(d.while_away), key: "while_away" }));
    }

    main.appendChild(N.section({ id: "priorities", title: "Top priorities", note: "Ranked against your goals, not just due dates.",
      body: L(d.priorities).length ? h("ol", { class: "prio" }, L(d.priorities).map(function (p) {
        return h("li", null, h("p", { class: "prio-title" }, p.text), p.why ? h("p", { class: "prio-why" }, N.rich(p.why)) : null);
      })) : N.empty("No priorities set for today.") }));

    main.appendChild(N.section({ id: "today", title: "Today", key: "today",
      note: "Your meetings and deadlines, with whether prep is ready.",
      body: today.length ? h("ul", { class: "items sched" }, today.map(function (e) {
        var prep = e.prep || {};
        var li = N.item({ tone: prep.status === "ready" ? "ok" : (e.kind === "deadline" ? "danger" : null), title: e.title, id: e.id,
          meta: [e.location, L(e.attendees).length ? "With " + L(e.attendees).map(N.name).join(", ") : null],
          insight: prep.summary || null,
          aside: [prep.status ? N.status(prep.status) : null, e.kind && e.kind !== "meeting" ? N.label(e.kind) : null]
        });
        var when = h("p", { class: "when" }, e.all_day ? "All day" : N.time(e.start), e.end && !e.all_day ? h("span", { class: "visually-hidden" }, " to " + N.time(e.end)) : null);
        li.firstChild.insertBefore(when, li.firstChild.firstChild);
        return li;
      })) : N.empty("No meetings or deadlines today.") }));

    main.appendChild(N.section({ id: "due", title: "Due and slipping", key: "due",
      note: "What you owe that is due soon or overdue.",
      body: N.items(due.map(function (c) {
        var late = c.status === "slipped" || (N.daysFromToday(c.due) || 0) < 0;
        return N.item({ tone: late ? "danger" : (N.daysFromToday(c.due) === 0 ? "warn" : "accent"), title: c.title, id: c.id,
          meta: [c.counterparty ? "For " + N.name(c.counterparty) : null, c.priority ? N.label(c.priority) + " priority" : null],
          nextStep: c.next_step,
          aside: [h("span", null, N.due(c.due)), c.status === "slipped" ? N.status("slipped") : null] });
      }), "Nothing due in the next few days.") }));

    main.appendChild(N.section({ id: "waiting", title: "Waiting on others", key: "waiting_on",
      note: "What other people owe you, and when it's due.",
      body: N.items(waiting.map(function (c) {
        var late = c.status === "slipped" || (c.due && N.daysFromToday(c.due) < 0);
        return N.item({ tone: late ? "warn" : "muted", title: c.title, id: c.id,
          meta: [c.counterparty ? "From " + N.name(c.counterparty) : null, c.since ? "Asked " + N.date(c.since) : null],
          nextStep: c.next_step, aside: [h("span", null, N.due(c.due))] });
      }), "You're not waiting on anyone.") }));

    var asks = L(d.approvals), qs = L(d.questions);
    if (asks.length || qs.length) {
      main.appendChild(N.section({ id: "asks", title: "Needs you", note: "Reply in chat to approve, decline, or answer.",
        body: [N.items(asks.map(function (a) {
            return N.item({ tone: "warn", title: a.action, text: a.why, aside: [N.status("pending")] });
          }).concat(qs.map(function (q) {
            return N.item({ tone: "accent", title: q.text, aside: [N.chip("Question")] });
          }))), N.more("approvals"), N.more("questions")] }));
    }

    if (L(d.insights).length) {
      main.appendChild(N.section({ id: "insights", title: "Worth knowing", note: "Patterns Atlas noticed, with the reasoning.",
        body: N.items(L(d.insights).map(function (i) {
          return N.item({ tone: "accent", title: i.text, text: i.why,
            nextStep: i.suggested_action,
            extra: [i.draft && i.draft.where ? h("p", { class: "item-insight" }, h("b", null, "Draft ready: "),
                (i.draft.to ? "to " + i.draft.to + ", " : "") + "in " + i.draft.where + ". Review and send it yourself, or say \"send it\" in chat.") : null,
              L(i.refs).length ? h("p", { class: "item-meta" }, h("span", null, "Based on ", N.refs(i.refs))) : null],
            aside: [i.draft && i.draft.where ? N.chip("Draft ready", "ok") : null] });
        })) }));
    }

    if (L(d.drafts).length) {
      main.appendChild(N.section({ id: "drafts", title: "Drafts ready", note: "Waiting in your email drafts. Nothing has been sent.", key: "drafts",
        body: N.items(L(d.drafts).map(function (x) {
          return N.item({ title: x.title, meta: [x.to ? "To " + x.to : null, x.where], text: x.why, id: x.ref && x.ref.id });
        })) }));
    }

    var meetings = today.filter(function (e) { return e.kind !== "deadline"; }).length;
    return {
      title: catchUp ? "Catch-up Brief" : "Daily Brief",
      subtitle: catchUp && b.away ? "Away " + N.date(b.away.start) + " to " + N.date(b.away.end) : N.longDate(b.date || N.meta.as_of),
      lede: b.headline,
      stats: [[meetings, meetings === 1 ? "meeting" : "meetings"], [N.total("due", due.length), "due or slipping"], [N.total("waiting_on", waiting.length), "waiting on others"]]
    };
  });
})();
</script>
</body>
</html>
