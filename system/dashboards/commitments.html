<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Work</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
/* Tabs, the page-wide filter and find, sticky under the header */
.toolbar { display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-2); }
.toolbar-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }
.toolbar .atl-tabs { flex: 1 1 100%; }
.panel { display: flex; flex-direction: column; gap: var(--space-6); }
/* I owe beside Waiting on */
.cols { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); align-items: start; }
.col { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.col-note { font-size: 14px; color: var(--muted); }
/* Goals */
.rank { font-family: var(--font-display); font-size: 40px; line-height: 40px; font-weight: 500; color: var(--accent); }
.goal-top { display: flex; gap: var(--space-4); align-items: flex-start; }
.goal-top .atl-card__title { flex: 1; }
.measure { display: flex; flex-direction: column; gap: 6px; }
.measure p { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 14px; color: var(--muted); }
.measure b { color: var(--ink); font-weight: 600; }
.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
.ev li { display: flex; gap: 8px; align-items: baseline; }
.ev .atl-badge { flex: none; }
.proj-counts { font-size: 14px; color: var(--muted); }
.proj-counts b { color: var(--bad); font-weight: 600; }
.others { color: var(--muted); font-size: 14px; }
.owes { display: grid; gap: var(--space-3) var(--space-6); grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); }
.owes .late { color: var(--bad); font-weight: 500; }
.nomatch { color: var(--muted); }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var HEALTH_TONE = { off_track: "bad", at_risk: "warn", on_track: "good" };
  var LEVEL = { low: 1, medium: 2, high: 3 };
  var PRIORITY = { high: 0, medium: 1, low: 2 };
  var REL = ["manager", "report", "board", "customer", "stakeholder", "prospect", "partner", "peer", "vendor", "external", "other"];

  /* ---- What "needs attention" means, per kind (system/dashboards/commitments.contract.md §Needs attention) ---- */
  function overdue(c) { return c.status === "slipped" || (!!c.due && N.daysFromToday(c.due) < 0); }
  function cAtt(c) { return overdue(c) || (!!c.due && N.daysFromToday(c.due) <= 1); }
  function pAtt(p) { return p.status === "active" && (p.health === "off_track" || p.health === "at_risk"); }
  function gAtt(g) { return g.assessment === "at_risk" || g.assessment === "off_track"; }
  function exposure(r) { return (LEVEL[r.likelihood] || 1) * (LEVEL[r.impact] || 1); }
  function rAtt(r) { return r.status === "active" || exposure(r) >= 6; }
  function revisitSoon(x) { return !!x.revisit_on && N.daysFromToday(x.revisit_on) <= 14; }
  function dAtt(x) { return x.status === "proposed" || revisitSoon(x); }

  function cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function idOf(r) { return r && (typeof r === "string" ? r : r.id); }
  function title(x) { return String(x.title || ""); }
  function first(r) { return String(N.name(r) || "").split(" ")[0]; }
  function byDue(a, b) { var da = a.due || "", db = b.due || ""; return da === db ? 0 : !da ? 1 : !db ? -1 : cmp(da, db); }

  N.page({ title: "Work" }, function (d, main) {
    var me = N.meta.user_display_name;
    function who(r) { return r && me && N.name(r) === me ? "You" : N.name(r); }
    var state = { tab: "commitments", filter: "all", tile: null, q: "" };
    var items = [];   /* every row or card: { el, tab, att, kind, dir, late, list } */
    function track(el, o) { o.el = el; items.push(o); return el; }

    /* ================= Commitments ================= */
    var cs = L(d.commitments).slice().sort(function (a, b) {
      var oa = overdue(a) ? 0 : 1, ob = overdue(b) ? 0 : 1;
      if (oa !== ob) return oa - ob;
      var pa = a.priority in PRIORITY ? PRIORITY[a.priority] : 3, pb = b.priority in PRIORITY ? PRIORITY[b.priority] : 3;
      return pa - pb || byDue(a, b) || cmp(title(a), title(b));
    });
    function dueBadge(c) {
      if (c.status === "slipped" && !(c.due && N.daysFromToday(c.due) < 0)) return N.badge("Slipped", "bad");
      if (overdue(c)) return N.badge(N.due(c.due), "bad");
      if (c.due && N.daysFromToday(c.due) <= 1) return N.badge(N.due(c.due), "warn");
      return N.badge(c.due ? N.weekday(c.due) : "No date");
    }
    function cRow(c) {
      var owe = c.direction === "i_owe", late = overdue(c);
      var other = owe ? c.counterparty : c.owner;
      var action = owe ? N.request("Mark done", N.withId("Mark " + N.quote(c.title) + " as done", c.id), "secondary", true,
          { kind: "mark_done", target: c.id, quoted: c.title })
        : N.request("Nudge " + first(other), N.withId("Draft a follow-up to " + N.quote(N.name(other)) + " about " + N.quote(c.title), c.id), "secondary", false,
          { kind: "nudge", target: c.id, quoted: c.title });
      var row = N.row({
        title: c.title, tone: late ? "bad" : cAtt(c) ? "warn" : null,
        meta: [owe ? (other ? "For " + who(other) : null) : (other ? "From " + who(other) : null), N.name(c.project) || null],
        badge: dueBadge(c), action: action,
        search: [c.insight, c.next_step, N.name(other), N.name(c.project)].join(" "),
        detail: function () {
          return N.detail({
            blocks: [c.insight ? { heading: "What Atlas noticed", nodes: N.para(c.insight) } : null,
              c.next_step ? { heading: "Next step", nodes: N.para(c.next_step) } : null],
            facts: N.mergeDetails([[owe ? "For" : "From", who(other)], ["Due", c.due ? N.dateY(c.due) + " (" + N.due(c.due).toLowerCase() + ")" : "No date"],
              ["Priority", c.priority ? N.label(c.priority) : null], ["Project", N.name(c.project)], ["Status", c.status ? N.label(c.status) : null]], c.details),
            body: c.body, body_truncated: c.body_truncated, links: c.links, dates: N.datesLine(c.created, c.updated),
            actions: [owe ? N.request("Move the date", N.withId("Change the due date for " + N.quote(c.title), c.id), "secondary", false,
                { kind: "move_date", target: c.id, quoted: c.title, due: c.due })
                : N.request("Mark received", N.withId(N.quote(c.title) + " has arrived. Mark it done", c.id), "secondary", true,
                  { kind: "mark_received", target: c.id, quoted: c.title }),
              N.request("Ask Atlas", N.withId("Show me " + N.quote(c.title), c.id), "ghost")]
          });
        }
      });
      return track(row, { tab: "commitments", att: cAtt(c), kind: "commitment", dir: c.direction, late: late, prio: c.priority });
    }
    /* Grouped: overdue first, then by priority; dates ascending inside each group. */
    var GROUPS = [["late", "Overdue"], ["high", "High priority"], ["medium", "Medium priority"], ["low", "Low priority"], ["none", "No priority set"]];
    function groupOf(c) { return overdue(c) ? "late" : c.priority in PRIORITY ? c.priority : "none"; }
    function commitList(list) {
      var heads = [], kids = [];
      GROUPS.forEach(function (g) {
        var inG = list.filter(function (c) { return groupOf(c) === g[0]; });
        if (!inG.length) return;
        var head = N.group(g[1]);
        var rows = inG.map(cRow);
        heads.push({ el: head, rows: rows });
        kids.push(head); kids = kids.concat(rows);
      });
      var box = N.listBox(kids, "");
      return { box: box, heads: heads };
    }
    var oweList = cs.filter(function (c) { return c.direction === "i_owe"; });
    var waitList = cs.filter(function (c) { return c.direction === "waiting_on"; });
    var oweL = commitList(oweList), waitL = commitList(waitList);
    var oweCount = h("span", { class: "count" }, ""), waitCount = h("span", { class: "count" }, "");
    var oweNone = N.empty("You don't owe anyone anything right now."), waitNone = N.empty("You're not waiting on anyone.");
    var commitPanel = h("div", { class: "panel" },
      h("div", { class: "cols" },
        h("div", { class: "col" }, h("h3", { class: "sub" }, "I owe", oweCount), oweList.length ? oweL.box : null, oweNone, N.more("i_owe")),
        h("div", { class: "col" }, h("h3", { class: "sub" }, "Waiting on", waitCount), waitList.length ? waitL.box : null, waitNone, N.more("waiting_on"))));

    /* ================= Projects ================= */
    var HEALTH_ORDER = { off_track: 0, at_risk: 1, unknown: 2, on_track: 3 };
    var LATER_ORDER = { proposed: 4, paused: 5 };
    function pRank(p) {
      if (p.status === "active") return p.health in HEALTH_ORDER ? HEALTH_ORDER[p.health] : 2;
      return p.status in LATER_ORDER ? LATER_ORDER[p.status] : 6;
    }
    var ps = L(d.projects).slice().sort(function (a, b) {
      var r = pRank(a) - pRank(b);
      if (r) return r;
      if (a.target !== b.target) { if (!a.target) return 1; if (!b.target) return -1; return cmp(a.target, b.target); }
      return cmp(title(a), title(b));
    });
    var projCards = ps.map(function (p) {
      var url = p.page_url && /^https:\/\//.test(p.page_url) ? p.page_url : null;
      var pcs = cs.filter(function (c) { return idOf(c.project) === p.id; });
      var lateN = pcs.filter(overdue).length;
      var eyebrow = p.status === "active" ? N.badge(N.label(p.health || "unknown"), HEALTH_TONE[p.health] || "neutral") : N.badge(N.label(p.status));
      var card = N.card({
        eyebrow: eyebrow,
        title: url ? h("a", { class: "atl-card__link", href: url, target: "_blank", rel: "noopener noreferrer" }, p.title) : p.title,
        detail: [p.owner ? "Owner " + who(p.owner) : null, p.target ? "Target " + N.date(p.target) : null, p.goal ? "Serves " + N.name(p.goal) : null].filter(Boolean).join(" · "),
        body: [p.insight ? h("p", null, N.rich(p.insight)) : null,
          p.next_step ? h("p", null, h("b", null, "Next step: "), N.rich(p.next_step)) : null,
          pcs.length ? h("p", { class: "proj-counts" }, pcs.length + (pcs.length === 1 ? " open commitment" : " open commitments"),
            lateN ? [", ", h("b", null, lateN + " overdue")] : null) : null],
        actions: [url ? h("a", { class: "atl-btn atl-btn--secondary", href: url, target: "_blank", rel: "noopener noreferrer" }, "Open project page")
          : N.request("Ask Atlas", N.withId("Show me the project " + N.quote(p.title), p.id), "secondary")]
      });
      return track(card, { tab: "projects", att: pAtt(p), kind: "project" });
    });
    var projAtt = ps.filter(pAtt).length;
    var projPanel = h("div", { class: "panel" }, ps.length ? h("div", { class: "atl-grid" }, projCards) : N.empty("No active projects."), N.more("projects"));

    /* ================= Goals ================= */
    var GSTATUS = { active: 0, draft: 1 };
    var GASSESS = { off_track: 0, at_risk: 1, on_track: 3 };
    var goals = L(d.goals).slice().sort(function (a, b) {
      var sa = a.status in GSTATUS ? GSTATUS[a.status] : 2, sb = b.status in GSTATUS ? GSTATUS[b.status] : 2;
      if (sa !== sb) return sa - sb;
      var ra = typeof a.rank === "number" ? a.rank : Infinity, rb = typeof b.rank === "number" ? b.rank : Infinity;
      if (ra !== rb) return ra < rb ? -1 : 1;
      var aa = a.assessment in GASSESS ? GASSESS[a.assessment] : 2, ab = b.assessment in GASSESS ? GASSESS[b.assessment] : 2;
      return aa - ab || cmp(title(a), title(b));
    });
    var goalCards = goals.map(function (g) {
      var ev = L(g.evidence);
      var behind = ps.filter(function (p) { return idOf(p.goal) === g.id; });
      var tone = HEALTH_TONE[g.assessment] || null;
      var badge = g.assessment ? N.badge(N.label(g.assessment), tone) : g.status === "active" ? N.badge("Not assessed") : N.badge(N.label(g.status));
      var ranked = g.status === "active" && typeof g.rank === "number";
      var card = N.card({
        eyebrow: badge,
        title: h("span", { class: "goal-top" }, ranked ? h("span", { class: "rank", "aria-label": "Rank " + g.rank }, String(g.rank)) : null, h("span", null, g.title)),
        detail: [g.period, g.owner ? "Owner " + who(g.owner) : null].filter(Boolean).join(" · "),
        body: [g.metric ? h("div", { class: "measure" },
            h("p", null, h("span", null, g.metric), h("span", null, h("b", null, g.current || "No reading yet"), g.target ? " of " + g.target : "", g.current_as_of ? " · as of " + N.date(g.current_as_of) : "")),
            N.bar(g.progress, g.progress != null ? Math.round(g.progress * 100) + "% of target" : null, tone)) : null,
          g.insight ? h("p", null, N.rich(g.insight)) : null,
          ev.length ? h("ul", { class: "ev", "aria-label": "Evidence" }, ev.map(function (e) {
            var dir = e.direction === "for" || e.direction === "against" ? e.direction : "neutral";
            return h("li", null, N.badge(dir === "for" ? "For" : dir === "against" ? "Against" : "Note", dir === "for" ? "good" : dir === "against" ? "bad" : "neutral"), h("span", null, N.rich(e.text)));
          })) : null,
          behind.length ? h("p", { class: "proj-counts" }, "Projects: " + behind.map(function (p) { return p.title; }).join(", ")) : null],
        actions: [N.request("Ask Atlas", N.withId("How is the goal " + N.quote(g.title) + " going?", g.id), "secondary")]
      });
      return track(card, { tab: "goals", att: gAtt(g), kind: "goal" });
    });
    var period = d.period && d.period.label ? d.period.label + ", by your rank." : "By your rank.";
    var goalPanel = h("div", { class: "panel" }, h("p", { class: "col-note" }, period),
      goals.length ? h("div", { class: "atl-grid" }, goalCards) : N.empty("No active goals. Tell Atlas your goals in chat to add them."), N.more("goals"));

    /* ================= Decisions & risks ================= */
    var allRisks = L(d.risks);
    var decisions = L(d.decisions).slice().sort(function (a, b) {
      var pa = a.status === "proposed" ? 0 : 1, pb = b.status === "proposed" ? 0 : 1;
      if (pa !== pb) return pa - pb;
      return cmp(b.decided_on || "", a.decided_on || "") || cmp(title(a), title(b));
    });
    var risks = allRisks.slice().sort(function (a, b) {
      var ia = a.status === "active" ? 0 : 1, ib = b.status === "active" ? 0 : 1;
      return ia - ib || exposure(b) - exposure(a) || cmp(b.updated || "", a.updated || "") || cmp(title(a), title(b));
    });
    var dRows = decisions.map(function (x) {
      var soon = revisitSoon(x), proposed = x.status === "proposed";
      var why = x.rationale && x.rationale !== "unknown" ? x.rationale : null;
      var row = N.row({
        title: x.title, tone: proposed ? "warn" : null,
        meta: [x.decided_on ? "Decided " + N.date(x.decided_on) : "Not decided yet", L(x.deciders).length ? "By " + L(x.deciders).map(N.name).join(", ") : null],
        badge: proposed ? N.badge("Proposed", "warn") : soon ? N.badge("Revisit " + N.date(x.revisit_on), "warn") : x.status !== "made" ? N.status(x.status) : null,
        action: proposed ? N.request("Decide", N.withId("Let's decide " + N.quote(x.title), x.id), "secondary") : null,
        search: [x.summary, why].join(" "),
        detail: function () {
          return N.detail({
            text: x.summary,
            blocks: [{ heading: "Why", nodes: N.para(why || "Not recorded. Ask Atlas to find or capture the reasoning.") },
              L(x.alternatives).length ? { heading: "Also considered", nodes: N.lines(x.alternatives) } : null],
            facts: N.mergeDetails([["Decided", x.decided_on ? N.dateY(x.decided_on) : "Not decided yet"], ["Decided by", L(x.deciders).map(N.name).join(", ")],
              ["Projects", L(x.projects).map(N.name).join(", ")], ["Reversible", x.reversible === false ? "Hard to reverse" : x.reversible === true ? "Yes" : null],
              ["Revisit", x.revisit_on ? N.dateY(x.revisit_on) : null]], x.details),
            body: x.body, body_truncated: x.body_truncated, links: x.links, dates: N.datesLine(x.created, x.updated),
            actions: [N.request("Ask Atlas", N.withId("Show me the decision " + N.quote(x.title), x.id), "ghost")]
          });
        }
      });
      return track(row, { tab: "decisions", att: dAtt(x), kind: "decision" });
    });
    var rRows = risks.map(function (r) {
      var issue = r.status === "active", e = exposure(r);
      var row = N.row({
        title: r.title, tone: issue || e >= 6 ? "bad" : e >= 3 ? "warn" : null,
        meta: [r.owner ? "Owner " + who(r.owner) : "No owner", "Likelihood " + (r.likelihood ? N.label(r.likelihood).toLowerCase() : "not rated"),
          "Impact " + (r.impact ? N.label(r.impact).toLowerCase() : "not rated")],
        badge: N.badge(issue ? "Issue" : "Risk", issue ? "bad" : e >= 6 ? "warn" : "neutral"),
        search: [r.summary, r.mitigation, r.insight].join(" "),
        detail: function () {
          return N.detail({
            text: r.summary,
            blocks: [{ heading: "Mitigation", nodes: N.para(r.mitigation || "None recorded.") },
              r.insight ? { heading: "What Atlas noticed", nodes: N.para(r.insight) } : null],
            facts: N.mergeDetails([["Status", issue ? "Happening now" : N.label(r.status)], ["Projects", L(r.projects).map(N.name).join(", ")],
              ["Updated", r.updated ? N.dateY(r.updated) : null]], r.details),
            body: r.body, body_truncated: r.body_truncated, links: r.links, dates: N.datesLine(r.created, r.updated),
            actions: [N.request("Ask Atlas", N.withId("Show me the risk " + N.quote(r.title) + " and what we're doing about it", r.id), "ghost")]
          });
        }
      });
      return track(row, { tab: "decisions", att: rAtt(r), kind: "risk" });
    });
    var decCount = h("span", { class: "count" }, ""), riskCount = h("span", { class: "count" }, "");
    var drPanel = h("div", { class: "panel" },
      h("div", { class: "cols" },
        h("div", { class: "col" }, h("h3", { class: "sub" }, "Recent decisions", decCount), N.listBox(dRows, "No decisions in the last 30 days."), N.more("decisions")),
        h("div", { class: "col" }, h("h3", { class: "sub" }, "Risks and issues", riskCount),
          h("p", { class: "col-note" }, "An issue is a risk that's happening now."), N.listBox(rRows, "No open risks or issues."), N.more("risks"))));

    /* ================= People ================= */
    function youOwe(p) { return cs.filter(function (c) { return c.direction === "i_owe" && idOf(c.counterparty) === p.id; }); }
    function theyOwe(p) { return cs.filter(function (c) { return c.direction === "waiting_on" && idOf(c.owner) === p.id; }); }
    function anyLate(list) { return list.some(overdue); }
    function relRank(p) { var i = REL.indexOf(p.relationship); return i < 0 ? REL.length : i; }
    var people = L(d.people).map(function (p) { return { p: p, mine: youOwe(p), theirs: theyOwe(p) }; }).sort(function (a, b) {
      var qa = a.p.quiet ? 0 : 1, qb = b.p.quiet ? 0 : 1;
      if (qa !== qb) return qa - qb;
      var la = anyLate(a.mine.concat(a.theirs)) ? 0 : 1, lb = anyLate(b.mine.concat(b.theirs)) ? 0 : 1;
      if (la !== lb) return la - lb;
      return relRank(a.p) - relRank(b.p) || (b.mine.length + b.theirs.length) - (a.mine.length + a.theirs.length) || cmp(title(a.p), title(b.p));
    });
    function meetingText(m) {
      if (!m || !m.start) return null;
      var n = N.daysFromToday(m.start);
      var day = n === 0 ? "Today" : n === 1 ? "Tomorrow" : N.weekday(m.start);
      var t = N.time(m.start);
      return (m.title ? m.title + ", " : "") + day + (t ? ", " + t : "");
    }
    function owedList(list) {
      if (!list.length) return h("p", null, "Nothing");
      return N.lines(list.slice().sort(byDue).map(function (c) {
        return [c.title, " · ", h("span", { class: overdue(c) ? "late" : null }, c.status === "slipped" && !c.due ? "Slipped" : N.due(c.due))];
      }));
    }
    var pRows = people.map(function (o) {
      var p = o.p, late = anyLate(o.mine.concat(o.theirs));
      var meet = meetingText(p.next_meeting);
      var row = N.row({
        title: p.title, tone: p.quiet ? "warn" : late ? "bad" : null,
        meta: [[p.role, p.org ? N.name(p.org) : null].filter(Boolean).join(", ") || null,
          p.last_contact ? "Last contact " + N.rel(p.last_contact) : "No contact recorded", meet ? "Next: " + meet : null],
        badge: p.quiet ? N.badge("Gone quiet", "warn") : p.relationship ? N.badge(N.label(p.relationship)) : null,
        action: o.theirs.length ? N.request("Nudge " + first(p), N.withId("Draft a follow-up to " + N.quote(p.title) + " about what they owe me", p.id), "secondary", false,
          { kind: "nudge", target: p.id, quoted: p.title }) : null,
        search: [p.role, N.name(p.org), p.quiet_reason, p.insight].join(" "),
        detail: function () {
          return N.detail({
            blocks: [p.quiet && p.quiet_reason ? { heading: "Why they've gone quiet", nodes: N.para(p.quiet_reason) } : null,
              p.insight ? { heading: "What Atlas noticed", nodes: N.para(p.insight) } : null,
              o.theirs.length || o.mine.length ? { heading: null, nodes: h("div", { class: "owes" },
                h("div", { class: "detail-block" }, h("h4", null, first(p) + " owes you"), owedList(o.theirs)),
                h("div", { class: "detail-block" }, h("h4", null, "You owe " + first(p)), owedList(o.mine))) } : null],
            facts: N.mergeDetails([["Relationship", p.relationship ? N.label(p.relationship) : null], ["Usually", p.cadence],
              ["Last contact", p.last_contact ? N.dateY(p.last_contact) : "No contact recorded"], ["Next meeting", meet]], p.details),
            body: p.body, body_truncated: p.body_truncated, links: p.links, dates: N.datesLine(p.created, p.updated),
            actions: [N.request("Ask Atlas", N.withId("What do I know about " + N.quote(p.title) + "?", p.id), "ghost")]
          });
        }
      });
      return track(row, { tab: "people", att: !!p.quiet || o.mine.concat(o.theirs).some(cAtt), kind: "person" });
    });
    var peoplePanel = h("div", { class: "panel" },
      h("p", { class: "col-note" }, "Who you have something open with, are meeting in the next 7 days, or haven't heard from."),
      N.listBox(pRows, "Nobody has anything open with you, and no meetings this week."), N.more("people"),
      h("p", { class: "others" }, "Anyone else is a chat question: ask Atlas, for example, “What do I know about Sam?”"));

    /* ================= Tabs, filter, find ================= */
    var PANELS = { commitments: commitPanel, projects: projPanel, goals: goalPanel, decisions: drPanel, people: peoplePanel };
    var TABS = [
      { id: "commitments", label: "Commitments" }, { id: "projects", label: "Projects" }, { id: "goals", label: "Goals" },
      { id: "decisions", label: "Decisions & risks" }, { id: "people", label: "People" }];
    var nomatch = h("p", { class: "nomatch", role: "status" }, "");
    var tabs = N.tabs(TABS, "commitments", function (id, user) {
      state.tab = id;
      if (user && stats) { stats.clear(); state.tile = null; }
      apply();
    });
    var filterSeg = N.segmented("Show", [{ value: "all", label: "Everything" }, { value: "attention", label: "Needs attention" }], "all",
      function (v) { state.filter = v; apply(); });
    var find = N.search("Find on this page", function (q) { state.q = q; apply(); });
    var EMPTY = {}, TAB_KEYS = { commitments: ["i_owe", "waiting_on"], projects: ["projects"], goals: ["goals"], decisions: ["decisions", "risks"], people: ["people"] };
    var panelWrap = h("div", null, TABS.map(function (t) {
      EMPTY[t.id] = h("p", { class: "empty", hidden: true }, "Nothing on this tab matches. Choose Everything, or clear the tile above.");
      return h("div", { id: "panel-" + t.id, role: "tabpanel", "aria-labelledby": "tab-" + t.id }, EMPTY[t.id], PANELS[t.id]);
    }));
    main.appendChild(h("section", { class: "sec", "aria-label": "Your work" },
      h("div", { class: "toolbar atl-tabs-sticky" }, tabs.el, h("div", { class: "toolbar-row" }, filterSeg, find)),
      nomatch, panelWrap));

    function tileOk(it) {
      if (!state.tile) return true;
      if (state.tile === "i_owe" || state.tile === "waiting_on") return it.kind !== "commitment" || it.dir === state.tile;
      if (state.tile === "overdue") return it.kind !== "commitment" || it.late;
      if (state.tile === "projects") return it.kind !== "project" || it.att;
      return true;
    }
    function visible(it) { return N.matches(it.el, state.q) && (state.filter === "all" || it.att) && tileOk(it); }
    function apply() {
      var per = {};
      items.forEach(function (it) { var ok = visible(it); it.el.hidden = !ok; if (ok) per[it.tab] = (per[it.tab] || 0) + 1; });
      /* group headers hide with their rows */
      [oweL, waitL].forEach(function (lst) { lst.heads.forEach(function (g) { g.el.hidden = !g.rows.some(function (r) { return !r.hidden; }); }); });
      function shown(list) { return list.filter(function (el) { return !el.hidden; }).length; }
      var oweRows = items.filter(function (i) { return i.dir === "i_owe"; }).map(function (i) { return i.el; });
      var waitRows = items.filter(function (i) { return i.dir === "waiting_on"; }).map(function (i) { return i.el; });
      var oN = shown(oweRows), wN = shown(waitRows);
      oweCount.textContent = String(state.filter === "all" && !state.q && !state.tile ? N.total("i_owe", oweList.length) : oN);
      waitCount.textContent = String(state.filter === "all" && !state.q && !state.tile ? N.total("waiting_on", waitList.length) : wN);
      oweL.box.hidden = !oN; waitL.box.hidden = !wN;
      oweNone.hidden = !!oN; waitNone.hidden = !!wN;
      oweNone.textContent = oweList.length ? "Nothing here matches." : "You don't owe anyone anything right now.";
      waitNone.textContent = waitList.length ? "Nothing here matches." : "You're not waiting on anyone.";
      decCount.textContent = String(shown(dRows)); riskCount.textContent = String(shown(rRows));
      var unfiltered = state.filter === "all" && !state.q && !state.tile;
      TABS.forEach(function (t) {
        var n = per[t.id] || 0, any = items.some(function (i) { return i.tab === t.id; });
        if (unfiltered) n += TAB_KEYS[t.id].reduce(function (s, k) { return s + ((N.meta.truncated || {})[k] || 0); }, 0);
        tabs.count(t.id, n, (t.id === "projects" && projAtt > 0) || (t.id === "commitments" && cs.some(overdue)));
        PANELS[t.id].parentNode.hidden = t.id !== state.tab;
        /* filtered to nothing: say so, and hide the empty lists and grids */
        var blank = any && !(per[t.id] || 0) && !state.q;
        EMPTY[t.id].hidden = !blank;
        PANELS[t.id].hidden = blank;
      });
      nomatch.textContent = state.q && !(per[state.tab] || 0) ? "Nothing on this tab matches “" + state.q + "”." + (Object.keys(per).length ? " Try the other tabs." : "") : "";
      nomatch.hidden = !nomatch.textContent;
    }

    var stats = null;
    var s = d.summary || {};
    var lateOwe = oweList.filter(overdue).length, lateWait = waitList.filter(overdue).length;
    var overdueN = s.overdue != null ? s.overdue : lateOwe + lateWait;
    return {
      dateLine: "Where everything you're responsible for stands.",
      stats: [
        { key: "i_owe", filter: true, value: s.i_owe != null ? s.i_owe : N.total("i_owe", oweList.length), label: "you owe" },
        { key: "waiting_on", filter: true, value: s.waiting_on != null ? s.waiting_on : N.total("waiting_on", waitList.length), label: "waiting on others" },
        { key: "overdue", filter: true, tone: "bad", value: overdueN,
          label: overdueN && lateOwe + lateWait === overdueN ? "overdue: " + lateOwe + " you owe, " + lateWait + " waiting" : "overdue" },
        { key: "projects", filter: true, tone: "bad", value: s.projects_attention != null ? s.projects_attention : projAtt, label: ["project needs attention", "projects need attention"] }],
      onStat: function (key) {
        state.tile = key;
        var tab = key === "projects" ? "projects" : "commitments";
        if (key && state.tab !== tab) { state.tab = tab; tabs.set(tab, false); }
        apply();
      },
      onStatsReady: function (st) { stats = st; tabs.start(); }
    };
  });
})();
</script>
</body>
</html>
