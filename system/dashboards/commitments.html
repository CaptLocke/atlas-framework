<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Work</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.work { display: flex; flex-direction: column; gap: var(--space-7); }
.panel { display: flex; flex-direction: column; gap: var(--space-7); }
.panel-note { font-size: 14px; color: var(--muted); }

/* ---- Overview: one card per kind; every number opens its list, already filtered ---- */
.ov { display: grid; gap: var(--space-7); grid-template-columns: repeat(auto-fit, minmax(max(300px, calc((100% - 2 * var(--space-7)) / 3)), 1fr)); }   /* at most three a row */
@media (max-width: 40rem) { .ov { grid-template-columns: minmax(0, 1fr); } }
.ov-card { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-8); border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); }
.ov-kind { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.ov-num { display: inline-flex; align-items: baseline; gap: 12px; padding: 4px 8px; margin: -4px -8px; border: 0; border-radius: var(--radius-md); background: none; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
.ov-num:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.ov-num b { font-size: 56px; line-height: 1; font-weight: 200; letter-spacing: -0.03em; }
.ov-num span { font-size: 15px; font-weight: 600; }
.ov-num[data-tone="bad"] { color: var(--bad); }
.ov-num[data-tone="warn"] { color: var(--warn); }
.ov-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ov-pair .ov-num { flex-direction: column; gap: 2px; align-items: flex-start; }
.ov-pair .ov-num b { font-size: 26px; font-weight: 300; }
.ov-pair .ov-num span { font-size: 13px; font-weight: 400; color: var(--muted); }
.ov-foot { padding-top: var(--space-4); border-top: 1px solid var(--line); font-size: 15px; font-weight: 500; }

/* ---- Hero (Projects, Goals): a night card, linked records beside it at the same height ---- */
.hero-wrap { display: flex; flex-wrap: wrap; gap: var(--space-7); align-items: stretch; }
.hero { flex: 3 1 460px; min-width: 0; padding: var(--space-9); display: flex; flex-direction: column; gap: var(--space-5); }
.hero__kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--night-muted); }
.hero__title { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.12; font-weight: 300; letter-spacing: -0.02em; color: var(--night-text); }
.hero__lede { font-size: 17px; line-height: 1.55; font-weight: 300; color: var(--night-text); max-width: 60ch; }
.hero__facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; }
.hero__facts div { display: flex; flex-direction: column; gap: 2px; }
.hero__facts dt { font-size: 12px; color: var(--night-muted); }
.hero__facts dd { margin: 0; font-size: 15px; font-weight: 500; color: var(--night-text); }
.hero__block { display: flex; flex-direction: column; gap: 4px; }
.hero__block h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--night-muted); }
.hero__block p { font-size: 15px; line-height: 1.55; color: var(--night-text); max-width: 64ch; }
.hero .atl-actions { margin-top: auto; padding-top: var(--space-2); }
.hero .atl-web { margin: var(--space-2) calc(-1 * var(--space-5)) 0; }
@media (max-width: 40rem) { .hero .atl-web { display: none; } }   /* too small to use on a phone; Linked records lists the same */
.measure { display: flex; flex-direction: column; gap: 8px; }
.measure p { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 14px; color: var(--night-muted); }
.measure b { color: var(--night-text); font-weight: 600; }
.hero .bar { background: var(--night-raised); }
.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; color: var(--night-text); }
.ev li { display: flex; gap: 8px; align-items: baseline; }
.ev .atl-badge { flex: none; }
.linked { flex: 2 1 320px; min-width: 0; max-height: 640px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-card-lg); background: var(--surface); overflow: hidden; }
.linked__head { padding: var(--space-7) var(--space-8) var(--space-3); }
.linked__head h3 { font-size: 22px; font-weight: 300; letter-spacing: -0.01em; }
.linked__body { overflow-y: auto; padding: 0 var(--space-8) var(--space-7); display: flex; flex-direction: column; gap: var(--space-5); }
.linked__group { display: flex; flex-direction: column; gap: 6px; }
.linked__group h4 { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
.linked__group h4 .atl-icon { width: 13px; height: 13px; }
.lk { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
.lk:first-of-type { border-top: 0; }
.lk__t { min-width: 0; }
.lk__t b { display: block; font-weight: 500; color: var(--ink); }
.lk__t span { font-size: 12px; color: var(--muted); }
@media (max-width: 40rem) { .hero { padding: var(--space-7); } .linked__head, .linked__body { padding-left: var(--space-6); padding-right: var(--space-6); } }

.others { color: var(--muted); font-size: 14px; }
.owes { display: grid; gap: var(--space-3) var(--space-6); grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); }
.owes .late { color: var(--bad); font-weight: 500; }
.rank-badge { font-size: 13px; font-weight: 600; color: var(--muted); }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var HEALTH_TONE = { off_track: "bad", at_risk: "warn", on_track: "good" };
  var LEVEL = { low: 1, medium: 2, high: 3 };
  var PRIORITY = { high: 0, medium: 1, low: 2 };
  var REL = ["manager", "report", "board", "customer", "stakeholder", "prospect", "partner", "peer", "vendor", "external", "other"];
  var chosen = { project: null, goal: null };   /* the record in each hero; kept across live repaints */

  /* ---- What "needs attention" means, per kind (system/dashboards/commitments.contract.md §Needs attention) ---- */
  function overdue(c) { return c.status === "slipped" || (!!c.due && N.daysFromToday(c.due) < 0); }
  function cAtt(c) { return overdue(c) || (!!c.due && N.daysFromToday(c.due) <= 1); }
  function pAtt(p) { return p.status === "active" && (p.health === "off_track" || p.health === "at_risk"); }
  function gAtt(g) { return g.assessment === "at_risk" || g.assessment === "off_track"; }
  function exposure(r) { return (LEVEL[r.likelihood] || 1) * (LEVEL[r.impact] || 1); }
  function rAtt(r) { return r.status === "active" || exposure(r) >= 6; }
  function revisitSoon(x) { return !!x.revisit_on && N.daysFromToday(x.revisit_on) <= 14; }
  function dAtt(x) { return x.status === "proposed" || revisitSoon(x); }

  function cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function idOf(r) { return r && (typeof r === "string" ? r : r.id); }
  function title(x) { return String(x.title || ""); }
  function first(r) { return String(N.name(r) || "").split(" ")[0]; }
  function byDue(a, b) { var da = a.due || "", db = b.due || ""; return da === db ? 0 : !da ? 1 : !db ? -1 : cmp(da, db); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  N.page({ title: "Work" }, function (d, main) {
    var me = N.meta.user_display_name;
    function who(r) { return r && me && N.name(r) === me ? "You" : N.name(r); }
    var T = N.meta.truncated || {};
    var cards = {};      /* list cards by id, so a tile or an Overview number can open one filtered */
    var tabs = null, stats = null;
    function open(tab, card, filter) {
      if (stats) stats.clear();
      tabs.set(tab, true);
      N.list(card).forEach(function (c) { if (cards[c]) cards[c]._listCard.setFilter(filter); });
      var el = cards[N.list(card)[0]];
      if (el && el.scrollIntoView) setTimeout(function () { el.scrollIntoView({ block: "start" }); }, 0);
    }

    /* ================= Commitments ================= */
    var cs = L(d.commitments).slice().sort(function (a, b) {
      var oa = overdue(a) ? 0 : 1, ob = overdue(b) ? 0 : 1;
      if (oa !== ob) return oa - ob;
      var pa = a.priority in PRIORITY ? PRIORITY[a.priority] : 3, pb = b.priority in PRIORITY ? PRIORITY[b.priority] : 3;
      return pa - pb || byDue(a, b) || cmp(title(a), title(b));
    });
    function dueBadge(c) {
      if (c.status === "slipped" && !(c.due && N.daysFromToday(c.due) < 0)) return N.badge("Slipped", "bad");
      if (overdue(c)) return N.badge(N.due(c.due), "bad");
      if (c.due && N.daysFromToday(c.due) <= 1) return N.badge(N.due(c.due), "warn");
      return N.badge(c.due ? N.weekday(c.due) : "No date");
    }
    function cRow(c) {
      var owe = c.direction === "i_owe", late = overdue(c);
      var other = owe ? c.counterparty : c.owner;
      var action = owe ? N.request("Mark done", N.withId("Mark " + N.quote(c.title) + " as done", c.id), "secondary", true,
          { kind: "mark_done", target: c.id, quoted: c.title })
        : N.request("Nudge " + first(other), N.withId("Draft a follow-up to " + N.quote(N.name(other)) + " about " + N.quote(c.title), c.id), "secondary", false,
          { kind: "nudge", target: c.id, quoted: c.title });
      return N.row({
        title: c.title, tone: late ? "bad" : cAtt(c) ? "warn" : null,
        meta: [owe ? (other ? "For " + who(other) : null) : (other ? "From " + who(other) : null), N.name(c.project) || null],
        badge: dueBadge(c), action: action,
        search: [c.insight, c.next_step, N.name(other), N.name(c.project)].join(" "),
        detail: function () {
          return N.detail({
            blocks: [c.insight ? { heading: "What Atlas noticed", nodes: N.para(c.insight) } : null,
              c.next_step ? { heading: "Next step", nodes: N.para(c.next_step) } : null],
            facts: N.mergeDetails([[owe ? "For" : "From", who(other)], ["Due", c.due ? N.dateY(c.due) + " (" + N.due(c.due).toLowerCase() + ")" : "No date"],
              ["Priority", c.priority ? N.label(c.priority) : null], ["Project", N.name(c.project)], ["Status", c.status ? N.label(c.status) : null]], c.details),
            body: c.body, body_truncated: c.body_truncated, links: c.links, dates: N.datesLine(c.created, c.updated),
            actions: [owe ? N.request("Move the date", N.withId("Change the due date for " + N.quote(c.title), c.id), "secondary", false,
                { kind: "move_date", target: c.id, quoted: c.title, due: c.due })
                : N.request("Mark received", N.withId(N.quote(c.title) + " has arrived. Mark it done", c.id), "secondary", true,
                  { kind: "mark_received", target: c.id, quoted: c.title }),
              N.request("Ask Atlas", N.withId("Show me " + N.quote(c.title), c.id), "ghost")]
          });
        }
      });
    }
    var GROUP = { late: "Overdue", high: "High priority", medium: "Medium priority", low: "Low priority", none: "No priority set" };
    function groupOf(c) { return overdue(c) ? "late" : c.priority in PRIORITY ? c.priority : "none"; }
    var C_FILTERS = [
      { key: "overdue", label: "Overdue", test: overdue },
      { key: "soon", label: "Due in 7 days", test: function (c) { return !overdue(c) && !!c.due && N.daysFromToday(c.due) <= 7; } },
      { key: "high", label: "High priority", test: function (c) { return c.priority === "high"; } },
      { key: "nodate", label: "No date", test: function (c) { return !c.due && !overdue(c); } }];
    var C_SORTS = [{ key: "due", label: "Due date", cmp: byDue }, { key: "title", label: "A to Z", cmp: function (a, b) { return cmp(title(a), title(b)); } }];
    var oweList = cs.filter(function (c) { return c.direction === "i_owe"; });
    var waitList = cs.filter(function (c) { return c.direction === "waiting_on"; });
    function cItems(list) { return list.map(function (c) { return { data: c, el: cRow(c), group: GROUP[groupOf(c)] }; }); }
    cards.i_owe = N.listCard({ id: "i-owe", title: "I owe", count: N.total("i_owe", oweList.length), noun: "I owe", show: 4, items: cItems(oweList),
      filters: C_FILTERS, sorts: C_SORTS, empty: "You don't owe anyone anything right now." });
    cards.waiting_on = N.listCard({ id: "waiting-on", title: "Waiting on", count: N.total("waiting_on", waitList.length), noun: "waiting on", show: 4, items: cItems(waitList),
      filters: C_FILTERS, sorts: C_SORTS, empty: "You're not waiting on anyone." });
    var commitPanel = h("div", { class: "panel" }, h("div", { class: "atl-cols" },
      h("div", { class: "atl-col" }, cards.i_owe, N.more("i_owe")), h("div", { class: "atl-col" }, cards.waiting_on, N.more("waiting_on"))));

    /* A hero's web: the record at the centre, its linked records around it (N.web, compact) */
    var ATT = { off_track: ["critical", "Off track"], at_risk: ["warning", "At risk"] };
    function heroWeb(subject, linked) {
      var recs = [subject].concat(linked.filter(function (x) { return x && x.id && x.id !== subject.id; }));
      var seen = {}; recs = recs.filter(function (x) { if (seen[x.id]) return false; seen[x.id] = 1; return true; });
      if (recs.length < 2) return null;
      return N.web({ records: recs, links: recs.slice(1).map(function (x, i) { return [0, i + 1]; }), start: subject.id, compact: true }).el;
    }
    function asRec(x, type) {
      if (!x) return null;
      var a = type === "commitment" && overdue(x) ? ["critical", x.status === "slipped" ? "Slipped" : "Overdue"]
        : type === "risk" && x.status === "active" ? ["critical", "Critical"] : ATT[x.health || x.assessment] || [];
      return { id: idOf(x), type: type, title: x.title || N.name(x), attention: a[0], status_word: a[1] };
    }

    /* Linked records, from what the page already carries (nothing extra in the data) */
    function linkedCard(heading, groups, empty) {
      var n = groups.reduce(function (s, g) { return s + g.items.length; }, 0);
      return h("aside", { class: "linked", "aria-label": heading },
        h("div", { class: "linked__head" }, h("h3", null, heading, n ? h("span", { class: "sec-count" }, String(n)) : null)),
        h("div", { class: "linked__body" }, n ? groups.filter(function (g) { return g.items.length; }).map(function (g) {
          return h("div", { class: "linked__group" }, h("h4", null, N.icon(g.icon), g.label), g.items.map(function (x) {
            return h("div", { class: "lk" }, h("span", { class: "lk__t" }, h("b", null, x.title), x.sub ? h("span", null, x.sub) : null), x.badge || null);
          }));
        }) : h("p", { class: "panel-note" }, empty)));
    }

    /* ================= Projects ================= */
    var HEALTH_ORDER = { off_track: 0, at_risk: 1, unknown: 2, on_track: 3 };
    var LATER_ORDER = { proposed: 4, paused: 5 };
    function pRank(p) {
      if (p.status === "active") return p.health in HEALTH_ORDER ? HEALTH_ORDER[p.health] : 2;
      return p.status in LATER_ORDER ? LATER_ORDER[p.status] : 6;
    }
    var ps = L(d.projects).slice().sort(function (a, b) {
      var r = pRank(a) - pRank(b);
      if (r) return r;
      if (a.target !== b.target) { if (!a.target) return 1; if (!b.target) return -1; return cmp(a.target, b.target); }
      return cmp(title(a), title(b));
    });
    var decisions = L(d.decisions), risks = L(d.risks), goals = L(d.goals);
    function pBadge(p) { return p.status === "active" ? N.badge(N.label(p.health || "unknown"), HEALTH_TONE[p.health] || "neutral") : N.badge(N.label(p.status)); }
    var projHero = h("div", { class: "hero-wrap", id: "project-hero" });
    function paintProject() {
      projHero.textContent = "";
      var p = ps.filter(function (x) { return x.id === chosen.project; })[0] || ps[0];
      if (!p) return;
      chosen.project = p.id;
      var pcs = cs.filter(function (c) { return idOf(c.project) === p.id; });
      var pd = decisions.filter(function (x) { return L(x.projects).some(function (r) { return idOf(r) === p.id; }); });
      var pr = risks.filter(function (x) { return L(x.projects).some(function (r) { return idOf(r) === p.id; }); });
      var lateN = pcs.filter(overdue).length;
      projHero.appendChild(h("section", { class: "atl-night hero", "aria-labelledby": "ph-t" },
        N.strands({ seed: p.id, count: 2, ambient: 4, band: [0.55, 0.95] }),
        h("p", { class: "hero__kicker" }, N.icon("project"), "Project", pBadge(p)),
        h("h2", { class: "hero__title", id: "ph-t" }, p.title),
        p.summary ? h("p", { class: "hero__lede" }, N.rich(p.summary)) : null,
        h("dl", { class: "hero__facts" }, [["Owner", p.owner ? who(p.owner) : null], ["Target", p.target ? N.dateY(p.target) : null], ["Serves", p.goal ? N.name(p.goal) : null],
          ["Open", pcs.length ? plural(pcs.length, "commitment", "commitments") + (lateN ? ", " + lateN + " overdue" : "") : null]]
          .filter(function (f) { return f[1]; }).map(function (f) { return h("div", null, h("dt", null, f[0]), h("dd", null, f[1])); })),
        p.insight ? h("div", { class: "hero__block" }, h("h3", null, "What Atlas noticed"), h("p", null, N.rich(p.insight))) : null,
        p.next_step ? h("div", { class: "hero__block" }, h("h3", null, "Next step"), h("p", null, N.rich(p.next_step))) : null,
        heroWeb(asRec(p, "project"), pcs.map(function (c) { return asRec(c, "commitment"); }).concat(pd.map(function (x) { return asRec(x, "decision"); }),
          pr.map(function (x) { return asRec(x, "risk"); }), [p.goal ? asRec(p.goal, "goal") : null, p.owner ? asRec(p.owner, "person") : null])),
        h("div", { class: "atl-actions" }, N.prompt("What's blocking " + p.title + "?"), N.prompt("Draft a status update for " + p.title))));
      projHero.appendChild(linkedCard("Linked records", [
        { label: "Commitments", icon: "commitment", items: pcs.map(function (c) { return { title: c.title, sub: (c.direction === "i_owe" ? "You owe" : "From " + who(c.owner)), badge: dueBadge(c) }; }) },
        { label: "Decisions", icon: "decision", items: pd.map(function (x) { return { title: x.title, sub: x.decided_on ? "Decided " + N.date(x.decided_on) : "Not decided yet", badge: x.status === "proposed" ? N.badge("Proposed", "warn") : null }; }) },
        { label: "Risks", icon: "risk", items: pr.map(function (r) { return { title: r.title, sub: r.owner ? "Owner " + who(r.owner) : null, badge: r.status === "active" ? N.badge("Issue", "bad") : null }; }) },
        { label: "Goal", icon: "goal", items: p.goal ? [{ title: N.name(p.goal) }] : [] }], "Nothing else on this page links to this project."));
    }
    function pickProject(p) { chosen.project = p.id; paintProject(); if (projHero.scrollIntoView) projHero.scrollIntoView({ block: "start" }); }
    cards.projects = N.listCard({ id: "projects-list", title: "All projects", count: N.total("projects", ps.length), noun: "projects", show: 6,
      items: ps.map(function (p) {
        var pcs = cs.filter(function (c) { return idOf(c.project) === p.id; }), lateN = pcs.filter(overdue).length;
        return { data: p, el: N.row({ title: p.title, tone: HEALTH_TONE[p.health] || null,
          meta: [p.owner ? "Owner " + who(p.owner) : null, p.target ? "Target " + N.date(p.target) : null, pcs.length ? plural(pcs.length, "open", "open") + (lateN ? ", " + lateN + " overdue" : "") : null],
          badge: pBadge(p), action: N.button({ label: "View", onClick: function () { pickProject(p); } }) }) };
      }),
      filters: [{ key: "attention", label: "Need attention", test: pAtt }, { key: "unknown", label: "Not assessed", test: function (p) { return p.status === "active" && (!p.health || p.health === "unknown"); } },
        { key: "on_track", label: "On track", test: function (p) { return p.health === "on_track"; } }, { key: "later", label: "Proposed or paused", test: function (p) { return p.status !== "active"; } }],
      sorts: [{ key: "target", label: "Target date", cmp: function (a, b) { return byDue({ due: a.target }, { due: b.target }); } }, { key: "title", label: "A to Z", cmp: function (a, b) { return cmp(title(a), title(b)); } }],
      empty: "No active projects." });
    var projPanel = h("div", { class: "panel" }, ps.length ? projHero : null, cards.projects);
    paintProject();

    /* ================= Goals ================= */
    var GSTATUS = { active: 0, draft: 1 };
    var GASSESS = { off_track: 0, at_risk: 1, on_track: 3 };
    goals = goals.slice().sort(function (a, b) {
      var sa = a.status in GSTATUS ? GSTATUS[a.status] : 2, sb = b.status in GSTATUS ? GSTATUS[b.status] : 2;
      if (sa !== sb) return sa - sb;
      var ra = typeof a.rank === "number" ? a.rank : Infinity, rb = typeof b.rank === "number" ? b.rank : Infinity;
      if (ra !== rb) return ra < rb ? -1 : 1;
      var aa = a.assessment in GASSESS ? GASSESS[a.assessment] : 2, ab = b.assessment in GASSESS ? GASSESS[b.assessment] : 2;
      return aa - ab || cmp(title(a), title(b));
    });
    function gBadge(g) { return g.assessment ? N.badge(N.label(g.assessment), HEALTH_TONE[g.assessment]) : g.status === "active" ? N.badge("Not assessed") : N.badge(N.label(g.status)); }
    var goalHero = h("div", { class: "hero-wrap", id: "goal-hero" });
    function paintGoal() {

        [num(goals.filter(function (g) { return g.status === "active" && !g.assessment; }).length, "not assessed", null, function () { open("goals", "goals", "unknown"); }),
          num(N.total("goals", goals.length), "total", null, function () { open("goals", "goals", null); })],

      ovCard("decision", "Decisions", num(proposed, "need action", "warn", function () { open("decisions", "decisions", "proposed"); }),
        [num(decs.filter(revisitSoon).length, "revisit soon", null, function () { open("decisions", "decisions", "revisit"); }),

        decs.filter(function (x) { return undecided(x) === 2; })[0] ? "Newest: " + decs.filter(function (x) { return undecided(x) === 2; })[0].title
          : decs[0] ? "To decide: " + decs[0].title : "No decisions in the last 30 days."),
      ovCard("risk", "Risks", num(issues.length, "critical", "bad", function () { open("risks", "risks", "issue"); }),
        [num(edge.length, "on edge", null, function () { open("risks", "risks", "edge"); }),
          num(N.total("risks", rs.length), "total", null, function () { open("risks", "risks", null); })],
        issues[0] ? "Critical: " + issues[0].title : rs[0] ? "Highest: " + rs[0].title : "No open risks."),
      ovCard("person", "People", num(quietN, "gone quiet", "warn", function () { open("people", "people", "quiet"); }),
        [num(owesN, "waiting on", null, function () { open("people", "people", "owes"); }),
          num(N.total("people", people.length), "total", null, function () { open("people", "people", null); })],
        people[0] ? (people[0].p.quiet ? "Gone quiet: " : "First up: ") + people[0].p.title : null));

    /* ================= Tabs ================= */
    var PANELS = { overview: overview, commitments: commitPanel, projects: projPanel, goals: goalPanel, decisions: decPanel, risks: riskPanel, people: peoplePanel };
    var TABS = [
      { id: "overview", label: "Overview" },
      { id: "commitments", label: "Commitments", count: N.total("i_owe", oweList.length) + N.total("waiting_on", waitList.length), warn: overdueN > 0 },
      { id: "projects", label: "Projects", count: N.total("projects", ps.length), warn: projAtt > 0 },

    };
  });
