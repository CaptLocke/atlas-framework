<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Commitments</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.dir { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.page-controls { margin: 0 0 1.25rem; }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;

  function overdue(c) { return c.status === "slipped" || (c.due && N.daysFromToday(c.due) < 0); }

  N.page({ title: "Commitments" }, function (d, main) {
    var cs = L(d.commitments);
    var owe = cs.filter(function (c) { return c.direction === "i_owe"; });
    var wait = cs.filter(function (c) { return c.direction === "waiting_on"; });
    var filter = "all", query = "";

    var panel = N.recordPanel();
    function view(c) {
      var who = c.direction === "i_owe" ? "You owe " + (N.name(c.counterparty) || "someone") : "Waiting on " + (N.name(c.owner) || "someone");
      return panel.add({ id: c.id, title: c.title, kind: c.direction === "i_owe" ? "I owe" : "Waiting on",
        chips: [overdue(c) ? N.chip(c.status === "slipped" ? "Slipped" : N.due(c.due), "danger") : null, c.priority === "high" ? N.chip("High priority", "warn") : null],
        summary: c.summary || who + ".",
        details: N.mergeDetails([[c.direction === "i_owe" ? "For" : "From", c.direction === "i_owe" ? N.name(c.counterparty) : N.name(c.owner)],
          ["Due", c.due ? N.dateY(c.due) + " (" + N.due(c.due).toLowerCase() + ")" : "No date"],
          ["Priority", c.priority ? N.label(c.priority) : null], ["Project", N.name(c.project)], ["Status", c.status ? N.label(c.status) : null]], c.details),
        sections: [c.insight ? { heading: "What Atlas noticed", nodes: N.para(c.insight) } : null, c.next_step ? { heading: "Next step", nodes: N.para(c.next_step) } : null],
        body: c.body, body_truncated: c.body_truncated,
        links: [c.project, c.direction === "i_owe" ? c.counterparty : c.owner].concat(L(c.links)).filter(Boolean),
        dates: N.datesLine(c.created, c.updated) });
    }

    function group(list, emptyText) {
      var ul = h("ul", { class: "items" });
      var none = N.empty(emptyText);
      var rows = list.map(function (c) {
        var late = overdue(c);
        var who = c.direction === "i_owe" ? (c.counterparty ? "For " + N.name(c.counterparty) : null) : (c.owner ? "From " + N.name(c.owner) : null);
        var li = N.item({ tone: late ? "danger" : (c.priority === "high" ? "warn" : (c.direction === "waiting_on" ? "muted" : "accent")),
          title: N.openTitle(c.title), id: c.id,
          meta: [who, c.project ? N.name(c.project) : null, c.priority ? N.label(c.priority) + " priority" : null],
          insight: c.insight, nextStep: c.next_step,
          aside: [h("span", null, N.due(c.due)), c.status === "slipped" ? N.status("slipped") : null] });
        li._c = c;
        li._text = [c.title, N.name(c.counterparty), N.name(c.owner), N.name(c.project)].join(" ").toLowerCase();
        N.clickable(li, panel, view(c));
        ul.appendChild(li);
        return li;
      });
      var noMatch = N.empty("Nothing here matches.");
      noMatch.hidden = true;
      function apply() {
        var shown = 0;
        rows.forEach(function (li) {
          var ok = (filter === "all" || (filter === "overdue" && overdue(li._c)) || (filter === "high" && li._c.priority === "high"))
            && (!query || li._text.indexOf(query) !== -1);
          li.hidden = !ok; shown += ok ? 1 : 0;
        });
        ul.hidden = !shown; noMatch.hidden = !!shown || !rows.length;
      }
      return { body: rows.length ? [ul, noMatch] : none, apply: apply };
    }

    var waitGroup = group(wait, "You're not waiting on anyone.");
    var oweGroup = group(owe, "You don't owe anyone anything right now.");
    function applyAll() { waitGroup.apply(); oweGroup.apply(); }

    if (cs.length) {
      main.appendChild(h("div", { class: "controls page-controls no-print" },
        N.segmented("Show commitments", [{ value: "all", label: "All" }, { value: "overdue", label: "Overdue" }, { value: "high", label: "High priority" }], "all",
          function (v) { filter = v; applyAll(); }),
        N.search("Filter by name, person, or project", function (q) { query = q; applyAll(); })));
    }
    main.appendChild(N.section({ id: "waiting", title: "Waiting on", key: "waiting_on",
      note: "What other people have promised you. Overdue first, then by due date.", body: waitGroup.body }));
    main.appendChild(N.section({ id: "owe", title: "I owe", key: "i_owe",
      note: "What you've promised other people. Overdue first, then by due date.", body: oweGroup.body }));
    main.appendChild(panel.el);

    var s = d.summary || {};
    return { subtitle: "Everything you owe, and everything owed to you.",
      stats: [[s.overdue != null ? s.overdue : cs.filter(overdue).length, "overdue"],
        [s.i_owe != null ? s.i_owe : owe.length, "I owe"],
        [s.waiting_on != null ? s.waiting_on : wait.length, "waiting on others"]] };
  });
})();
</script>
</body>
</html>
