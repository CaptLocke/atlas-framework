<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Projects</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.proj-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.proj { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--tone, var(--line)); border-radius: var(--radius); padding: 1rem 1.1rem; display: grid; gap: .45rem; align-content: start; }
.proj[data-tone="danger"] { --tone: var(--danger); }
.proj[data-tone="warn"] { --tone: var(--warn); }
.proj[data-tone="ok"] { --tone: var(--ok); }
.proj h3 { font-size: 1.12rem; }
.proj .item-meta { gap: .15rem .8rem; }
.proj-counts { display: flex; gap: 1rem; font-size: .875rem; color: var(--ink-2); }
.proj-counts b { color: var(--ink); }
.page-controls { margin: 0 0 1.25rem; }
.proj-all { padding: 1.25rem 0 1.75rem; border-top: 1px solid var(--line); }
/* A project with its own project page: the whole card is a link to it */
.proj.has-page { position: relative; cursor: pointer; transition: background-color .12s; }
.proj.has-page:hover { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.proj-link { color: inherit; text-decoration: none; }
.proj-link::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
.proj-link:focus-visible { outline: none; }
.proj-link:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.page-chip { display: inline-flex; align-items: center; gap: .25rem; }
@media (prefers-reduced-motion: reduce) { .proj.has-page { transition: none; } }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var HEALTH_TONE = { off_track: "danger", at_risk: "warn", on_track: "ok", unknown: null };
  function attention(p) { return p.health === "off_track" || p.health === "at_risk"; }

  N.page({ title: "Projects" }, function (d, main) {
    var ps = L(d.projects);
    var filter = "all", query = "";
    var panel = N.recordPanel();

    function view(p) {
      var cs = L(p.commitments);
      return panel.add({ id: p.id, title: p.title, kind: p.scale && p.scale !== "project" ? N.label(p.scale) : "Project",
        chips: [N.status(p.health || "unknown"), p.status && p.status !== "active" ? N.status(p.status) : null],
        summary: p.summary,
        details: N.mergeDetails([["Health", N.label(p.health || "unknown")], ["Status", p.status ? N.label(p.status) : null], ["Owner", N.name(p.owner)],
          ["Target", p.target ? N.dateY(p.target) : null], ["Serves", N.name(p.goal)], ["Open commitments", String(p.open_commitments || 0)], ["Open risks", String(p.active_risks || 0)]], p.details),
        sections: [p.insight ? { heading: "What Atlas noticed", nodes: N.para(p.insight) } : null,
          p.next_step ? { heading: "Next step", nodes: N.para(p.next_step) } : null,
          cs.length ? { heading: "Open commitments", nodes: N.lines(cs.map(function (c) {
            return [c.title, " · ", c.direction === "i_owe" ? "You owe" : "Waiting on", c.due ? ", " + N.due(c.due).toLowerCase() : ""];
          })) } : null,
          L(p.risks).length ? { heading: "Open risks", nodes: N.lines(L(p.risks).map(function (r) { return [r.title, r.status === "active" ? " · happening now" : ""]; })) } : null],
        body: p.body, body_truncated: p.body_truncated,
        links: [p.goal, p.owner].concat(L(p.links)).filter(Boolean),
        dates: N.datesLine(p.created, p.updated) });
    }

    function pageUrl(p) { return p.page_url && /^https:\/\//.test(p.page_url) ? p.page_url : null; }
    var cards = ps.map(function (p) {
      var hid = "p-" + p.id.replace(/\W/g, "-");
      var url = pageUrl(p);
      /* A project with its own project page opens it; any other project opens the record panel. */
      var card = h("article", { class: "proj" + (url ? " has-page" : ""), "data-tone": HEALTH_TONE[p.health] || null, "aria-labelledby": hid },
        h("h3", { id: hid }, url ? h("a", { class: "proj-link", href: url, target: "_blank", rel: "noopener noreferrer" }, p.title) : N.openTitle(p.title)),
        h("div", { class: "chips" }, N.status(p.health || "unknown"), p.status !== "active" ? N.status(p.status) : null, p.scale && p.scale !== "project" ? N.chip(N.label(p.scale)) : null,
          url ? h("span", { class: "chip page-chip", "data-tone": "accent" }, "Project page \u2197") : null),
        h("p", { class: "item-meta" }, p.owner ? h("span", null, "Owner " + N.name(p.owner)) : null, p.target ? h("span", null, "Target " + N.date(p.target)) : null, p.goal ? h("span", null, "Serves " + N.name(p.goal)) : null),
        p.insight ? h("p", { class: "item-insight" }, N.rich(p.insight)) : null,
        p.next_step ? h("p", { class: "item-insight" }, h("b", null, "Next step: "), N.rich(p.next_step)) : null,
        h("p", { class: "proj-counts" }, h("span", null, h("b", null, String(p.open_commitments || 0)), p.open_commitments === 1 ? " open commitment" : " open commitments"),
          h("span", null, h("b", null, String(p.active_risks || 0)), p.active_risks === 1 ? " open risk" : " open risks")));
      var v = view(p);
      if (!url) N.clickable(card, panel, v);
      card._p = p;
      card._text = [p.title, N.name(p.owner), N.name(p.goal), p.insight].join(" ").toLowerCase();
      return card;
    });
    var grid = h("div", { class: "proj-grid" }, cards);
    var noMatch = N.empty("No projects match.");
    noMatch.hidden = true;
    function apply() {
      var shown = 0;
      cards.forEach(function (c) {
        var p = c._p;
        var ok = (filter === "all" || (filter === "attention" && attention(p)) || (filter === "on_track" && p.health === "on_track") || (filter === "later" && (p.status === "proposed" || p.status === "paused")))
          && (!query || c._text.indexOf(query) !== -1);
        c.hidden = !ok; shown += ok ? 1 : 0;
      });
      grid.hidden = !shown; noMatch.hidden = !!shown;
    }
    if (ps.length) {
      main.appendChild(h("div", { class: "controls page-controls no-print" },
        N.segmented("Show projects", [{ value: "all", label: "All" }, { value: "attention", label: "Needs attention" }, { value: "on_track", label: "On track" },
          { value: "later", label: "Proposed or paused" }], "all", function (v) { filter = v; apply(); }),
        N.search("Filter by project, owner, or goal", function (q) { query = q; apply(); })));
    }
    /* No section heading: the page title already says "Projects". The cards use the full width. */
    main.appendChild(h("div", { class: "proj-all", id: "projects" },
      ps.length ? [grid, noMatch] : N.empty("No active projects."), N.more("projects")));
    main.appendChild(panel.el);

    var s = d.summary || {};
    var active = ps.filter(function (p) { return p.status === "active"; });
    return { subtitle: "Everything you're moving forward, and how it's going.",
      stats: [[s.active != null ? s.active : active.length, ["active project", "active projects"]],
        [s.attention != null ? s.attention : ps.filter(attention).length, "need attention"],
        [s.on_track != null ? s.on_track : ps.filter(function (p) { return p.health === "on_track"; }).length, "on track"],
        [s.later != null ? s.later : ps.filter(function (p) { return p.status === "proposed" || p.status === "paused"; }).length, "proposed or paused"]] };
  });
})();
</script>
</body>
</html>
