<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Atlas Guide</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.guide-search { margin-bottom: 1.5rem; }
.guide-search .search { max-width: 32rem; }
.entries { display: grid; gap: .9rem; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.15rem; display: grid; gap: .55rem; }
.entry h3 { font-size: 1.12rem; }
.entry p { max-width: var(--measure); }
.entry ul, .entry ol { margin: 0; padding-left: 1.25rem; display: grid; gap: .3rem; max-width: var(--measure); }
.say { list-style: none !important; padding: 0 !important; display: flex !important; flex-wrap: wrap; gap: .4rem !important; max-width: none !important; }
.say li { background: var(--accent-soft); color: var(--ink); border-radius: 1rem 1rem 1rem .25rem; padding: .3rem .8rem; font-size: .92rem; }
.say-label { font-size: .82rem; color: var(--ink-2); font-weight: 600; }
.sec-intro { max-width: var(--measure); margin-bottom: 1rem; color: var(--ink-2); }
.release h3 { font-size: 1.1rem; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
.release h3 span { font-family: var(--font-body); font-size: .85rem; color: var(--ink-2); font-weight: 400; }
details.older { margin-top: .9rem; }
details.older summary { cursor: pointer; color: var(--accent); font-size: .95rem; }
details.older .entries { margin-top: .9rem; }
.nomatch { margin-top: .5rem; }
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;

  function paras(list) { return L(list).map(function (p) { return h("p", null, N.rich(p)); }); }
  function entry(it) {
    var art = h("article", { class: "entry", id: it.id ? "e-" + it.id : null },
      h("h3", null, it.title),
      paras(it.body),
      L(it.bullets).length ? h("ul", null, L(it.bullets).map(function (b) { return h("li", null, N.rich(b)); })) : null,
      L(it.steps).length ? h("ol", null, L(it.steps).map(function (b) { return h("li", null, N.rich(b)); })) : null,
      L(it.examples).length ? [h("p", { class: "say-label" }, "Try saying"), h("ul", { class: "say" }, L(it.examples).map(function (x) { return h("li", null, "“" + x + "”"); }))] : null);
    art._text = [it.title].concat(L(it.body), L(it.bullets), L(it.steps), L(it.examples)).join(" ").toLowerCase();
    return art;
  }
  function release(r) {
    var art = h("article", { class: "entry release" },
      h("h3", null, "Atlas " + r.version, r.date ? h("span", null, N.dateY(r.date)) : null),
      h("ul", null, L(r.items).map(function (x) { return h("li", null, N.rich(x)); })));
    art._text = ["atlas", r.version].concat(L(r.items)).join(" ").toLowerCase();
    return art;
  }

  N.page({ title: "Atlas Guide" }, function (d, main) {
    var sections = L(d.sections), news = L(d.whats_new);
    var all = [];
    var noMatch = h("p", { class: "empty nomatch", hidden: true }, "Nothing in the guide matches. Ask Atlas in chat instead; it can explain anything here.");
    main.appendChild(h("div", { class: "no-print" },
      h("div", { class: "guide-search" }, N.search("Search the guide", function (q) {
        var shown = 0;
        all.forEach(function (a) { var ok = !q || a._text.indexOf(q) !== -1; a.hidden = !ok; shown += ok ? 1 : 0; });
        main.querySelectorAll("section.sec").forEach(function (sec) {
          sec.hidden = !!q && !Array.prototype.some.call(sec.querySelectorAll("article"), function (a) { return !a.hidden; });
        });
        main.querySelectorAll("details.older").forEach(function (det) { if (q) det.open = true; });
        noMatch.hidden = shown > 0;
      })), noMatch));

    if (news.length) {
      var latest = news.slice(0, 3).map(release);
      var older = news.slice(3).map(release);
      all = all.concat(latest, older);
      main.appendChild(N.section({ id: "whats-new", title: "What's new", note: "Updates install themselves. Major changes ask you first.",
        body: [h("div", { class: "entries" }, latest), older.length ? h("details", { class: "older" }, h("summary", null, "Earlier releases (" + older.length + ")"), h("div", { class: "entries" }, older)) : null], key: "whats_new" }));
    }
    sections.forEach(function (s) {
      var arts = L(s.items).map(entry);
      all = all.concat(arts);
      main.appendChild(N.section({ id: "s-" + s.id, title: s.title, count: arts.length > 1 ? arts.length : null,
        body: [s.intro ? h("p", { class: "sec-intro" }, N.rich(s.intro)) : null, arts.length ? h("div", { class: "entries" }, arts) : N.empty("Nothing here yet.")],
        key: "sections." + s.id }));
    });
    if (!sections.length && !news.length) main.appendChild(N.empty("The guide is empty. Ask Atlas in chat what it can do."));
    return { subtitle: "Everything Atlas can do, and how to ask.", lede: d.intro,
      stats: d.version ? [[d.version, "installed version"]] : null };
  });
})();
</script>
</body>
</html>
