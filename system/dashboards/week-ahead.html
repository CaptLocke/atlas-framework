<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Week Ahead</title>
<style id="atlas-base">{{ATLAS_BASE_CSS}}</style>
<style id="atlas-page">
.day-load { margin-top: .5rem; display: grid; gap: .3rem; max-width: 10rem; }
.day-load p { font-size: .8rem; color: var(--ink-2); }
.slot .item-main { grid-template-columns: 6.5rem minmax(0, 1fr); column-gap: 1rem; }
.slot .item-main > :not(.when) { grid-column: 2; }
.slot .when { grid-row: span 6; font-variant-numeric: tabular-nums; font-weight: 600; font-size: .95rem; }
.slot .when span { display: block; font-weight: 400; color: var(--ink-2); font-size: .8rem; }
.item.focus { background: repeating-linear-gradient(135deg, transparent 0 8px, var(--accent-soft) 8px 10px); }
.item.focus .item-title { color: var(--accent); }
.due-list { margin-top: .75rem; }
.weekend .sec-head h2 { color: var(--ink-2); }
/* Outcomes */
.outcomes { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; counter-reset: oc; }
.outcomes li { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: .2rem .75rem; align-items: start; padding: .8rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); counter-increment: oc; }
.outcomes li::before { content: counter(oc); font-family: var(--font-heading); font-size: 1.5rem; line-height: 1; color: var(--star); font-weight: 600; grid-row: span 2; }
.oc-text { font-weight: 600; margin: 0; }
.oc-why { margin: 0; grid-column: 2; font-size: .9rem; color: var(--ink-2); }
.outcomes li[data-done="1"] .oc-text { text-decoration: line-through; color: var(--ink-2); }
/* Week at a glance */
.glance-wrap { overflow-x: auto; margin: 0 -2px; padding: 2px; }
.glance { display: grid; grid-template-columns: repeat(7, minmax(5.2rem, 1fr)); gap: .5rem; min-width: 38rem; }
.gday { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: .35rem; align-content: start; padding: .7rem .7rem .75rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: .82rem; color: var(--ink-2); }
.gday:hover { border-color: var(--accent); }
.gday:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gday[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.gday[data-off="1"] { background: transparent; border-style: dashed; }
.gday .gname { font-family: var(--font-heading); font-size: 1rem; font-weight: 600; color: var(--ink); }
.gday .gdate { font-variant-numeric: tabular-nums; }
.gbar { height: .45rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.gbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.gday[data-heavy="1"] .gbar i { background: var(--warn); }
.gnums { display: grid; gap: .1rem; font-variant-numeric: tabular-nums; }
.gnums b { color: var(--ink); font-weight: 600; }
.gflags { display: flex; flex-wrap: wrap; gap: .25rem; min-height: 1.1rem; }
.gflag { font-size: .72rem; font-weight: 600; padding: 0 .4rem; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.gflag.due { color: var(--accent); }
.gflag.watch { color: var(--warn); }
.capacity { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .75rem; margin-top: .9rem; padding: .8rem 1rem; border-radius: var(--radius); border: 1px solid var(--line); border-left: 4px solid var(--tone, var(--ok)); background: color-mix(in srgb, var(--tone, var(--ok)) 8%, var(--surface)); }
.capacity[data-tone="warn"] { --tone: var(--warn); }
.capacity b { font-family: var(--font-heading); font-size: 1.15rem; }
.capacity p { margin: 0; }
.capacity .cap-note { font-size: .88rem; color: var(--ink-2); }
.show-all { margin-top: .6rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: .35rem 1rem; font: inherit; font-size: .9rem; cursor: pointer; }
.show-all:hover { border-color: var(--accent); }
@media (max-width: 34rem) {
  .slot .item-main { grid-template-columns: minmax(0, 1fr); }
  .slot .item-main > :not(.when) { grid-column: 1; }
  .slot .when { grid-row: auto; }
  .slot .when span { display: inline; margin-left: .35rem; }
  .outcomes li { grid-template-columns: 1.6rem minmax(0, 1fr); }
  .outcomes li > .chips { grid-column: 2; }
}
</style>
<style id="atlas-theme">{{ATLAS_THEME_CSS}}</style>
</head>
<body>
<div id="app"></div>
<script id="atlas-data" type="application/json">{{ATLAS_DATA}}</script>
<script id="atlas-base-js">{{ATLAS_BASE_JS}}</script>
<script id="atlas-page-js">
(function () {
  var N = window.Atlas, h = N.h, L = N.list;
  var OUTCOME_TONE = { done: "ok", on_track: "ok", at_risk: "warn", open: null };
  var WATCH_LABEL = { overloaded: "Overloaded day", no_break: "No break", double_booked: "Double-booked", unprotected_deadline: "No time set aside" };

  function when(start, end, allDay) {
    return h("p", { class: "when" }, allDay ? "All day" : N.time(start), !allDay && end ? h("span", null, "to " + N.time(end)) : null);
  }
  function dayLabel(date) {
    var n = N.daysFromToday(date);
    return n === 0 ? "Today" : n === 1 ? "Tomorrow" : N.dayName(date);
  }
  function hrs(x) { return (Math.round((x || 0) * 10) / 10) + " h"; }

  N.page({ title: "Week Ahead" }, function (d, main) {
    var days = L(d.days), s = d.summary || {}, r = d.range || {};
    var cap = d.work_hours_per_day || 10;
    var panel = N.recordPanel();
    var selected = null, daySecs = {}, dayBtns = [];

    function eventView(e, date) {
      var prep = e.prep || {};
      return panel.add({ id: e.id, title: e.title, kind: e.kind ? N.label(e.kind) : "Meeting",
        chips: [prep.status ? N.status(prep.status) : null],
        summary: e.note,
        details: N.mergeDetails([["When", dayLabel(date) + ", " + (e.all_day ? "all day" : N.time(e.start) + (e.end ? " to " + N.time(e.end) : ""))],
          ["Where", e.location], ["With", L(e.attendees).map(N.name).join(", ")], ["Project", N.name(e.project)],
          ["Prep", prep.status ? N.label(prep.status) : null]], e.details),
        sections: [prep.summary ? { heading: "From the prep note", nodes: N.para(prep.summary) } : null,
          prep.todo ? { heading: "What to prepare", nodes: N.para(prep.todo) } : null],
        body: e.body, body_truncated: e.body_truncated,
        links: [e.project].concat(L(e.attendees)).concat(L(e.links)).filter(Boolean),
        dates: null });
    }

    /* 1. This week's outcomes */
    var outs = L(d.outcomes);
    if (outs.length) {
      main.appendChild(N.section({ id: "outcomes", title: "This week's outcomes",
        note: "What would make this week a success, tied to your goals.",
        body: h("ol", { class: "outcomes" }, outs.map(function (o) {
          return h("li", { "data-done": o.status === "done" ? "1" : null },
            h("p", { class: "oc-text" }, N.rich(o.text)),
            h("p", { class: "chips" }, o.status && o.status !== "open" ? N.chip(N.label(o.status), OUTCOME_TONE[o.status]) : null),
            (o.why || o.goal) ? h("p", { class: "oc-why" }, [o.goal ? "For " + N.name(o.goal) + ". " : "", o.why ? N.rich(o.why) : ""]) : null);
        })) }));
    }

    /* 2. The week at a glance + time vs. work */
    var watch = L(d.watchouts);
    var watchBy = {};
    watch.forEach(function (w) { if (w.date) watchBy[w.date] = (watchBy[w.date] || 0) + 1; });
    var showAll = h("button", { type: "button", class: "more-btn show-all", hidden: true, onclick: function () { select(null); } }, "Show all days");
    function select(date) {
      selected = selected === date ? null : date;
      dayBtns.forEach(function (b) { b.setAttribute("aria-pressed", b._date === selected ? "true" : "false"); });
      Object.keys(daySecs).forEach(function (k) { daySecs[k].hidden = !!selected && k !== selected; });
      showAll.hidden = !selected;
    }
    if (days.length) {
      var strip = h("div", { class: "glance", role: "group", "aria-label": "Days of the week" }, days.map(function (day) {
        var off = day.work_day === false, mh = day.meeting_hours || 0;
        var dues = L(day.due).length, wn = watchBy[day.date] || 0;
        var b = h("button", { type: "button", class: "gday", "aria-pressed": "false", "data-off": off ? "1" : null, "data-heavy": !off && mh / cap > 0.6 ? "1" : null,
            "aria-label": dayLabel(day.date) + ": " + hrs(mh) + " in meetings, " + hrs(day.free_hours) + " free" + (dues ? ", " + dues + " due" : "") + (wn ? ", " + wn + " watch-out" + (wn > 1 ? "s" : "") : ""),
            onclick: function () { select(day.date); } },
          h("span", { class: "gname" }, N.daysFromToday(day.date) === 0 ? "Today" : N.dayName(day.date).slice(0, 3)),
          h("span", { class: "gdate" }, N.date(day.date)),
          off ? h("span", null, "Day off") : [h("span", { class: "gbar", "aria-hidden": "true" }, h("i", { style: "width:" + Math.min(100, Math.round(mh / cap * 100)) + "%" })),
            h("span", { class: "gnums" }, h("span", null, h("b", null, hrs(mh)), " meetings"), h("span", null, h("b", null, hrs(day.free_hours)), " free"))],
          h("span", { class: "gflags" }, dues ? h("span", { class: "gflag due" }, dues + " due") : null, wn ? h("span", { class: "gflag watch" }, "Watch-out") : null));
        b._date = day.date; dayBtns.push(b);
        return b;
      }));
      var free = s.focus_hours, need = s.work_due_hours, short = typeof free === "number" && typeof need === "number" && need > free;
      var capLine = typeof free === "number" ? h("div", { class: "capacity", "data-tone": short ? "warn" : "ok", role: "note" },
        h("p", null, "About ", h("b", null, hrs(free)), " of focus time free, and roughly ", h("b", null, hrs(need)), " of work you owe is due."),
        h("p", { class: "cap-note" }, (short ? "That's " + hrs(need - free) + " short. Block time early or move something." : "There's room for it if you protect the time.")
          + (s.unsized ? " Plus " + s.unsized + (s.unsized === 1 ? " item" : " items") + " without an estimate." : ""))) : null;
      main.appendChild(N.section({ id: "glance", title: "The week at a glance",
        note: "How full each day is. Select a day to see only that day below.",
        body: [h("div", { class: "glance-wrap" }, strip), capLine, showAll] }));
    }

    /* 3. Get ready */
    var ready = [];
    days.forEach(function (day) { L(day.events).forEach(function (e) {
      var st = (e.prep || {}).status;
      if (st === "none" || st === "planned") ready.push({ e: e, date: day.date });
    }); });
    var eventViews = {};
    days.forEach(function (day) { L(day.events).forEach(function (e) { eventViews[e.id] = eventView(e, day.date); }); });
    main.appendChild(N.section({ id: "ready", title: "Get ready",
      note: "Meetings that need preparation, soonest first.",
      body: N.items(ready.map(function (x) {
        var e = x.e, prep = e.prep || {};
        var li = N.item({ tone: prep.status === "none" ? "warn" : "accent", title: N.openTitle(e.title), id: e.id,
          meta: [dayLabel(x.date) + (e.all_day ? "" : ", " + N.time(e.start)), L(e.attendees).length ? "With " + L(e.attendees).map(N.name).join(", ") : null],
          text: prep.todo || (prep.status === "planned" ? "Atlas will write the prep note before the meeting." : "No prep note yet."),
          aside: [N.status(prep.status)] });
        return N.clickable(li, panel, eventViews[e.id]);
      }), "Nothing needs preparing this week.") }));

    /* 4. Watch-outs */
    main.appendChild(N.section({ id: "watch", title: "Watch-outs",
      note: "Things about this week's schedule worth fixing early.",
      body: N.items(watch.map(function (w) {
        return N.item({ tone: w.kind === "double_booked" || w.kind === "unprotected_deadline" ? "danger" : "warn",
          title: (w.date ? dayLabel(w.date) + ": " : "") + (WATCH_LABEL[w.kind] || N.label(w.kind)), text: w.text });
      }), "Nothing to watch out for. The week looks workable.") }));

    /* 5. Day by day */
    days.forEach(function (day) {
      var slots = L(day.events).map(function (e) { return { at: e.start, e: e }; })
        .concat(L(day.focus).map(function (f) { return { at: f.start, f: f }; }))
        .sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); });
      var rows = slots.map(function (sl) {
        var li;
        if (sl.e) {
          var e = sl.e, prep = e.prep || {};
          var needs = prep.status === "planned" || prep.status === "none";
          li = N.item({ tone: prep.status === "ready" ? "ok" : (needs ? "warn" : null), title: N.openTitle(e.title), id: e.id,
            meta: [e.kind && e.kind !== "meeting" ? N.label(e.kind) : null, e.location, L(e.attendees).length ? "With " + L(e.attendees).map(N.name).join(", ") : null],
            insight: e.note,
            aside: [prep.status ? N.status(prep.status) : null] });
          li.firstChild.insertBefore(when(e.start, e.end, e.all_day), li.firstChild.firstChild);
          N.clickable(li, panel, eventViews[e.id]);
        } else {
          var f = sl.f;
          li = N.item({ tone: "accent", title: f.label || "Suggested focus time", text: f.reason, aside: [N.chip("Suggestion", "accent")] });
          li.classList.add("focus");
          li.firstChild.insertBefore(when(f.start, f.end), li.firstChild.firstChild);
        }
        return li;
      });
      var dues = L(day.due).map(function (c) {
        var late = c.status === "slipped";
        return N.item({ tone: late ? "danger" : (c.direction === "waiting_on" ? "muted" : "warn"), title: c.title, id: c.id,
          meta: [N.label(c.direction), c.counterparty ? (c.direction === "i_owe" ? "For " : "From ") + N.name(c.counterparty) : null],
          aside: [c.kind === "deadline" ? N.chip("Deadline", "danger") : N.chip("Due")] });
      });
      var hours = day.meeting_hours;
      var n = N.daysFromToday(day.date);
      var sec = N.section({ id: "d-" + day.date, title: dayLabel(day.date),
        note: (n === 0 || n === 1 ? N.longDate(day.date) : N.dateY(day.date)) + (day.work_day === false ? ". Not a work day." : ""),
        key: "days." + day.date,
        body: [rows.length ? h("ul", { class: "items slot" }, rows) : N.empty(day.work_day === false ? "Nothing scheduled." : "No meetings. A good day for deep work."),
          dues.length ? h("ul", { class: "items due-list", "aria-label": "Due this day" }, dues) : null] });
      if (typeof hours === "number" && day.work_day !== false) {
        sec.querySelector(".sec-head > div").appendChild(h("div", { class: "day-load" },
          N.bar(hours / cap, hours + " hours of meetings"), h("p", null, hours + " h in meetings" + (typeof day.free_hours === "number" ? ", " + hrs(day.free_hours) + " free" : ""))));
      }
      if (day.work_day === false) sec.classList.add("weekend");
      daySecs[day.date] = sec;
      main.appendChild(sec);
    });
    if (!days.length) main.appendChild(N.empty("No calendar data for the coming week."));
    main.appendChild(panel.el);

    return { subtitle: r.start ? N.date(r.start) + " to " + N.dateY(r.end) : null, 
      stats: [[s.meetings || 0, ["meeting", "meetings"]], [s.meeting_hours || 0, ["hour in meetings", "hours in meetings"]],
        [typeof s.focus_hours === "number" ? s.focus_hours : 0, ["hour of focus time free", "hours of focus time free"]], [s.deadlines || 0, ["thing due", "things due"]]] };
  });
})();
</script>
</body>
</html>
