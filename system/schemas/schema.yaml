# Machine-readable schema summary used by system/tools/validate.py.
# Human-readable specs (with guidance) live beside this file as <type>.md.
# Keep the two in sync: this file is the source of truth for field names and enums.

common:
  required: [id, type, title, summary, status, created, updated]
  optional: [aliases, links, sources, supersedes, superseded_by, provenance, sensitivity, archived]
  enums:
    provenance: [stated, observed, researched, inferred]
    sensitivity: [normal, confidential, pii, phi, financial, legal_privileged, custom]
  link_groups: [people, organizations, projects, goals, commitments, decisions, events, risks, questions, ideas, topics, playbooks, related]
  id_pattern: '^[a-z]+/[a-z0-9][a-z0-9-]*$'   # <folder>/<slug>
  date_fields: [created, updated]

types:
  person:
    folder: people
    fields: [emails, org, role, relationship, last_contact, cadence, phone, location, notes_private]
    enums:
      status: [active, inactive]
      relationship: [self, manager, report, peer, stakeholder, board, customer, prospect, vendor, partner, external, other]
  organization:
    folder: organizations
    fields: [domain, kind, relationship_status, industry, website, size, headquarters]
    enums:
      status: [active, inactive]
      kind: [employer, customer, prospect, vendor, partner, regulator, investor, team, other]
  project:
    folder: projects
    fields: [owner, goal, start, target, health, insight, next_step, scale]
    enums:
      status: [proposed, active, paused, done, cancelled]
      health: [on_track, at_risk, off_track, unknown]
      scale: [task_group, project, initiative, program]
  goal:
    folder: goals
    fields: [horizon, period, metric, target, current, owner, accomplishments, rank]
    enums:
      status: [draft, active, achieved, missed, dropped]
      horizon: [quarter, half, year, multi_year]
  commitment:
    folder: commitments
    required: [direction, owner, counterparty, due]
    fields: [direction, owner, counterparty, due, origin, priority, effort, insight, next_step, completed_on]
    enums:
      status: [open, done, dropped, slipped]
      direction: [i_owe, waiting_on]
      priority: [high, medium, low]
      effort: [quick, hour, half_day, day]
  decision:
    folder: decisions
    fields: [decided_on, deciders, rationale, alternatives, reversible, revisit_on]
    enums:
      status: [proposed, made, reversed, superseded]
  event:
    folder: events
    fields: [kind, start, end, attendees, series, location, outcomes, prep, all_day, response]
    enums:
      status: [scheduled, held, cancelled]
      kind: [meeting, one_on_one, deadline, milestone, occurrence]
      response: [organizer, accepted, tentative, not_responded, declined]
  risk:
    folder: risks
    fields: [likelihood, impact, owner, mitigation]
    enums:
      status: [potential, active, resolved]    # active = an issue
      likelihood: [low, medium, high]
      impact: [low, medium, high]
  question:
    folder: questions
    fields: [asked_by, asked_on, answer, answered_on]
    enums:
      status: [open, answered, dropped]
  idea:
    folder: ideas
    fields: [origin]
    enums:
      status: [seed, exploring, proposed, adopted, parked, dropped]
  topic:
    folder: topics
    fields: [scope]
    enums:
      status: [active, dormant]
  playbook:
    folder: playbooks
    fields: [trigger, anchor, steps, auto_start, last_used, automatable]
    enums:
      status: [draft, active, retired]
  source:
    folder: sources
    required: [kind, captured_on, retention]
    fields: [kind, origin_uri, connector, captured_on, occurred_on, participants, retention, file_pointer, import_id, original_path, flags, compacted_on, full_text_commit]
    enums:
      status: [captured, processed]
      kind: [email, meeting, message, doc, web, data, record, manual, journal, file, deliverable, import]
      flags: [suspicious]
      retention: [full, summary, pointer]

# Statuses that mean a record is finished. Used by the hot index (formats.md §5), the Records
# dashboard (current vs closed), and the validator. Types not listed have no closed status.
closed_statuses:
  person: [inactive]
  organization: [inactive]
  project: [done, cancelled]
  goal: [achieved, missed, dropped]
  commitment: [done, dropped]
  decision: [reversed, superseded]
  event: [held, cancelled]
  risk: [resolved]
  question: [answered, dropped]
  idea: [adopted, parked, dropped]
  topic: [dormant]
  playbook: [retired]
  source: [processed]

# Field formats, used by system/tools/validate.py (errors) and system/tools/normalize.py (fixes).
#   ref   = one "[[folder/slug]]" link          refs  = list of links
#   list  = list of strings                     date  = YYYY-MM-DD
#   dt    = YYYY-MM-DD or ISO 8601 datetime     bool  = true / false
#   int   = whole number                        email = lowercase address (in lists: emails)
# Enum fields (common and per type, above) are lowercase snake_case values from their list.
field_formats:
  common: { aliases: list, sources: refs, supersedes: ref, superseded_by: ref, archived: bool, created: date, updated: date }
  person: { emails: emails, org: ref, last_contact: date }
  organization: {}
  project: { owner: ref, goal: ref, start: date, target: date }
  goal: { owner: ref, rank: int }
  commitment: { owner: ref, counterparty: ref, origin: ref, due: date, completed_on: date }
  decision: { deciders: refs, decided_on: date, revisit_on: date, reversible: bool }
  event: { attendees: refs, start: dt, end: dt, all_day: bool }
  risk: { owner: ref }
  question: { asked_by: ref, asked_on: date, answered_on: date }
  idea: { origin: ref }
  topic: {}
  playbook: { steps: steps, last_used: date, automatable: bool, auto_start: bool }
  source: { participants: refs, connector: text, captured_on: date, occurred_on: dt, import_id: text, original_path: text, flags: list, compacted_on: date }

autonomy_levels: [auto, propose, approve, never]
locked_classes:
  governance_settings: approve
  send_communication: approve
  share_expose: approve
  destructive: approve
  financial_legal_security: never

data_rule_handling: [ignore, pointer, summary, full]

connector_categories: [mail, calendar, meetings, messaging, files, crm, tasks, data, web, other]
tool_risk: [read, write, draft, send, share, delete, security]

registry_kinds: [skill, job, routine, trigger, type, dashboard, playbook]

routine_modifiers:
  when: [always, weekdays, weekends, sundays]
  target: [today, tomorrow]
  mode: [full, light]

insight_status: [new, seen, acted, dismissed, expired]
approval_status: [pending, approved, rejected, executed, expired]
question_status: [open, answered, dismissed]
